[package]
name = "fks-proto"
version = "0.1.0"
edition = "2024"
authors = ["nuniesmith"]
license = "MIT"
repository = "https://github.com/nuniesmith/fks"
description = "Centralized Protocol Buffer definitions for FKS services"
readme = "README.md"
keywords = ["fks", "proto", "grpc", "trading"]
categories = ["network-programming"]

[lib]
name = "fks_proto"
path = "src/lib.rs"

[dependencies]
# gRPC and Protobuf
tonic = "0.14.2"
tonic-prost = "0.14.2"
prost = "0.14.1"
prost-types = "0.14.1"

# Serialization (for converting proto types)
serde = { version = "1.0", features = ["derive"], optional = true }

[build-dependencies]
tonic-build = "0.14.2"
tonic-prost-build = "0.14.2"
prost-build = "0.14"

[features]
default = []
# Enable serde derives for proto types
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
