# QuestDB server configuration
# https://questdb.io/docs/reference/configuration/
#
# NOTE: key names must be valid for the pinned QuestDB version (see the image
# tag in infrastructure/docker/services/questdb/Dockerfile — currently 8.2.1).
# Unknown keys are logged as "Invalid settings ... probable typos" and silently
# ignored, so the intended setting never takes effect. The previous file used
# http.port / metrics.http.port / wal.enabled.default — all unrecognized in 8.2.1
# — and disabled the min server, which left the container permanently unhealthy.

# Main HTTP server (web console + REST) defaults to 0.0.0.0:9000 — no key needed.

# Min HTTP server — the lightweight health + Prometheus endpoint on :9003.
# MUST stay enabled: the compose healthcheck (curl :9003) and the Prometheus
# "questdb-direct" job (questdb:9003/metrics) both depend on it. Disabling it is
# what made fks_questdb report unhealthy even though the database was running.
http.min.enabled=true

# Prometheus metrics — exposed by the min server above at :9003/metrics.
metrics.enabled=true

# Line protocol (ILP) ingestion
line.tcp.enabled=true
line.tcp.net.bind.to=0.0.0.0:9009

# Shared worker count (tune to your CPU count)
shared.worker.count=2

# Storage root — matches the questdb_data volume mount in docker-compose.
# (WAL is enabled by default for new tables in QuestDB 8.x.)
cairo.root=/var/lib/questdb/db
