# =============================================================================
# GitHub Actions Labeler Configuration for FKS / Project JANUS
# =============================================================================
# Automatically applies labels to PRs based on changed files and branch names.
# Used by .github/workflows/labeler.yml with actions/labeler@v5
#
# Syntax reference: https://github.com/actions/labeler#common-examples
#
# NOTE: Top-level matchers (- changed-files, - head-branch) are OR conditions.
#       Within changed-files, multiple entries under any-glob-to-any-file are OR.
#       Negation patterns (!) exclude files matched by earlier patterns.
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# DOCUMENTATION
# ─────────────────────────────────────────────────────────────────────────────

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "docs/**/*"
          - "**/*.md"
          - "!BUILD_FIX_SUMMARY.md"
          - "!CI_STATUS.md"
          - "!QUICK_STATUS.md"
          - "!docs/audit/AUDIT_REPORT.md"
          - "!docs/audit/LLM_AUDIT_REPORT.md"

build-status:
  - changed-files:
      - any-glob-to-any-file:
          - "BUILD_FIX_SUMMARY.md"
          - "CI_STATUS.md"
          - "QUICK_STATUS.md"

