# =============================================================================
# FKS Trainer — Standalone GPU Rig Compose
# =============================================================================
# Run this on a dedicated GPU machine that trains models independently.
# The trainer connects back to fks_ruby via Tailscale VPN for bar data.
#
# Usage:
#   docker compose -f docker-compose.trainer.yml up -d
#   docker compose -f docker-compose.trainer.yml logs -f trainer
#   docker compose -f docker-compose.trainer.yml down
#
# Prerequisites:
#   - NVIDIA GPU with drivers + nvidia-container-toolkit installed
#   - .env file with required variables (see below)
#   - Network access to fks_ruby (via Tailscale or direct)
# =============================================================================

services:
    trainer:
        build:
            context: .
            dockerfile: infrastructure/docker/base/python-gpu/Dockerfile
            target: trainer
        image: nuniesmith/fks:trainer
        container_name: fks_trainer
        restart: unless-stopped
        # networks: intentionally omitted — trainer only needs outbound access
        # (Tailscale VPN to reach fks_ruby). No inbound Docker-network access needed.
        environment:
            # ── Connection to main FKS stack ──────────────────────────────────
            - ENGINE_DATA_URL=${ENGINE_DATA_URL:?ENGINE_DATA_URL required (e.g. http://100.x.x.x:8050)}
            - DATA_SERVICE_URL=${DATA_SERVICE_URL:-${ENGINE_DATA_URL}}
            - API_KEY=${API_KEY:-}
            - TRAINER_API_KEY=${TRAINER_API_KEY:-}
            # ── Redis — trainer heartbeat + training progress pub/sub ─────────
            - REDIS_URL=${REDIS_URL:-}
            # ── Training hyperparameters ──────────────────────────────────────
            - CNN_RETRAIN_EPOCHS=${CNN_RETRAIN_EPOCHS:-60}
            - CNN_RETRAIN_BATCH_SIZE=${CNN_RETRAIN_BATCH_SIZE:-64}
            - CNN_RETRAIN_LR=${CNN_RETRAIN_LR:-0.0001}
            - CNN_RETRAIN_PATIENCE=${CNN_RETRAIN_PATIENCE:-12}
            - CNN_RETRAIN_SYMBOLS=${CNN_RETRAIN_SYMBOLS:-MGC,SIL,MES,MNQ,M2K,MYM}
            - CNN_RETRAIN_DAYS_BACK=${CNN_RETRAIN_DAYS_BACK:-365}
            - CNN_RETRAIN_BARS_SOURCE=${CNN_RETRAIN_BARS_SOURCE:-engine}
            - CNN_RETRAIN_ORB_SESSION=${CNN_RETRAIN_ORB_SESSION:-all}
            # ── Validation thresholds (strict — standalone trains are final) ──
            - CNN_RETRAIN_MIN_ACC=${CNN_RETRAIN_MIN_ACC:-80}
            - CNN_RETRAIN_MIN_PRECISION=${CNN_RETRAIN_MIN_PRECISION:-75}
            - CNN_RETRAIN_MIN_RECALL=${CNN_RETRAIN_MIN_RECALL:-70}
            - CNN_RETRAIN_IMPROVEMENT=${CNN_RETRAIN_IMPROVEMENT:-0.0}
            # ── Paths ─────────────────────────────────────────────────────────
            - MODELS_DIR=/app/models
            - PYTHONPATH=/app/src
            - PYTHONUNBUFFERED=1
            - TZ=America/New_York
            # ── Callback (optional — notify main stack when training completes) ──
            - TRAIN_CALLBACK_URL=${TRAIN_CALLBACK_URL:-}
            # ── Weekly retrain scheduler ──────────────────────────────────────
            # Set WEEKLY_RETRAIN_ENABLED=1 to fire an automatic full pipeline
            # run on a weekly cron schedule inside the trainer container.
            # DOW: 0=Monday … 6=Sunday. HOUR: 0-23 ET.
            - WEEKLY_RETRAIN_ENABLED=${WEEKLY_RETRAIN_ENABLED:-0}
            - WEEKLY_RETRAIN_DOW=${WEEKLY_RETRAIN_DOW:-6}
            - WEEKLY_RETRAIN_HOUR=${WEEKLY_RETRAIN_HOUR:-2}
            - WEEKLY_RETRAIN_TRAIN_MODE=${WEEKLY_RETRAIN_TRAIN_MODE:-combined}
            - WEEKLY_RETRAIN_CALLBACK_URL=${WEEKLY_RETRAIN_CALLBACK_URL:-}
            - WEEKLY_RETRAIN_SYMBOLS=${WEEKLY_RETRAIN_SYMBOLS:-}
        volumes:
            - trainer_dataset:/app/dataset
            - ./models:/app/models
            # ⚠ DEV ONLY: This bind mount overrides baked-in source code.
            # Useful for rapid iteration but dangerous for reproducibility —
            # models may train on uncommitted/untested code.
            # For production reproducibility, remove this mount or use --profile dev.
            - ./src:/app/src
        ports:
            - "${TRAINER_PORT:-8200}:8200"
        healthcheck:
            test:
                ["CMD-SHELL", "curl -sf http://localhost:8200/health || exit 1"]
            interval: 60s
            timeout: 15s
            start_period: 30s
            retries: 3
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
                limits:
                    memory: 12g
        logging:
            driver: json-file
            options:
                max-size: "50m"
                max-file: "5"

volumes:
    trainer_dataset:
        driver: local
