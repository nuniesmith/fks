[package]
name         = "rustrade-notify"
description  = "Webhook notifications (Discord, Slack, generic HTTP) as supervised TradingServices for the rustrade framework"
readme       = "README.md"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
keywords   = ["trading", "rustrade", "discord", "webhook", "notifications"]
categories = ["asynchronous", "web-programming::http-client"]

[features]
default      = ["discord"]
discord      = ["dep:reqwest", "dep:serde", "dep:serde_json"]
http-generic = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
rustrade-core       = { workspace = true }
rustrade-supervisor = { workspace = true }

async-trait = { workspace = true }
tokio       = { workspace = true, features = ["sync", "time", "rt"] }
tokio-util  = { workspace = true }
tracing     = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }

# Webhook HTTP — feature-gated so a bot that only wants the trait surface
# (e.g. tests, custom transports) doesn't pull in reqwest.
reqwest    = { workspace = true, optional = true }
serde      = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
