[package]
name = "spawner"
version = "0.1.0"
edition = "2021"
description = "FKS Bot Spawner — Docker container lifecycle manager for isolated bot workloads"

[[bin]]
name = "spawner"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio        = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
async-stream = "0.3"
async-trait  = "0.1"

# HTTP server
axum = { workspace = true }

# Docker SDK
bollard = "0.19"

# Serialisation
serde      = { workspace = true }
serde_json = { workspace = true }

# Observability
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus         = { workspace = true }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }

# Utilities
uuid       = { workspace = true }
chrono     = { workspace = true }
once_cell  = "1"

# Database — optional, gated behind the `db` feature.
# When the feature is off the spawner runs in stateless mode (no Postgres).
sqlx = { version = "0.8", default-features = false, optional = true, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "macros",
    "migrate",
] }

[features]
default = ["db"]
# Enables Postgres persistence of spawn/stop events into bot_runs.
db = ["dep:sqlx"]

[dev-dependencies]
tokio        = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-stream = { workspace = true }
tower        = { version = "0.5", features = ["util"] }
async-trait  = "0.1"
chrono      = { workspace = true }
serde_json = { workspace = true }
