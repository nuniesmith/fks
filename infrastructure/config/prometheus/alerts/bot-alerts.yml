# =============================================================================
# bot-alerts.yml — Prometheus alert rules for FKS Bot Spawner
#
# Scrape source: file_sd_configs from /etc/prometheus/sd/bots.json
# Each bot container must expose :9091/metrics with the following gauges:
#   fks_bot_pnl_dollars        current P&L in USD
#   fks_bot_signals_total      cumulative signal count (counter)
#   fks_bot_trades_total       cumulative trade count (counter)
#   fks_bot_win_rate           win rate 0.0–1.0
#   fks_bot_uptime_seconds     seconds since container start
# =============================================================================
groups:
  # ─────────────────────────────────────────────────────────────────────────
  # Bot liveness — detect stopped / missing bots
  # ─────────────────────────────────────────────────────────────────────────
  - name: bot-liveness
    rules:
      - alert: BotStopped
        expr: up{job="fks-bots"} == 0
        for: 2m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Bot container {{ $labels.container_name }} is down"
          description: >
            Bot {{ $labels.bot_id }} ({{ $labels.container_name }}) has not been
            reachable for 2 minutes. The container may have exited or crashed.
            Mode: {{ $labels.mode }}.
          runbook: "Check logs: curl http://spawner:8090/container/{{ $labels.container_name }}/logs"

      - alert: BotUptimeTooShort
        expr: fks_bot_uptime_seconds{job="fks-bots"} < 60
        for: 0m
        labels:
          severity: info
          team: trading
        annotations:
          summary: "Bot {{ $labels.container_name }} restarted recently"
          description: >
            Bot {{ $labels.bot_id }} has uptime of only {{ $value | humanizeDuration }}.
            This may indicate a crash-loop.

  # ─────────────────────────────────────────────────────────────────────────
  # Bot performance — detect high drawdown
  # ─────────────────────────────────────────────────────────────────────────
  - name: bot-performance
    rules:
      - alert: BotHighDrawdown
        expr: fks_bot_pnl_dollars{job="fks-bots"} < -500
        for: 5m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Bot {{ $labels.container_name }} has high drawdown: ${{ $value | humanize }}"
          description: >
            Bot {{ $labels.bot_id }} (mode: {{ $labels.mode }}) has an unrealised
            P&L of ${{ $value | humanize }}. Drawdown threshold: -$500.
            Consider stopping this bot via the spawner API or web UI.
          runbook: "Stop bot: curl -X POST http://spawner:8090/container/{{ $labels.container_name }}/stop"

      - alert: BotLowWinRate
        # Guard: a bot with no trades reports win_rate=0.0 and would false-fire;
        # only evaluate bots that have actually traded.
        expr: |
          fks_bot_win_rate{job="fks-bots"} < 0.3
          and fks_bot_trades_total{job="fks-bots"} > 10
        for: 30m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Bot {{ $labels.container_name }} win rate below 30%"
          description: >
            Bot {{ $labels.bot_id }} has a win rate of {{ $value | humanizePercentage }}
            over the last 30 minutes. Expected minimum: 30%.

  # ─────────────────────────────────────────────────────────────────────────
  # Bot activity — detect signal / trade stalls
  # ─────────────────────────────────────────────────────────────────────────
  - name: bot-activity
    rules:
      - alert: BotNoSignals
        expr: >
          rate(fks_bot_signals_total{job="fks-bots"}[15m]) == 0
          and fks_bot_uptime_seconds{job="fks-bots"} > 300
        for: 15m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Bot {{ $labels.container_name }} has produced no signals in 15 min"
          description: >
            Bot {{ $labels.bot_id }} (mode: {{ $labels.mode }}) has been running for
            over 5 minutes but emitted no signals in the last 15 minutes.
            The bot may be stalled, waiting for data, or have a configuration issue.

      - alert: BotNoTrades
        expr: >
          rate(fks_bot_trades_total{job="fks-bots",mode="live"}[30m]) == 0
          and fks_bot_uptime_seconds{job="fks-bots"} > 600
        for: 30m
        labels:
          severity: info
          team: trading
        annotations:
          summary: "Live bot {{ $labels.container_name }} has placed no trades in 30 min"
          description: >
            Live bot {{ $labels.bot_id }} has been running for over 10 minutes
            but placed no trades in the last 30 minutes. This may be expected
            outside market hours or if the strategy is waiting for a setup.

  # ─────────────────────────────────────────────────────────────────────────
  # Spawner service health
  # ─────────────────────────────────────────────────────────────────────────
  - name: spawner-health
    rules:
      - alert: SpawnerDown
        expr: up{job="fks-spawner"} == 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "FKS Bot Spawner is unreachable"
          description: >
            The fks_bot_spawner service has not responded to scrapes for 1 minute.
            Bot lifecycle management (spawn/stop/restart) is unavailable.

      # Removed SpawnerAtBotCapacity: its RHS metric fks_spawner_max_bots_limit
      # is never exported by the spawner (siblings fks_spawner_running_bots etc.
      # are), so the >= comparison matched nothing and the alert could never
      # fire. Restore once the spawner exports its max-bots limit.
