[package]
name         = "rustrade"
description  = "Open-source trading bot framework — facade crate that wires core types, supervisor, and risk into a runnable Bot"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
keywords   = ["trading", "framework", "bot", "tokio", "supervised"]
categories = ["asynchronous", "concurrency"]

[dependencies]
rustrade-core       = { workspace = true }
rustrade-supervisor = { workspace = true }
rustrade-risk       = { workspace = true }

async-trait = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
tracing     = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
