# FKS Trading Platform - NGINX Configuration (HTTP-only)
# Tailscale terminates TLS before traffic reaches nginx.
# All auth is handled by tailnet membership — no Authelia.
#
# NOTE: the Ruby data/web service (fks_ruby) was removed in the janus migration.
# The SvelteKit dashboard (fks_webui:3000) is now the single web + backend seam —
# its server hook (src/web/src/hooks.server.ts) proxies /api, /sse, /bars, /factory,
# /kraken, /fapi to janus / spawner / Prometheus / QuestDB (or stubs them). So all
# page + backend-prefix traffic goes to fks_webui; only the observability UIs and
# janus /ws/ keep direct routes.
#
# X-Internal-Token: a shared secret injected by nginx on every proxied request
# so that upstreams can trust the request came through nginx (not from the internet).
# Set NGINX_INTERNAL_TOKEN in the environment / docker-compose and reference it
# here via the $nginx_internal_token variable populated in nginx.conf / this file.
# For simplicity we use a hard-coded sentinel that is ONLY meaningful inside the
# Docker network — the browser can never reach fks_ruby:8000 directly.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"nginx","ssl":"off"}';
    }

    # Detailed Service Health Checks
    location /health/web {
        access_log off;
        resolver 127.0.0.11 valid=30s;
        set $web_health "http://fks_webui:3000";
        proxy_pass $web_health/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /health/ruby-web {
        access_log off;
        resolver 127.0.0.11 valid=30s;
        set $ruby_web_health "http://fks_webui:3000";
        proxy_pass $ruby_web_health/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /health/ruby-data {
        access_log off;
        resolver 127.0.0.11 valid=30s;
        set $ruby_data_health "http://fks_webui:3000";
        proxy_pass $ruby_data_health/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /health/janus {
        access_log off;
        resolver 127.0.0.11 valid=30s;
        set $janus_health "http://fks_janus:8080";
        proxy_pass $janus_health/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /health/trainer {
        access_log off;
        resolver 127.0.0.11 valid=30s;
        set $trainer_health "http://fks_trainer:8200";
        proxy_pass $trainer_health/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /health/grafana {
        access_log off;
        resolver 127.0.0.11 valid=30s;
        set $grafana_health "http://fks_grafana:3000";
        proxy_pass $grafana_health/api/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /health/questdb {
        access_log off;
        resolver 127.0.0.11 valid=30s;
        set $questdb_backend "http://fks_questdb:9000";
        proxy_pass $questdb_backend/exec?query=select%201;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # RUBY WEB APPLICATION - Main Landing Page (fks_ruby — consolidated container)

    location / {
        resolver 127.0.0.11 valid=30s;
        set $web_backend "http://fks_webui:3000";

        proxy_pass $web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_intercept_errors on;
        error_page 502 503 504 =503 @web_unavailable;
    }

    # SSE / streaming endpoints — all live in fks_ruby (formerly fks_ruby), must be unbuffered
    # Covers: /sse/dashboard, /sse/health, /sse/chat, /sse/dom, /sse/sim,
    #         /sse/grok/*, /api/live/stream, /api/pipeline/run,
    #         /api/pretrade/* SSE responses

    # /api/* SSE endpoints that need unbuffered streaming.
    # Must come BEFORE the generic /api/ catch-all so nginx picks these up
    # with the correct proxy_buffering / timeout settings.
    location ~* ^/api/(live/stream|pipeline/run|data/stream|sim/sse|grok/sse|chat/sse|dom/sse|pretrade/sse|chain/whale/sse|factory/news/sse) {
        resolver 127.0.0.11 valid=30s;
        set $data_sse "http://fks_webui:3000";

        proxy_pass $data_sse;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";

        proxy_http_version 1.1;
        proxy_set_header Connection        '';
        proxy_set_header Upgrade           '';

        proxy_buffering             off;
        proxy_cache                 off;
        proxy_request_buffering     off;
        chunked_transfer_encoding   on;
        add_header X-Accel-Buffering "no" always;

        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout   60s;

        proxy_intercept_errors off;
    }

    location /sse/ {
        resolver 127.0.0.11 valid=30s;
        set $data_sse "http://fks_webui:3000";

        proxy_pass $data_sse;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";

        # SSE requires HTTP/1.1 with an empty Connection header so nginx does
        # not close the upstream keepalive connection between events.
        proxy_http_version 1.1;
        proxy_set_header Connection        '';
        proxy_set_header Upgrade           '';

        # Disable ALL buffering — critical for SSE.  proxy_buffering off alone
        # is not always enough when a cache zone is active; the upstream header
        # X-Accel-Buffering: no is the belt-and-suspenders guarantee.
        proxy_buffering             off;
        proxy_cache                 off;
        proxy_request_buffering     off;
        chunked_transfer_encoding   on;
        add_header X-Accel-Buffering "no" always;

        # Long timeouts — SSE connections are long-lived by design.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout   60s;

        # Do NOT intercept upstream errors — let the EventSource see them so
        # the browser can reconnect on its own schedule.
        proxy_intercept_errors off;
    }

    # Ruby data service routes that share the /api/janus/ prefix.
    # These must be listed BEFORE the Janus-only regex below so nginx
    # matches them first (longest-prefix / exact wins over regex).
    #
    # /api/janus/signal/html  — HTMX fragment rendered by fks_ruby (panels.py)
    # /api/janus/signal       — signal panel JSON, also from fks_ruby
    #
    # Add further fks_ruby sub-paths here as needed rather than widening the
    # Janus regex.

    location = /api/janus/signal/html {
        limit_req zone=api burst=50 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $data_backend "http://fks_webui:3000";

        proxy_pass $data_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location = /api/janus/signal {
        limit_req zone=api burst=50 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $data_backend "http://fks_webui:3000";

        proxy_pass $data_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # JANUS-ONLY API routes — explicitly carved out before the data catch-all
    # Janus owns: /api/signals, /api/inference, /api/model,
    #             /api/janus, /api/session (trading session control)
    # NOTE: /api/regime is intentionally excluded here — it is served by fks_ruby.
    # NOTE: /api/janus/signal and /api/janus/signal/html are carved out above
    #       — they are served by fks_ruby, not the Rust Janus service.

    location ~* ^/api/(signals|inference|model|janus|session)(/|$) {
        limit_req zone=api burst=50 nodelay;
        resolver 127.0.0.11 valid=30s;
        # → the webui adapter (NOT raw janus): it reshapes /api/signals,
        #   /api/janus/* etc. to what the dashboard expects, and stubs the rest.
        set $api_backend "http://fks_webui:3000";

        proxy_pass $api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @janus_unavailable;
    }

    # DATA SERVICE — all /api/* not matched above (fks_ruby — consolidated container)
    # fks_ruby owns: /api/health, /api/health/html, /api/live-risk,
    #   /api/time, /api/focus, /api/grok, /api/chat, /api/backup,
    #   /api/copy-trade, /api/dom, /api/news, /api/pipeline, /api/plan,
    #   /api/pretrade, /api/reddit, /api/rithmic, /api/sim, /api/sources,
    #   /api/swing, /api/tasks, /api/trade, /api/data/*, /api/reports,
    #   /api/market, /api/journal, /api/trading, /api/live, /api/info,
    #   /api/regime, /api/risk, /api/orb, /api/alerts, /api/no-trade

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $data_backend "http://fks_webui:3000";

        proxy_pass $data_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout    120s;

        proxy_intercept_errors on;
        error_page 502 503 504 =503 @data_unavailable;
    }

    # WebSocket endpoint
    location /ws/ {
        resolver 127.0.0.11 valid=30s;
        set $janus_backend "http://fks_janus:8080";

        proxy_pass $janus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Non-/api/ top-level data service routes
    # /health, /bars, /trades, /positions, /risk, /journal, /audit,
    # /analysis, /actions, /cnn, /kraken, /settings, /trainer, /backup,
    # /pine, /trading, /dom, /pretrade, /htmx, /charting-proxy, /data
    #
    # WEBUI-TERMINAL routes (added 2026-03-23):
    # /terminal  — main terminal landing page (render_terminal() shell)
    # /overview  — alias for /terminal
    # /workspaces/* — lazy-loaded workspace fragments (HTMX tab content)
    # /partials/*   — HTMX auto-refresh partial fragments (market table, signals, etc.)

    # ── Static assets — browser-side caching (WEBUI-B) ───────────────────
    # Must appear BEFORE the main API location regex so nginx matches it first.
    # Assets are not content-hash-versioned, so we use conservative TTLs:
    #   CSS / JS   → 1 hour  (short enough to pick up redeploys quickly)
    #   Images/SVG → 1 day   (icons and favicons rarely change)
    # The upstream FastAPI StaticFiles handler already emits ETag + Last-Modified
    # headers, so conditional requests (304 Not Modified) work correctly.
    location ~* ^/static/.*\.(css|js)$ {
        limit_req zone=api burst=200 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $data_backend "http://fks_webui:3000";

        proxy_pass $data_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        # 1-hour public cache; allow stale-while-revalidate so the browser
        # serves the cached copy instantly while revalidating in the background.
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=300" always;

        proxy_connect_timeout 15s;
        proxy_send_timeout    15s;
        proxy_read_timeout    30s;
    }

    location ~* ^/static/.*\.(svg|png|ico|webp|jpg|jpeg|gif|woff|woff2|ttf|eot)$ {
        limit_req zone=api burst=200 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $data_backend "http://fks_webui:3000";

        proxy_pass $data_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        # 1-day public cache for images and fonts (very rarely change)
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;

        proxy_connect_timeout 15s;
        proxy_send_timeout    15s;
        proxy_read_timeout    30s;
    }

    location ~* ^/(health$|bars|trades|positions|risk|journal|audit|analysis|actions|cnn|kraken|settings|trainer|backup|pine|trading|dom|pretrade|htmx|charting-proxy|data|sync|ruby|metrics|terminal|overview|workspaces|partials|factory|static) {
        limit_req zone=api burst=50 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $data_backend "http://fks_webui:3000";

        proxy_pass $data_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout   120s;
    }


    # CHARTING
    # The SvelteKit /charts page (and any /charts/* subpath) is served by
    # fks_webui via the catch-all "/" above. The old Ruby nav-shell page and the
    # separate fks_charting SPA (service removed) are both gone.


    # GRAFANA - Dashboard

    location /grafana/ {
        resolver 127.0.0.11 valid=30s;
        set $grafana_backend "http://fks_grafana:3000";

        # Don't rewrite - Grafana is configured with SERVE_FROM_SUB_PATH=true
        proxy_pass $grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;

        # WebSocket support for Grafana Live
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @grafana_unavailable;
    }

    # PROMETHEUS - Metrics

    location /prometheus/ {
        resolver 127.0.0.11 valid=30s;
        set $prometheus_backend "http://fks_prometheus:9090";

        rewrite ^/prometheus/(.*) /$1 break;
        proxy_pass $prometheus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # QUESTDB - Time Series Database Console

    location /questdb/ {
        resolver 127.0.0.11 valid=30s;
        set $questdb_backend "http://fks_questdb:9000";

        rewrite ^/questdb/(.*) /$1 break;
        proxy_pass $questdb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # JAEGER - Distributed Tracing UI

    location /jaeger/ {
        resolver 127.0.0.11 valid=30s;
        set $jaeger_backend "http://fks_jaeger:16686";

        rewrite ^/jaeger/(.*) /$1 break;
        proxy_pass $jaeger_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ERROR HANDLING

    location @web_unavailable {
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><title>FKS Trading - Starting</title><meta http-equiv="refresh" content="5"><style>body{font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#1a1a2e;color:#fff}div{text-align:center;padding:2rem}h1{color:#4ecdc4}p{color:#ccc}.loader{border:4px solid #333;border-top:4px solid #4ecdc4;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style></head><body><div><h1>Ruby Dashboard</h1><div class="loader"></div><p>Web application is starting up...</p><p style="font-size:0.9em;opacity:0.7">This page will refresh automatically.</p></div></body></html>';
    }

    location @janus_unavailable {
        default_type application/json;
        return 503 '{"status":"unavailable","service":"janus","message":"Janus trading service is starting up. Please try again in a moment."}';
    }

    location @data_unavailable {
        default_type application/json;
        return 503 '{"status":"unavailable","service":"data","message":"Data service is starting up. Please try again in a moment."}';
    }

    location @grafana_unavailable {
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><title>Grafana - Starting</title><meta http-equiv="refresh" content="5"><style>body{font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#1a1a2e;color:#fff}div{text-align:center;padding:2rem}h1{color:#4ecdc4}p{color:#ccc}.loader{border:4px solid #333;border-top:4px solid #4ecdc4;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style></head><body><div><h1>Grafana Dashboard</h1><div class="loader"></div><p>Grafana is starting up...</p><p style="font-size:0.9em;opacity:0.7">This page will refresh automatically.</p></div></body></html>';
    }

    location @ruby_data_unavailable {
        default_type application/json;
        return 503 '{"status":"unavailable","service":"ruby-data","message":"Ruby data service is starting up. Please try again in a moment."}';
    }

    location @trainer_unavailable {
        default_type application/json;
        return 503 '{"status":"unavailable","service":"trainer","message":"Trainer service is offline. Start with: docker compose --profile training up -d trainer"}';
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
