[package]
name        = "kucoin-stub-bot"
version     = "0.0.1"
edition     = "2024"
publish     = false
description = "Wires the real KuCoinClient + KucoinExchangeAdapter into rustrade::Bot with a stub brain"

[dependencies]
rustrade        = { workspace = true }
rustrade-kucoin = { workspace = true }
exchange-apiws  = { path = "../../../exchange-apiws", version = "0.1.10" }

async-trait = { workspace = true }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing     = { workspace = true }
anyhow      = { workspace = true }
