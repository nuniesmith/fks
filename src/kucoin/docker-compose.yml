services:
  # ─────────────────────────────────────────────────────────────────────────────
  # KuCoin Futures SAR - Rust
  # ─────────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      args:
        APP_SRC: src
        # Leave 1 core for the bot + OS; give Optuna the rest.
        # Adjust to match your desktop core count.
        OPTUNA_JOBS: "11"
    env_file:
      - .env
    container_name: kucoin_app
    environment:
      BOT_MODE: ${BOT_MODE:-sim}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/0
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_ENABLED: ${DISCORD_ENABLED:-false}
      SERVICE_PORT: "8288"
      OPTIMIZER_PORT: "8289"
      # Optuna parallelism — reads this in optimizer.py via os.environ.
      # Matches the OPTUNA_JOBS build arg above.
      OPTUNA_JOBS: "11"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8288:8288" # bot HTTP heartbeat
      - "127.0.0.1:8289:8289" # optimizer API (POST /run, GET /health)
    volumes:
      - ./logs:/app/logs # all logs (bot/, optimizer/, supervisord.log)
    networks:
      - kucoin-network
    # Give the container access to most of the desktop CPUs.
    # 12-core desktop → 11 for Optuna fork workers + 1 for bot/OS.
    cpus: "12.0"
    # Optuna's forked workers are memory-hungry; 8 GB should be comfortable.
    mem_limit: "8g"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis — shared state, pub/sub, and CMA-ES warm-start storage
  #
  # Custom Dockerfile: docker/redis/Dockerfile
  #   - Base image : redis:8.6-alpine
  #   - Entrypoint : docker/redis/entrypoint.sh
  #       Disables Transparent Huge Pages (THP) as root, then drops to
  #       the `redis` user via the official docker-entrypoint.sh / gosu.
  #
  # DO NOT set `user:` here — the entrypoint needs to start as root to write
  # /sys/kernel/mm/transparent_hugepage/{enabled,defrag}, and gosu handles the
  # privilege drop to redis:redis automatically afterward.
  #
  # sysctls are applied by the Docker daemon (not inside the container), so
  # cap_drop: ALL is still safe to keep.
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    env_file:
      - .env
    container_name: kucoin_redis
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # entrypoint must chown /data before dropping to the redis user
      - SETUID # gosu needs this to switch from root → redis
      - SETGID # gosu needs this to switch from root → redis group
    security_opt:
      - no-new-privileges:true
    # HOST SETUP REQUIRED — vm.overcommit_memory and net.core.somaxconn are not
    # container-namespaced sysctls; Docker cannot set them per-container.
    # Apply on the host before starting the stack:
    #
    #   sudo sysctl -w vm.overcommit_memory=1
    #   sudo sysctl -w net.core.somaxconn=1024
    #
    # To persist across reboots add to /etc/sysctl.d/99-redis.conf:
    #   vm.overcommit_memory = 1
    #   net.core.somaxconn   = 1024
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp
      - /var/run
    networks:
      - kucoin-network
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
    restart: unless-stopped
    # Healthcheck is defined in docker/redis/Dockerfile via HEALTHCHECK instruction.
    # Overriding it here only to make the `condition: service_healthy` dependency
    # above work correctly regardless of how the image was built or pulled.
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kucoin-network:
    driver: bridge

volumes:
  redis_data:
