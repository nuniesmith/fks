# =============================================================================
# Web CI — SvelteKit type-check + build
# =============================================================================
# Runs svelte-check (TypeScript) and a production build on every PR that
# touches the frontend.  Playwright E2E tests are excluded here — they need
# a live backend stack and run via the paper-trading-test workflow instead.
# =============================================================================

name: 🌐 Web

on:
    pull_request:
        paths:
            - "src/web/**"
            - ".github/workflows/web.yml"
    push:
        branches: [main]
        paths:
            - "src/web/**"
            - ".github/workflows/web.yml"

concurrency:
    group: web-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: src/web

jobs:
    check:
        name: type-check + build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4

            - name: 🟢 Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: src/web/package-lock.json

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🔄 Generate SvelteKit types
              run: npx svelte-kit sync

            - name: 🔍 svelte-check (TypeScript)
              run: npm run check

            - name: 🏗️ Production build
              run: npm run build
