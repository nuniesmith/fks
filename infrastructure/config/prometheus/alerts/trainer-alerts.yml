# Trainer / GPU Alert Rules for FKS Trading Platform
# Monitors the Ruby GPU-CNN trainer (`job_name: "trainer"`, scraped at
# trainer:8200/metrics/prometheus). Metrics: trainer_up, trainer_gpu_available,
# trainer_gpu_memory_total_bytes, trainer_champion_exists,
# trainer_last_run_accuracy/precision/recall, trainer_last_run_promoted,
# trainer_last_run_images, trainer_uptime_seconds.
#
# The trainer is an OPTIONAL GPU service (compose `training` profile — "not
# always running"). To avoid noise when it is intentionally down, every rule is
# gated on `trainer_up == 1`: these fire only while the trainer is actually up,
# never merely because the training profile isn't deployed. (There is therefore
# deliberately no hard "trainer is down" alert here.)

groups:
  # ===========================================================================
  # GPU availability
  # ===========================================================================
  - name: trainer_gpu_alerts
    rules:
      - alert: TrainerGpuUnavailable
        # The trainer is running but reports no GPU — it will fall back to CPU
        # (orders of magnitude slower) or stall. 15m avoids flapping during a
        # driver/runtime re-init at container start.
        expr: trainer_up == 1 and trainer_gpu_available == 0
        for: 15m
        labels:
          severity: warning
          service: trainer
          component: training
        annotations:
          summary: "Trainer is running without a GPU"
          description: >
            The GPU-CNN trainer is up but `trainer_gpu_available` is 0 — no GPU
            is visible to the container. Training will fall back to CPU (very
            slow) or stall. Check the NVIDIA runtime / `nvidia-container-toolkit`
            and that the host GPU is healthy.
          runbook: "docker compose --profile training logs trainer"

  # ===========================================================================
  # Champion model & training quality
  # ===========================================================================
  - name: trainer_model_alerts
    rules:
      - alert: TrainerNoChampionModel
        # The live Burn inference path (janus forward) loads a champion
        # checkpoint; if the trainer is up yet none exists after an hour, the
        # ML signal path has nothing to serve.
        expr: trainer_up == 1 and trainer_champion_exists == 0
        for: 1h
        labels:
          severity: warning
          service: trainer
          component: training
        annotations:
          summary: "Trainer has no champion model"
          description: >
            `trainer_champion_exists` is 0 — no champion model has been promoted.
            The live ML inference path (janus forward) has nothing to load, so
            ML-fused signals stay disabled. Kick a training run or restore a
            champion checkpoint.

      - alert: TrainerLastRunLowAccuracy
        # Surfaces a degrading champion: the most recent run's validation
        # accuracy fell below a usable floor. Tune the threshold to the model.
        expr: trainer_up == 1 and trainer_last_run_accuracy < 0.55
        for: 5m
        labels:
          severity: info
          service: trainer
          component: training
        annotations:
          summary: "Last training run accuracy below 0.55"
          description: >
            `trainer_last_run_accuracy` is {{ $value | humanize }} — the most
            recent training run scored below the 0.55 floor. The champion may be
            stale or the feature/label pipeline may have regressed.
