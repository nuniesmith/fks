# ============================================================================
# Market Data Pipeline Alert Rules - Week 1 Signal Pipeline
# ============================================================================
# Enhanced alerting for real-time market data ingestion monitoring
# ============================================================================

groups:
    # ========================================================================
    # CRITICAL - Immediate action required
    # ========================================================================
    - name: market_data_pipeline_critical
      interval: 15s
      rules:
          # ------------------------------------------------------------------
          # Data Gap Duration - Critical if gap persists > 5 minutes
          # ------------------------------------------------------------------
          # `timestamp(trades_ingested_total)` returns the QUERY eval time, not the
          # sample's last-change time, so `time() - timestamp(...)` is always ~0 and
          # the old expr could never fire. Detect the gap directly: no increment to
          # the per-series counter over the window (per exchange/symbol).
          - alert: DataGapDurationCritical
            expr: |
                increase(trades_ingested_total[5m]) == 0
            for: 1m
            labels:
                severity: critical
                component: data-factory
                pipeline: market-data
            annotations:
                summary: "No trades received for {{ $labels.exchange }}/{{ $labels.symbol }} for >5 minutes"
                description: |
                    No new trades have been ingested for {{ $labels.exchange }}/{{ $labels.symbol }}
                    in over 5 minutes. This indicates a critical data gap that needs immediate attention.
                runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/data-gap-critical.md"
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

          # ------------------------------------------------------------------
          # Complete Ingestion Halt
          # ------------------------------------------------------------------
          - alert: IngestionHalted
            expr: sum(rate(trades_ingested_total[2m])) == 0
            for: 2m
            labels:
                severity: critical
                component: data-factory
                pipeline: market-data
            annotations:
                summary: "Trade ingestion has completely stopped"
                description: |
                    No trades have been ingested across all exchanges and symbols for >2 minutes.
                    The entire data pipeline may be down. Immediate investigation required.
                runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/ingestion-halted.md"
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

          # Removed ILPBufferOverflowImminent + HighIngestionErrorRate
          # (2026-07-01): data_factory_ilp_buffer_size and
          # data_factory_errors_total are never exported by the unified janus
          # binary's live path and have no live equivalent — the alerts could
          # never fire. Restore from git history if those gauges get wired.

          # ------------------------------------------------------------------
          # QuestDB Write Failures Sustained
          # ------------------------------------------------------------------
          - alert: QuestDBWriteFailuresSustained
            # Repointed: questdb_write_errors_total is not an exported metric
            # name; questdb_unhandled_errors_total is the live error counter.
            expr: rate(questdb_unhandled_errors_total[5m]) > 1
            for: 2m
            labels:
                severity: critical
                component: questdb
                pipeline: market-data
            annotations:
                summary: "Sustained QuestDB write failures"
                description: |
                    QuestDB is experiencing {{ $value | printf "%.2f" }} write errors per second.
                    Data is being lost. Check disk space, database health, and ILP connections.
                runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/questdb-write-failures.md"
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

    # ========================================================================
    # WARNING - Investigate soon
    # ========================================================================
    - name: market_data_pipeline_warning
      interval: 30s
      rules:
          # ------------------------------------------------------------------
          # Data Gap Duration Warning (> 2 minutes)
          # ------------------------------------------------------------------
          # Fresh 2–5 min gap (escalates to DataGapDurationCritical at 5 min): no
          # trades in the last 2 min, but there WERE some in the last 5 min. Same
          # counter-increment approach as the critical rule (the old timestamp()
          # expr was structurally dead — see above).
          - alert: DataGapDurationWarning
            expr: |
                increase(trades_ingested_total[2m]) == 0
                and
                increase(trades_ingested_total[5m]) > 0
            for: 1m
            labels:
                severity: warning
                component: data-factory
                pipeline: market-data
            annotations:
                summary: "No trades received for {{ $labels.exchange }}/{{ $labels.symbol }} for >2 minutes"
                description: |
                    No new trades have been ingested for {{ $labels.exchange }}/{{ $labels.symbol }}
                    in over 2 minutes. Monitor closely - may escalate to critical.
                runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/data-gap-warning.md"
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

          # Removed ILPBufferHigh (2026-07-01): data_factory_ilp_buffer_size is
          # never exported (see the critical-group note above).

          # ------------------------------------------------------------------
          # Ingestion Rate Drop
          # ------------------------------------------------------------------
          - alert: IngestionRateDropped
            expr: |
                sum(rate(trades_ingested_total[5m])) <
                0.5 * sum(rate(trades_ingested_total[5m] offset 1h))
                and sum(rate(trades_ingested_total[5m])) > 0
            for: 5m
            labels:
                severity: warning
                component: data-factory
                pipeline: market-data
            annotations:
                summary: "Trade ingestion rate dropped significantly"
                description: |
                    Current ingestion rate is less than 50% of the rate 1 hour ago.
                    Current: {{ $value | printf "%.1f" }} trades/sec vs historical baseline.
                    May indicate partial connectivity issues or market conditions.
                runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/ingestion-rate-dropped.md"
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

          # Removed BackfillStalled (2026-07-01): backfills_completed_total is
          # not exported, and the rate(...)==0 form is structurally silent in
          # exactly the stall case (rate over an absent/never-incremented
          # counter yields an empty vector, not 0), so the alert could never
          # fire. Needs the counter wired + an `or vector(0)` guard to work.

          # ------------------------------------------------------------------
          # Latency Spike
          # ------------------------------------------------------------------
          - alert: IngestionLatencySpike
            expr: |
                histogram_quantile(0.99, sum(rate(ingestion_latency_ms_bucket[5m])) by (le)) > 500
                and
                histogram_quantile(0.99, sum(rate(ingestion_latency_ms_bucket[5m])) by (le)) <= 1000
            for: 5m
            labels:
                severity: warning
                component: data-factory
                pipeline: market-data
                slo: latency
            annotations:
                summary: "Ingestion latency elevated"
                description: |
                    P99 ingestion latency is {{ $value | printf "%.0f" }}ms (warning: >500ms, SLO: <1000ms).
                    Network latency or processing delays may be affecting data freshness.
                runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/latency-spike.md"
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

          # ------------------------------------------------------------------
          # Single Exchange Throughput Anomaly
          # ------------------------------------------------------------------
          - alert: ExchangeThroughputAnomaly
            expr: |
                abs(
                    rate(trades_ingested_total[5m]) -
                    avg_over_time(rate(trades_ingested_total[5m])[1h:5m])
                ) > 2 * stddev_over_time(rate(trades_ingested_total[5m])[1h:5m])
            for: 10m
            labels:
                severity: warning
                component: data-factory
                pipeline: market-data
            annotations:
                summary: "Unusual trade volume for {{ $labels.exchange }}/{{ $labels.symbol }}"
                description: |
                    Trade ingestion rate for {{ $labels.exchange }}/{{ $labels.symbol }}
                    is significantly outside normal range (>2 standard deviations).
                    Could indicate exchange issues, unusual market activity, or data problems.
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

          # ------------------------------------------------------------------
          # High Deduplication Miss Rate
          # ------------------------------------------------------------------
          - alert: HighDeduplicationMissRate
            expr: |
                rate(backfill_dedup_misses_total[10m]) /
                (rate(backfill_dedup_hits_total[10m]) + rate(backfill_dedup_misses_total[10m]) + 0.001) > 0.8
            for: 15m
            labels:
                severity: warning
                component: backfill
                pipeline: market-data
            annotations:
                summary: "High rate of new gaps being detected"
                description: |
                    {{ $value | humanizePercentage }} of gap detections are new (not deduplicated).
                    This may indicate a systemic issue creating many gaps, or deduplication not working properly.
                runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/high-dedup-miss-rate.md"
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

    # ========================================================================
    # INFO - Awareness and tracking
    # ========================================================================
    - name: market_data_pipeline_info
      interval: 1m
      rules:
          # ------------------------------------------------------------------
          # Backfill Activity High
          # ------------------------------------------------------------------
          - alert: BackfillActivityHigh
            expr: backfills_running > 5
            for: 5m
            labels:
                severity: info
                component: backfill
                pipeline: market-data
            annotations:
                summary: "Multiple concurrent backfills running"
                description: |
                    {{ $value }} backfills are currently running. This is higher than typical.
                    May indicate recent connectivity issues being resolved.
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

          # Removed RateLimiterTokensLow (2026-07-01): no rate_limiter_*
          # metrics are exported (the rate-limiter subsystem is not wired in
          # the unified janus binary).

          # ------------------------------------------------------------------
          # WebSocket Reconnection Event
          # ------------------------------------------------------------------
          - alert: WebSocketReconnected
            expr: increase(websocket_reconnections_total[5m]) > 0
            for: 0s
            labels:
                severity: info
                component: data-factory
                pipeline: market-data
            annotations:
                summary: "WebSocket reconnected to {{ $labels.exchange }}"
                description: |
                    WebSocket connection to {{ $labels.exchange }} reconnected.
                    {{ $value | printf "%.0f" }} reconnection(s) in the last 5 minutes.
                    Check for potential data gaps during the disconnection period.
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

          # ------------------------------------------------------------------
          # New Symbol Detected
          # ------------------------------------------------------------------
          - alert: NewSymbolIngesting
            expr: |
                count(trades_ingested_total) by (exchange, symbol)
                unless
                count(trades_ingested_total offset 1h) by (exchange, symbol)
            for: 1m
            labels:
                severity: info
                component: data-factory
                pipeline: market-data
            annotations:
                summary: "New symbol detected: {{ $labels.exchange }}/{{ $labels.symbol }}"
                description: |
                    A new symbol {{ $labels.symbol }} on {{ $labels.exchange }} is now being ingested.
                    This is the first data seen for this symbol in the last hour.
                dashboard_url: "https://grafana.fkstrading.xyz/d/market-data-pipeline-v1"

    # ========================================================================
    # SLO Burn Rate Alerts (Multi-Window)
    # ========================================================================
    # Removed DataCompletenessFastBurn + DataCompletenessSlowBurn (2026-07-01):
    # both depend on gaps_detected_total, which is never exported (the gap
    # counter has no production caller), and sum(rate()) over the absent
    # series returns an empty vector — collapsing the whole burn expression so
    # neither alert could ever evaluate. Restore from git history once
    # gaps_detected_total is wired, adding `or vector(0)` around the gap term
    # so a legitimately-zero gap rate still evaluates.
