# JANUS Vision - Execution Monitoring Alert Rules
# Prometheus alerting rules for execution quality, performance, and system health

groups:
    # ==========================================================================
    # Execution Quality Alerts
    # ==========================================================================
    - name: execution_quality
      interval: 30s
      rules:
          # High slippage alert
          - alert: HighExecutionSlippage
            expr: |
                histogram_quantile(0.95,
                  rate(vision_execution_slippage_bps_bucket[5m])
                ) > 10
            for: 5m
            labels:
                severity: warning
                component: execution
                category: quality
            annotations:
                summary: "High execution slippage detected"
                description: "95th percentile slippage is {{ $value | humanize }} bps (threshold: 10 bps) for {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/high-slippage"

          # Critical slippage alert
          - alert: CriticalExecutionSlippage
            expr: |
                histogram_quantile(0.95,
                  rate(vision_execution_slippage_bps_bucket[5m])
                ) > 25
            for: 2m
            labels:
                severity: critical
                component: execution
                category: quality
            annotations:
                summary: "Critical execution slippage detected"
                description: "95th percentile slippage is {{ $value | humanize }} bps (threshold: 25 bps) for {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/critical-slippage"

          # Low execution quality score
          - alert: LowExecutionQuality
            expr: vision_execution_quality_score < 80
            for: 10m
            labels:
                severity: warning
                component: execution
                category: quality
            annotations:
                summary: "Low execution quality score"
                description: "Execution quality score is {{ $value | humanize }}/100 (threshold: 80) for {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/low-quality"

          # Critical execution quality
          - alert: CriticalExecutionQuality
            expr: vision_execution_quality_score < 60
            for: 5m
            labels:
                severity: critical
                component: execution
                category: quality
            annotations:
                summary: "Critical execution quality degradation"
                description: "Execution quality score is {{ $value | humanize }}/100 (threshold: 60) for {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/critical-quality"

          # Low fill rate
          - alert: LowFillRate
            expr: vision_execution_fill_rate_pct < 90
            for: 15m
            labels:
                severity: warning
                component: execution
                category: quality
            annotations:
                summary: "Low order fill rate"
                description: "Fill rate is {{ $value | humanize }}% (threshold: 90%) for {{ $labels.order_type }} on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/low-fill-rate"

    # ==========================================================================
    # Execution Performance Alerts
    # ==========================================================================
    - name: execution_performance
      interval: 30s
      rules:
          # High execution latency
          - alert: HighExecutionLatency
            expr: |
                histogram_quantile(0.95,
                  rate(vision_execution_latency_us_bucket[5m])
                ) > 1000000
            for: 5m
            labels:
                severity: warning
                component: execution
                category: performance
            annotations:
                summary: "High execution latency detected"
                description: "95th percentile latency is {{ $value | humanizeDuration }} (threshold: 1s) for {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/high-latency"

          # Very high execution latency
          - alert: CriticalExecutionLatency
            expr: |
                histogram_quantile(0.95,
                  rate(vision_execution_latency_us_bucket[5m])
                ) > 5000000
            for: 2m
            labels:
                severity: critical
                component: execution
                category: performance
            annotations:
                summary: "Critical execution latency detected"
                description: "95th percentile latency is {{ $value | humanizeDuration }} (threshold: 5s) for {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/critical-latency"

          # Slow time to fill
          - alert: SlowTimeToFill
            expr: |
                histogram_quantile(0.95,
                  rate(vision_execution_time_to_fill_seconds_bucket[10m])
                ) > 300
            for: 10m
            labels:
                severity: warning
                component: execution
                category: performance
            annotations:
                summary: "Slow order fill times detected"
                description: "95th percentile time-to-fill is {{ $value | humanizeDuration }} (threshold: 5min) for {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/slow-fills"

          # High venue latency
          - alert: HighVenueLatency
            expr: vision_execution_venue_latency_us > 500000
            for: 5m
            labels:
                severity: warning
                component: execution
                category: performance
            annotations:
                summary: "High venue latency detected"
                description: "Venue {{ $labels.venue }} latency is {{ $value | humanizeDuration }} (threshold: 500ms) on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/venue-latency"

    # ==========================================================================
    # Execution Error Alerts
    # ==========================================================================
    - name: execution_errors
      interval: 30s
      rules:
          # High failure rate
          - alert: HighExecutionFailureRate
            expr: |
                rate(vision_execution_failed_total[5m]) > 0.1
            for: 5m
            labels:
                severity: warning
                component: execution
                category: errors
            annotations:
                summary: "High execution failure rate"
                description: "Execution failures at {{ $value | humanize }}/sec (threshold: 0.1/sec) for reason {{ $labels.reason }} on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/execution-failures"

          # Critical failure rate
          - alert: CriticalExecutionFailureRate
            expr: |
                rate(vision_execution_failed_total[5m]) > 1
            for: 2m
            labels:
                severity: critical
                component: execution
                category: errors
            annotations:
                summary: "Critical execution failure rate"
                description: "Execution failures at {{ $value | humanize }}/sec (threshold: 1/sec) for reason {{ $labels.reason }} on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/critical-failures"

          # High rejection rate
          - alert: HighOrderRejectionRate
            expr: |
                rate(vision_execution_rejected_total[5m]) > 0.05
            for: 5m
            labels:
                severity: warning
                component: execution
                category: errors
            annotations:
                summary: "High order rejection rate"
                description: "Order rejections at {{ $value | humanize }}/sec (threshold: 0.05/sec) for reason {{ $labels.reason }} on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/order-rejections"

          # Partial fill spike
          - alert: HighPartialFillRate
            expr: |
                rate(vision_execution_partial_fills_total[10m]) > 0.2
            for: 10m
            labels:
                severity: warning
                component: execution
                category: errors
            annotations:
                summary: "High partial fill rate"
                description: "Partial fills at {{ $value | humanize }}/sec (threshold: 0.2/sec) on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/partial-fills"

    # ==========================================================================
    # Execution Cost Alerts
    # ==========================================================================
    - name: execution_costs
      interval: 30s
      rules:
          # High transaction costs
          - alert: HighTransactionCosts
            expr: |
                histogram_quantile(0.95,
                  rate(vision_execution_cost_bps_bucket[10m])
                ) > 15
            for: 10m
            labels:
                severity: warning
                component: execution
                category: costs
            annotations:
                summary: "High transaction costs detected"
                description: "95th percentile cost is {{ $value | humanize }} bps (threshold: 15 bps) for {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/high-costs"

          # High implementation shortfall
          - alert: HighImplementationShortfall
            expr: vision_execution_implementation_shortfall_pct > 0.5
            for: 10m
            labels:
                severity: warning
                component: execution
                category: costs
            annotations:
                summary: "High implementation shortfall"
                description: "Implementation shortfall is {{ $value | humanize }}% (threshold: 0.5%) for {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/implementation-shortfall"

          # VWAP slippage alert
          - alert: HighVWAPSlippage
            expr: abs(vision_execution_vwap_slippage_bps) > 8
            for: 10m
            labels:
                severity: warning
                component: execution
                category: costs
            annotations:
                summary: "High VWAP slippage detected"
                description: "VWAP slippage is {{ $value | humanize }} bps (threshold: 8 bps) for {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/vwap-slippage"

    # ==========================================================================
    # System Health Alerts
    # ==========================================================================
    - name: system_health
      interval: 30s
      rules:
          # Service down
          - alert: VisionServiceDown
            expr: up{job=~"vision-.*"} == 0
            for: 1m
            labels:
                severity: critical
                component: system
                category: availability
            annotations:
                summary: "Vision service is down"
                description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute"
                runbook_url: "https://docs.vision.janus.ai/runbooks/service-down"

          # No metrics received
          - alert: NoExecutionMetrics
            expr: |
                rate(vision_execution_total[5m]) == 0
            for: 10m
            labels:
                severity: warning
                component: system
                category: monitoring
            annotations:
                summary: "No execution metrics received"
                description: "No execution activity detected for 10 minutes on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/no-metrics"

          # Execution rate drop
          - alert: ExecutionRateDrop
            expr: |
                (
                  rate(vision_execution_total[5m])
                  /
                  rate(vision_execution_total[5m] offset 1h)
                ) < 0.5
            for: 10m
            labels:
                severity: warning
                component: system
                category: monitoring
            annotations:
                summary: "Execution rate dropped significantly"
                description: "Execution rate is {{ $value | humanizePercentage }} of normal on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/rate-drop"

          # Memory pressure (if available from system metrics)
          - alert: HighMemoryUsage
            expr: |
                (
                  process_resident_memory_bytes{job=~"vision-.*"}
                  /
                  process_virtual_memory_max_bytes{job=~"vision-.*"}
                ) > 0.9
            for: 5m
            labels:
                severity: warning
                component: system
                category: resources
            annotations:
                summary: "High memory usage detected"
                description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/high-memory"

    # ==========================================================================
    # Venue-Specific Alerts
    # ==========================================================================
    - name: venue_alerts
      interval: 30s
      rules:
          # Venue performance degradation
          - alert: VenuePerformanceDegraded
            expr: |
                (
                  (
                    vision_execution_venue_avg_price{venue=~".+"}
                    /
                    vision_execution_venue_avg_price{venue=~".+"} offset 1h
                  ) > 1.02
                )
                or
                (
                  (
                    vision_execution_venue_avg_price{venue=~".+"}
                    /
                    vision_execution_venue_avg_price{venue=~".+"} offset 1h
                  ) < 0.98
                )
            for: 10m
            labels:
                severity: warning
                component: execution
                category: venue
            annotations:
                summary: "Venue {{ $labels.venue }} performance degraded"
                description: "Venue {{ $labels.venue }} average price deviated {{ $value | humanizePercentage }} from 1h ago on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/venue-degradation"

          # Unbalanced venue usage
          - alert: UnbalancedVenueUsage
            expr: |
                stddev_over_time(vision_execution_venue_total[10m]) > 100
            for: 15m
            labels:
                severity: info
                component: execution
                category: venue
            annotations:
                summary: "Unbalanced venue usage detected"
                description: "Venue usage variance is {{ $value | humanize }} (may indicate routing issues) on {{ $labels.instance }}"
                runbook_url: "https://docs.vision.janus.ai/runbooks/venue-balance"
