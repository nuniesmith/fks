[package]
name        = "noop-bot"
version     = "0.0.1"
edition     = "2024"
publish     = false
description = "Minimal end-to-end rustrade example — runs a NoopBrain against a MockExchange for ~10 seconds"

[dependencies]
rustrade    = { workspace = true }
async-trait = { workspace = true }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing     = { workspace = true }
anyhow      = { workspace = true }
chrono      = { workspace = true }
