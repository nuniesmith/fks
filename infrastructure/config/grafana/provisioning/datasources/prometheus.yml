# Grafana Datasource Provisioning - Prometheus
# Automatically configures Prometheus as a datasource when Grafana starts

apiVersion: 1

# List of datasources to insert/update
datasources:
  # Prometheus - Primary metrics datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      # Enable Prometheus metric metadata queries
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.48.0
      # Cache settings
      cacheLevel: 'High'
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
      # Exemplars support (for traces correlation)
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
    version: 1

  # Prometheus - Alternative endpoint (for testing/comparison)
  - name: Prometheus-Dev
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 30s
      manageAlerts: false
    orgId: 1
    version: 1

# Optional: Loki for logs (if deployed)
