# ============================================================================
# FKS Root Workspace
# ============================================================================
# Slim virtual workspace covering only the top-level Rust crates that don't
# live inside a nested workspace under `crates/`.
#
# Nested workspaces (each builds independently from its own directory):
#   - crates/janus       — JANUS ML/trading engine (28 sub-crates, 8 services)
#   - crates/rustrade    — Open-source trading framework (core/risk/supervisor)
#   - crates/rustcode    — AI coding assistant
#   - crates/indicators-ta   — Standalone technical-analysis crate (publishable)
#   - crates/exchange-apiws  — Standalone exchange REST/WS client (publishable)
#
# This root workspace contains only:
#   - src/proto    — fks-proto (centralised protobuf definitions)
#   - src/spawner  — Bot spawner (Docker container lifecycle manager)
# ============================================================================

[workspace]
resolver = "3"

members = [
    "src/proto",
    "src/spawner",
]

# ============================================================================
# Workspace Package Defaults
# ============================================================================

[workspace.package]
version      = "0.1.0"
edition      = "2024"
authors      = ["nuniesmith"]
license      = "MIT"
repository   = "https://github.com/nuniesmith/fks"
rust-version = "1.94.1"
publish      = false

# ============================================================================
# Workspace Dependencies (only those used by src/proto + src/spawner)
# ============================================================================

[workspace.dependencies]
# Async runtime
tokio        = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# HTTP server (spawner)
axum = { version = "0.8", features = ["macros", "ws"] }

# Serialisation
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

# Metrics
prometheus = "0.14"

# Error handling
anyhow    = "1.0"
thiserror = "2.0"

# Utilities
uuid   = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ============================================================================
# Profiles
# ============================================================================

[profile.dev]
opt-level = 0
debug     = true

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 16
strip         = true
debug         = false
panic         = "abort"

[profile.release-with-debug]
inherits = "release"
debug    = true
strip    = false
