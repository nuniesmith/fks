# =============================================================================
# FKS PR Auto-Labeler Workflow
# =============================================================================
# Automatically applies labels to pull requests based on changed files and
# branch naming conventions using the configuration in .github/labeler.yml
#
# Docs: https://github.com/actions/labeler
# =============================================================================

name: 🏷️ PR Labeler

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read
    pull-requests: write

jobs:
    label:
        name: 🏷️ Auto-label PR
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: 🏷️ Apply labels
              uses: actions/labeler@v5
              with:
                  configuration-path: .github/labeler.yml
                  sync-labels: true
