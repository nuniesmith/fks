# Prometheus Configuration for JANUS Trading System
# This configuration scrapes metrics from all JANUS services and dependencies

global:
  # How frequently to scrape targets
  scrape_interval: 10s
  # How frequently to evaluate rules
  evaluation_interval: 10s
  # Timeout for scraping
  scrape_timeout: 5s
  # Attach these labels to any time series or alerts
  external_labels:
    cluster: 'janus-prod'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/alerts.yml'

# Scrape configurations
scrape_configs:
  # ============================================================================
  # JANUS Core Services
  # ============================================================================

  # CNS - Central Nervous System
  - job_name: 'janus-cns'
    static_configs:
      - targets: ['janus-cns:9090']
        labels:
          service: 'cns'
          component: 'monitoring'
          tier: 'infrastructure'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Forward Service - Wake State
  - job_name: 'janus-forward'
    static_configs:
      - targets: ['janus-forward:8081']
        labels:
          service: 'forward'
          component: 'trading'
          tier: 'core'
          state: 'wake'
    metrics_path: '/metrics'
    scrape_interval: 5s  # More frequent for real-time trading
    scrape_timeout: 3s

  # Backward Service - Sleep State
  - job_name: 'janus-backward'
    static_configs:
      - targets: ['janus-backward:8082']
        labels:
          service: 'backward'
          component: 'training'
          tier: 'core'
          state: 'sleep'
    metrics_path: '/metrics'
    scrape_interval: 15s  # Less frequent for batch processing
    scrape_timeout: 5s

  # Gateway Service - Orchestration
  - job_name: 'janus-gateway'
    static_configs:
      - targets: ['janus-gateway:8080']
        labels:
          service: 'gateway'
          component: 'api'
          tier: 'edge'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # ============================================================================
  # Dependencies
  # ============================================================================

  # Redis - Job Queue and Cache
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'
          tier: 'infrastructure'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  # Qdrant - Vector Database (if exporter available)
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          service: 'qdrant'
          component: 'database'
          tier: 'infrastructure'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  # ============================================================================
  # Monitoring Infrastructure
  # ============================================================================

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'
          tier: 'infrastructure'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          component: 'visualization'
          tier: 'infrastructure'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ============================================================================
  # Docker & Host Metrics (Optional)
  # ============================================================================

  # Node Exporter - Host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          component: 'monitoring'
          tier: 'infrastructure'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          component: 'monitoring'
          tier: 'infrastructure'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

