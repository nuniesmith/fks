# FKS Trading Alerts - Signal Flow & Paper Trading Monitoring
# Alert rules for trading anomalies, performance degradation, and system health
#
# 2026-07-01 cleanup: the signal_flow_* / execution_orders_* / best_execution_*
# metric namespaces were never exported by any running service (the live janus
# exporter uses the janus_* prefix), so the alerts keyed on them could never
# fire. The two with a live equivalent were repointed to
# janus_signals_generated_total; the rest (order-flow / best-execution) were
# removed until those subsystems exist — restore from git history if wired.

groups:
    # ==========================================================================
    # Signal Flow Alerts
    # ==========================================================================
    - name: signal_flow_alerts
      interval: 30s
      rules:
          # No signals generated for extended period
          # Repointed: signal_flow_signals_received (never exported) ->
          # janus_signals_generated_total (live, labels signal_type/symbol).
          - alert: NoSignalsGenerated
            expr: |
                sum(increase(janus_signals_generated_total[15m])) == 0
            for: 15m
            labels:
                severity: warning
                component: janus
                category: trading
            annotations:
                summary: "No trading signals generated"
                description: "No new signals have been generated in the last 15 minutes. Check if Janus forward module is running."
                runbook_url: "https://docs.fks.ai/runbooks/no-signals"

          # Signal generation rate dropped significantly
          # Repointed: signal_flow_signals_received -> janus_signals_generated_total.
          - alert: SignalRateDropped
            expr: |
                sum(rate(janus_signals_generated_total[5m]))
                < 0.1 * sum(rate(janus_signals_generated_total[1h] offset 1h))
            for: 10m
            labels:
                severity: warning
                component: janus
                category: trading
            annotations:
                summary: "Signal generation rate dropped significantly"
                description: "Signal rate is less than 10% of the rate from 1 hour ago. Current: {{ $value | humanize }}/s"
                runbook_url: "https://docs.fks.ai/runbooks/signal-rate-drop"

    # ==========================================================================
    # System Health Alerts
    # ==========================================================================
    - name: trading_system_health
      interval: 30s
      rules:
          # Janus service unhealthy
          - alert: JanusUnhealthy
            expr: |
                up{job="fks-janus"} == 0
            for: 2m
            labels:
                severity: critical
                component: janus
                category: system
            annotations:
                summary: "Janus service is down"
                description: "Janus service has been unreachable for 2 minutes."
                runbook_url: "https://docs.fks.ai/runbooks/janus-down"

          # Removed ExecutionUnhealthy: it evaluated the identical
          # up{job="fks-janus"} expr as JanusUnhealthy (execution runs inside
          # the unified janus binary — there is no separate execution target),
          # so it double-paged every janus outage mislabeled as an execution
          # outage.

          # Redis disconnected
          # Only fires when Janus is up (metric actively reported) to avoid
          # false positives from the gauge's default value of 0.
          - alert: RedisDisconnected
            expr: |
                janus_redis_connected == 0
                and
                up{job="fks-janus"} == 1
            for: 3m
            labels:
                severity: critical
                component: redis
                category: system
            annotations:
                summary: "Redis connection lost"
                description: "Janus has lost connection to Redis. Signal pub/sub will not work."
                runbook_url: "https://docs.fks.ai/runbooks/redis-down"

          # Database pool exhausted
          # Guard: only fire when Janus is up AND the gauge has been set above 0
          # at some point in the last hour (avoids false positives from the
          # uninitialized default of 0 when no centralised pool is configured).
          - alert: DatabasePoolExhausted
            expr: |
                janus_db_pool_size < 2
                and
                up{job="fks-janus"} == 1
                and
                max_over_time(janus_db_pool_size[1h]) >= 2
            for: 5m
            labels:
                severity: warning
                component: postgres
                category: system
            annotations:
                summary: "Database connection pool low"
                description: "Only {{ $value }} database connections available."
                runbook_url: "https://docs.fks.ai/runbooks/db-pool"

          # Janus module unhealthy
          - alert: JanusModuleUnhealthy
            expr: |
                janus_module_health == 0
            for: 2m
            labels:
                severity: critical
                component: janus
                category: system
            annotations:
                summary: "Janus module {{ $labels.module }} is unhealthy"
                description: "The {{ $labels.module }} module has been unhealthy for 2 minutes."
                runbook_url: "https://docs.fks.ai/runbooks/module-health"
