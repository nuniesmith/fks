# =============================================================================
# FKS Trading Platform — Local Dev HTTP Server
# =============================================================================
# Serves all services on port 80 with no SSL and no Authelia.
# Mount this file in docker-compose.yml (already done via conf.d volume) and
# it will be picked up automatically alongside the prod conf files.
#
# The prod fkstrading.xyz.conf HTTPS block won't bind because no SSL certs
# exist locally, so this block becomes the active default_server on port 80.
#
# NOTE: the Ruby data/web service (fks_ruby) was removed in the janus migration.
# The SvelteKit dashboard (fks_webui:3000) is now the single web + backend seam —
# its server hook (src/web/src/hooks.server.ts) proxies /api, /sse, /bars, /factory,
# /kraken, /fapi to janus / spawner / Prometheus / QuestDB (or stubs them). So all
# page + backend-prefix traffic goes to fks_webui; only the observability UIs,
# janus /ws/, and the spawner keep direct routes.
#
# Access map (all relative to http://localhost/):
#   /health              → 200 OK             (nginx-native, no upstream)
#   /                    → fks_webui:3000     (SvelteKit dashboard — catch-all)
#   /charts, /charts/    → fks_webui:3000     (SvelteKit charts page + subpaths)
#   /sse/*               → fks_webui:3000     (SSE streaming, unbuffered)
#   /api/<…>/sse, /stream → fks_webui:3000    (the unbuffered /api SSE set)
#   /api/data|bars|trades|… → fks_webui:3000  (data REST regex — adapter serves/stubs)
#   /api/bots/*          → fks_bot_spawner:8090  (Rust bot spawner — spawn/stop/logs)
#   /api/spawner/*       → fks_bot_spawner:8090  (spawner lifecycle API)
#   /api/* (remaining)   → fks_webui:3000     (adapter: reshapes janus, stubs rest)
#   /fapi/*              → fks_webui:3000     (legacy prefix; rewrite strips /fapi)
#   /futures-api/*       → fks_webui:3000     (legacy prefix; rewrite → /api/*)
#   /ws/                 → fks_janus:8080     (WebSocket — direct to janus)
#   /grafana/            → fks_grafana:3000
#   /prometheus/         → fks_prometheus:9090
#   /questdb/            → fks_questdb:9000
#   /jaeger/             → fks_jaeger:16686
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fkstrading.local www.fkstrading.local auth.fkstrading.local localhost _;

    # ------------------------------------------------------------------
    # Nginx health probe (used by docker-compose healthcheck)
    # ------------------------------------------------------------------
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"nginx","mode":"dev"}';
    }

    # ------------------------------------------------------------------
    # SSE / streaming (unbuffered) — must come before the /api/data/ regex.
    # Served by the SvelteKit adapter (fks_webui:3000); the old fks_ruby
    # data service was removed in the janus migration.
    # ------------------------------------------------------------------
    location ~* ^/(sse|api/(data/stream|live/stream|pipeline/run|sim/sse|grok/sse|chat/sse|dom/sse|pretrade/sse)) {
        resolver 127.0.0.11 valid=30s;
        set $data_sse "http://fks_webui:3000";

        proxy_pass $data_sse;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";

        # SSE requires HTTP/1.1 with an empty Connection header so nginx does
        # not close the upstream keepalive connection between events.
        proxy_http_version 1.1;
        proxy_set_header Connection        '';
        proxy_set_header Upgrade           '';

        # Disable ALL buffering — critical for SSE.
        proxy_buffering             off;
        proxy_cache                 off;
        proxy_request_buffering     off;
        chunked_transfer_encoding   on;
        add_header X-Accel-Buffering "no" always;

        # Long timeouts — SSE connections are long-lived by design.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout   60s;

        # Do NOT intercept upstream errors — let the EventSource see them so
        # the browser can reconnect on its own schedule.
        proxy_intercept_errors off;
    }

    # ------------------------------------------------------------------
    # Data / REST prefixes — the historical fks_ruby surface  (/api/data/*, /bars/*,
    # /trades, /journal, /risk, /positions, /actions, /analysis, /metrics, etc.).
    # The Ruby service is gone; these now hit the SvelteKit adapter (fks_webui:3000),
    # which serves the live ones and stubs the rest. Top-level HTML pages fall
    # through to the catch-all "/" block below.
    #
    # Paths matched by the regex below (legacy fks_ruby inventory — kept so
    # re-adding a janus-backed route is a one-line edit, not a rediscovery):
    #   /api/backup        /api/copy-trade   /api/dom
    #   /api/focus         /api/grok         /api/chat
    #   /api/news          /api/pipeline     /api/pretrade
    #   /api/reddit        /api/rithmic      /api/sim
    #   /api/sources       /api/swing        /api/tasks
    #   /api/trade         /api/trading      /api/data/*
    #   /api/live          /api/live-risk    /api/plan
    #   /api/reports       /api/market       /api/journal
    #   /api/regime        /api/alerts       /api/orb
    #   /api/info          /api/no-trade     /api/time
    #   /api/health        /api/ruby         /api/janus/*
    #   /api/tv            /api/chain        /api/execution_gate
    #   /api/paper-trading /api/sweeps       /api/chart
    #   /api/strip/*       /api/status/*     (terminal strip cells + status bar)
    #   /api/bots/*        /api/janus-ai/*   (bot supervisor + Janus AI sessions)
    #   /api/signals/*     (active signals, signal history — served by data service)
    #   /api/metrics/*     (Prometheus stat partials — served by data service)
    #   /api/db/*          (DB explorer API)
    #   /bars/*            /trades*          /journal*
    #   /positions*        /risk*            /actions*
    #   /analysis*         /cnn*             /kraken*
    #   /settings*         /trainer*         /backup*
    #   /pine*             /trading*         /charting-proxy*
    #   /workspaces/*      (terminal workspace HTMX fragments)
    #   /partials/*        (terminal partial HTMX renderers — market-table, signals…)
    #   /factory/*         (data factory registry, coverage, news)
    # ------------------------------------------------------------------
    location ~* ^/(api/(backup|copy-trade|dom|focus|grok|chat|news|pipeline|pretrade|reddit|rithmic|sim|sources|swing|tasks|trade|trading|data|live-risk|live|plan|reports|market|journal|regime|alerts|orb|info|no-trade|time|health|ruby|tv|chain|execution_gate|paper-trading|sweeps|chart|strip|status|janus-ai|janus|signals|metrics|db)|bars|trades|journal|positions|risk|actions|analysis|cnn|kraken|settings|trainer|backup|pine|trading|dom|pretrade|audit|sync|ruby|htmx|charting-proxy|metrics|static|workspaces|partials|factory) {
        limit_req zone=api burst=50 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $data_backend "http://fks_webui:3000";

        proxy_pass $data_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------------
    # Janus — trading API  (/api/* catch-all after data routes above)
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        resolver 127.0.0.11 valid=30s;
        # → the webui adapter (NOT raw janus): it reshapes /api/health, /api/signals,
        #   /api/janus/*, /api/performance, /api/metrics/* and stubs the rest.
        #   (/api/bots/ and /api/spawner/ are carved out to the spawner above.)
        set $api_backend "http://fks_webui:3000";

        proxy_pass $api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_intercept_errors on;
        error_page 502 503 504 =503 @janus_unavailable;
    }

    # ------------------------------------------------------------------
    # Janus — WebSocket
    # ------------------------------------------------------------------
    location /ws/ {
        resolver 127.0.0.11 valid=30s;
        set $janus_backend "http://fks_janus:8080";

        proxy_pass $janus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";

        proxy_connect_timeout  60s;
        proxy_send_timeout   3600s;
        proxy_read_timeout   3600s;
    }

    # ------------------------------------------------------------------
    # Charts: the SvelteKit /charts page (and any /charts/* subpath) is served by
    # fks_webui via the catch-all "/" below. The old Ruby nav-shell page and the
    # separate fks_charting SPA iframe were both removed in the janus migration.
    # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # Grafana
    # ------------------------------------------------------------------
    location /grafana/ {
        resolver 127.0.0.11 valid=30s;
        set $grafana_backend "http://fks_grafana:3000";

        proxy_pass $grafana_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_intercept_errors on;
        error_page 502 503 504 =503 @grafana_unavailable;
    }

    # ------------------------------------------------------------------
    # Prometheus
    # ------------------------------------------------------------------
    location /prometheus/ {
        resolver 127.0.0.11 valid=30s;
        set $prometheus_backend "http://fks_prometheus:9090";

        rewrite ^/prometheus/(.*) /$1 break;
        proxy_pass $prometheus_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ------------------------------------------------------------------
    # QuestDB console
    # ------------------------------------------------------------------
    location /questdb/ {
        resolver 127.0.0.11 valid=30s;
        set $questdb_backend "http://fks_questdb:9000";

        rewrite ^/questdb/(.*) /$1 break;
        proxy_pass $questdb_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ------------------------------------------------------------------
    # Jaeger tracing UI
    # ------------------------------------------------------------------
    location /jaeger/ {
        resolver 127.0.0.11 valid=30s;
        set $jaeger_backend "http://fks_jaeger:16686";

        rewrite ^/jaeger/(.*) /$1 break;
        proxy_pass $jaeger_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── /fapi/* — legacy futures-workspace prefix ─────────────────────────────────
    # Proxies /fapi/* to the SvelteKit adapter (fks_webui:3000); the rewrite strips
    # the /fapi prefix before forwarding. The fks_ruby FastAPI it used to reach is
    # gone, so unknown paths are served/stubbed by the adapter.
    #
    # Example: GET /fapi/api/dashboard  → http://fks_webui:3000/api/dashboard
    #          GET /fapi/tasks/api/list → http://fks_webui:3000/tasks/api/list

    location /fapi/ {
        # Lazy resolver + variable upstream so nginx still STARTS even when the
        # target is momentarily unresolvable (it resolves per request, not at
        # config-load). fks_ruby was removed — this now targets fks_webui.
        resolver 127.0.0.11 valid=30s;
        set $fapi_backend  "http://fks_webui:3000";

        rewrite ^/fapi/(.*)$ /$1 break;
        proxy_pass         $fapi_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE support (task output streaming)
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # ── Verify after nginx reload ────────────────────────────────────────────────
    # docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
    # curl http://localhost/health  → {"status":"healthy","service":"nginx","mode":"dev"}

    # ------------------------------------------------------------------
    # Futures API proxy — routes /futures-api/* to the adapter's /api/*
    #
    # The rewrite strips /futures-api/ and replaces it with /api/ so that:
    #   GET /futures-api/health   → http://fks_webui:3000/api/health
    #   GET /futures-api/orders   → http://fks_webui:3000/api/orders
    #
    # Legacy prefix (the old fks_ruby futures API is gone — the adapter
    # serves/stubs it). Must live BEFORE the catch-all "/" location.
    # ------------------------------------------------------------------
    location /futures-api/ {
        limit_req zone=api burst=50 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $futures_backend "http://fks_webui:3000";

        rewrite ^/futures-api/(.*)$ /api/$1 break;
        proxy_pass $futures_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------------
    # Bot Management API — routes /api/bots/* to fks_bot_spawner:8090
    #
    # Replaces the old fks_ruby bot supervisor proxy.  All bot lifecycle
    # operations (spawn, stop, restart, logs, list) now go directly to
    # the Rust spawner service.
    #
    # Route mapping:
    #   GET    /api/bots/           → GET  http://fks_bot_spawner:8090/containers
    #   POST   /api/bots/spawn      → POST http://fks_bot_spawner:8090/spawn
    #   DELETE /api/bots/:id        → DELETE http://fks_bot_spawner:8090/container/:id
    #   POST   /api/bots/:id/stop   → POST http://fks_bot_spawner:8090/container/:id/stop
    #   POST   /api/bots/:id/restart→ POST http://fks_bot_spawner:8090/container/:id/restart
    #   GET    /api/bots/:id/logs   → GET  http://fks_bot_spawner:8090/container/:id/logs (SSE)
    # ------------------------------------------------------------------
    location /api/bots/ {
        limit_req zone=api burst=20 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $spawner_bots "http://fks_bot_spawner:8090";

        # Rewrite:  /api/bots/spawn        → /spawn
        #           /api/bots/abc123/stop   → /container/abc123/stop
        #           /api/bots/             → /containers
        rewrite ^/api/bots/spawn(.*)$          /spawn$1                  break;
        rewrite ^/api/bots/([^/]+)/(.+)$       /container/$1/$2          break;
        rewrite ^/api/bots/([^/]+)$            /container/$1             break;
        rewrite ^/api/bots/?$                  /containers               break;

        proxy_pass $spawner_bots;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The spawner gates every protected route on X-Internal-Token; without this
        # the /api/bots/* rewrites hit the spawner unauthenticated and 401. (The
        # /api/spawner/ block below injects it too.)
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        # SSE support for log streaming endpoint
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;

        proxy_intercept_errors on;
        error_page 502 503 504 =503 @spawner_unavailable;
    }

    # ------------------------------------------------------------------
    # Bot Spawner API — routes /api/spawner/* to fks_bot_spawner:8090
    # Lets the web UI manage bot container lifecycle directly (the old
    # fks_ruby supervisor proxy is gone).
    # ------------------------------------------------------------------
    location /api/spawner/ {
        limit_req zone=api burst=20 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $spawner_backend "http://fks_bot_spawner:8090";

        rewrite ^/api/spawner/(.*)$ /$1 break;
        proxy_pass $spawner_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;

        # SSE support for /container/:id/logs endpoint
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # Web UI catch-all — fks_webui serves the SvelteKit dashboard at /
    # Must be last so all the more-specific prefixes above win.
    # ------------------------------------------------------------------
    location / {
        resolver 127.0.0.11 valid=30s;
        set $web_backend "http://fks_webui:3000";

        proxy_pass $web_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "${NGINX_INTERNAL_TOKEN}";
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout  30s;
        proxy_send_timeout     60s;
        proxy_read_timeout    120s;

        proxy_intercept_errors on;
        error_page 502 503 504 =503 @web_unavailable;
    }

    # ------------------------------------------------------------------
    # Error pages
    # ------------------------------------------------------------------
    location @web_unavailable {
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><title>FKS — Starting</title><meta http-equiv="refresh" content="5"><style>body{font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#1a1a2e;color:#fff}div{text-align:center;padding:2rem}h1{color:#4ecdc4}p{color:#aaa}.spin{border:4px solid #333;border-top:4px solid #4ecdc4;border-radius:50%;width:40px;height:40px;animation:s 1s linear infinite;margin:20px auto}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div><h1>FKS Dashboard</h1><div class="spin"></div><p>Web service is starting — refreshing in 5s…</p></div></body></html>';
    }

    location @spawner_unavailable {
        default_type application/json;
        return 503 '{"status":"unavailable","service":"spawner","message":"Bot spawner is starting. Please retry in a moment."}';
    }

    location @janus_unavailable {
        default_type application/json;
        return 503 '{"status":"unavailable","service":"janus","message":"Janus is starting up. Please retry in a moment."}';
    }

    location @grafana_unavailable {
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><title>Grafana — Starting</title><meta http-equiv="refresh" content="5"><style>body{font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#1a1a2e;color:#fff}div{text-align:center;padding:2rem}h1{color:#4ecdc4}p{color:#aaa}.spin{border:4px solid #333;border-top:4px solid #4ecdc4;border-radius:50%;width:40px;height:40px;animation:s 1s linear infinite;margin:20px auto}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div><h1>Grafana</h1><div class="spin"></div><p>Starting up — refreshing in 5s…</p></div></body></html>';
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
