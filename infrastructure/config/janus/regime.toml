#   strategies.mean_reversion.exit_at_middle = false
#   strategies.mean_reversion.rsi_oversold = 35.0
#   strategies.mean_reversion.rsi_overbought = 65.0
#   strategies.mean_reversion.atr_stop_multiplier = 2.5
