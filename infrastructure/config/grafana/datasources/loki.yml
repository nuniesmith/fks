# ============================================================================
# Grafana Datasource: Loki (Centralized Logging)
# ============================================================================
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Link to Jaeger traces from trace IDs in logs
        - datasourceUid: jaeger
          matcherRegex: "trace_id=(\w+)"
          name: TraceID
          url: "1226551{__value.raw}"
        # Link to specific services
        - datasourceUid: prometheus
          matcherRegex: "service=(\w+)"
          name: Metrics
          url: "/d/service-overview?var-service=1226551{__value.raw}"
