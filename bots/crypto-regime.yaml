# bots/crypto-regime.yaml.disabled
# Kraken spot regime bot (200-day MA rule) — folded in from the standalone
# crypto-bot-live container. Runs LIVE, mirroring the current Kraken setup.
#
# CUTOVER 2026-10-25: this is now the live trader. It was DISABLED
# 2026-10-15 and renamed to .yaml.disabled 2026-10-22 after the first
# fold-in attempt left it and the standalone crypto-bot-live both trading
# the same Kraken account for four days. The rename back happened only
# once the §6.3 account lease existed (fks-spawner#62): this bot declares
# `account: "kraken:spot:default"` below, and the spawner refuses any
# second bot on that account while this one runs. The standalone was
# stopped via oryx's stop-standalone-crypto workflow and its state
# (data/paper — state.json with the deposit baseline, journal.jsonl)
# copied into this bot's volume before the first managed spawn.
# `autostart: false` stays: botsync never starts it on a deploy; starts
# are deliberate respawns. The image always trades live, whatever
# `mode` says.
#
# Synced into the spawner by botsync (POST /configs, upsert by `name`).
# To add a bot: drop another YAML file here and `up -d` (or POST /configs).
name: crypto-regime
description: "Kraken spot regime bot (200-day MA rule) — folded in from standalone, LIVE"
# The fks-bot-* alias of the crypto image (crypto#36): the spawner's
# image allowlist admits only ghcr.io/nuniesmith/fks-bot-* (oryx#16).
# Same image the standalone runs as ghcr.io/nuniesmith/crypto:latest.
image: ghcr.io/nuniesmith/fks-bot-crypto:latest
mode: live
bot_id: crypto-regime
# The lease identity (EDGE_FACTORY_PLAN S6.3): while this bot runs under
# the spawner, no other managed bot may trade the same Kraken spot
# account. Inert while the file keeps its .disabled name.
account: "kraken:spot:default"
cpu_limit: 1.0
memory_mb: 512
env:
  # Bot state (state.json) + journal land in the spawner's per-bot volume.
  CRYPTO_BOT_ROOT: /var/lib/fks-bot
  # Templated by botsync from the deploy environment — never committed.
  CRYPTO_DISCORD_WEBHOOK_URL: ""
  TZ: America/Toronto
  # The FKS status contract (fks-web /exchanges reads it). The bot serves
  # /health, /status, /metrics on this port inside the fks network.
  BOT_STATUS_PORT: "9091"
# Injected at spawn from the spawner's encrypted secret store.
# Spawn FAILS if `kraken` has no stored credentials (never a keyless live bot).
secrets:
  - kraken
restart_policy:
  enabled: true
  max_restarts: 3
  window_secs: 3600
# botsync respawns it if not running after a sync. Off: see the header.
autostart: false
