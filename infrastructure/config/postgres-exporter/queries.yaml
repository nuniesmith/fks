# Custom PostgreSQL queries for FKS Trading Platform
# These queries expose standard PostgreSQL metrics to Prometheus
# FKS-specific table queries are disabled until tables are created

pg_replication:
    query: "SELECT CASE WHEN NOT pg_is_in_recovery() THEN 0 ELSE GREATEST (0, EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))) END AS lag"
    master: true
    metrics:
        - lag:
              usage: "GAUGE"
              description: "Replication lag behind master in seconds"

pg_postmaster:
    query: "SELECT pg_postmaster_start_time as start_time_seconds from pg_postmaster_start_time()"
    master: true
    metrics:
        - start_time_seconds:
              usage: "GAUGE"
              description: "Time at which postmaster started"

pg_stat_user_tables:
    query: |
        SELECT
          current_database() datname,
          schemaname,
          relname,
          seq_scan,
          seq_tup_read,
          idx_scan,
          idx_tup_fetch,
          n_tup_ins,
          n_tup_upd,
          n_tup_del,
          n_tup_hot_upd,
          n_live_tup,
          n_dead_tup,
          n_mod_since_analyze,
          COALESCE(last_vacuum, '1970-01-01Z') as last_vacuum,
          COALESCE(last_autovacuum, '1970-01-01Z') as last_autovacuum,
          COALESCE(last_analyze, '1970-01-01Z') as last_analyze,
          COALESCE(last_autoanalyze, '1970-01-01Z') as last_autoanalyze,
          vacuum_count,
          autovacuum_count,
          analyze_count,
          autoanalyze_count
        FROM
          pg_stat_user_tables
    metrics:
        - datname:
              usage: "LABEL"
              description: "Name of current database"
        - schemaname:
              usage: "LABEL"
              description: "Name of the schema that this table is in"
        - relname:
              usage: "LABEL"
              description: "Name of this table"
        - seq_scan:
              usage: "COUNTER"
              description: "Number of sequential scans initiated on this table"
        - seq_tup_read:
              usage: "COUNTER"
              description: "Number of live rows fetched by sequential scans"
        - idx_scan:
              usage: "COUNTER"
              description: "Number of index scans initiated on this table"
        - idx_tup_fetch:
              usage: "COUNTER"
              description: "Number of live rows fetched by index scans"
        - n_tup_ins:
              usage: "COUNTER"
              description: "Number of rows inserted"
        - n_tup_upd:
              usage: "COUNTER"
              description: "Number of rows updated"
        - n_tup_del:
              usage: "COUNTER"
              description: "Number of rows deleted"
        - n_tup_hot_upd:
              usage: "COUNTER"
              description: "Number of rows HOT updated"
        - n_live_tup:
              usage: "GAUGE"
              description: "Estimated number of live rows"
        - n_dead_tup:
              usage: "GAUGE"
              description: "Estimated number of dead rows"
        - n_mod_since_analyze:
              usage: "GAUGE"
              description: "Estimated number of rows changed since last analyze"
        - last_vacuum:
              usage: "GAUGE"
              description: "Last time at which this table was manually vacuumed"
        - last_autovacuum:
              usage: "GAUGE"
              description: "Last time at which this table was vacuumed by autovacuum"
        - last_analyze:
              usage: "GAUGE"
              description: "Last time at which this table was manually analyzed"
        - last_autoanalyze:
              usage: "GAUGE"
              description: "Last time at which this table was analyzed by autovacuum"
        - vacuum_count:
              usage: "COUNTER"
              description: "Number of times this table has been manually vacuumed"
        - autovacuum_count:
              usage: "COUNTER"
              description: "Number of times this table has been vacuumed by autovacuum"
        - analyze_count:
              usage: "COUNTER"
              description: "Number of times this table has been manually analyzed"
        - autoanalyze_count:
              usage: "COUNTER"
              description: "Number of times this table has been analyzed by autovacuum"

pg_database:
    query: |
        SELECT
          pg_database.datname,
          pg_database_size(pg_database.datname) as size_bytes
        FROM pg_database
        WHERE datname NOT IN ('template0', 'template1')
    master: true
    metrics:
        - datname:
              usage: "LABEL"
              description: "Name of the database"
        - size_bytes:
              usage: "GAUGE"
              description: "Disk space used by the database"

pg_stat_activity:
    query: |
        SELECT
          pg_database.datname,
          tmp.state,
          COALESCE(count, 0) as count,
          COALESCE(max_tx_duration, 0) as max_tx_duration
        FROM
          (
            VALUES
              ('active'),
              ('idle'),
              ('idle in transaction'),
              ('idle in transaction (aborted)'),
              ('fastpath function call'),
              ('disabled')
          ) AS tmp (state)
          CROSS JOIN pg_database
          LEFT JOIN (
            SELECT
              datname,
              state,
              count(*) AS count,
              MAX(EXTRACT(EPOCH FROM now() - xact_start))::float AS max_tx_duration
            FROM pg_stat_activity
            GROUP BY datname, state
          ) AS tmp2 ON tmp.state = tmp2.state AND pg_database.datname = tmp2.datname
        WHERE pg_database.datname NOT IN ('template0', 'template1')
    metrics:
        - datname:
              usage: "LABEL"
              description: "Name of the database"
        - state:
              usage: "LABEL"
              description: "Connection state"
        - count:
              usage: "GAUGE"
              description: "Number of connections in this state"
        - max_tx_duration:
              usage: "GAUGE"
              description: "Max duration of a transaction in seconds"

pg_locks:
    query: |
        SELECT
          pg_database.datname,
          tmp.mode,
          COALESCE(count, 0) as count
        FROM
          (
            VALUES
              ('accesssharelock'),
              ('rowsharelock'),
              ('rowexclusivelock'),
              ('shareupdateexclusivelock'),
              ('sharelock'),
              ('sharerowexclusivelock'),
              ('exclusivelock'),
              ('accessexclusivelock')
          ) AS tmp (mode)
          CROSS JOIN pg_database
          LEFT JOIN (
            SELECT
              database,
              lower(mode) AS mode,
              count(*) AS count
            FROM pg_locks
            WHERE database IS NOT NULL
            GROUP BY database, mode
          ) AS tmp2 ON tmp.mode = tmp2.mode AND pg_database.oid = tmp2.database
        WHERE pg_database.datname NOT IN ('template0', 'template1')
    metrics:
        - datname:
              usage: "LABEL"
              description: "Name of the database"
        - mode:
              usage: "LABEL"
              description: "Type of lock"
        - count:
              usage: "GAUGE"
              description: "Number of locks of this type"

pg_table_sizes:
    query: |
        SELECT
          relname as table_name,
          pg_total_relation_size(relid) as total_size_bytes,
          pg_relation_size(relid) as table_size_bytes,
          pg_indexes_size(relid) as indexes_size_bytes,
          n_live_tup as row_estimate
        FROM pg_stat_user_tables
        WHERE schemaname = 'public'
        ORDER BY pg_total_relation_size(relid) DESC
    master: true
    metrics:
        - table_name:
              usage: "LABEL"
              description: "Name of the table"
        - total_size_bytes:
              usage: "GAUGE"
              description: "Total disk space used by the table including indexes"
        - table_size_bytes:
              usage: "GAUGE"
              description: "Disk space used by the table excluding indexes"
        - indexes_size_bytes:
              usage: "GAUGE"
              description: "Disk space used by indexes"
        - row_estimate:
              usage: "GAUGE"
              description: "Estimated number of rows in the table"
