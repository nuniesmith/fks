# ============================================================================
# TRADING CONFIGURATION
# ============================================================================

[trading]
# Trading mode: simulation | paper | live
mode = "paper"
# Enable real order execution (DANGER: requires mode=live)
real_orders_enabled = false
# Dry run mode (log orders but don't execute)
dry_run = true

[trading.simulation]
# Initial balance for simulation
initial_balance = 100000.0
# Simulated slippage in basis points
slippage_bps = 5
# Simulated trading fee in basis points
fee_bps = 10
# Simulated fill delay in milliseconds
fill_delay_ms = 200
# Enable realistic slippage simulation
enable_slippage = true

[trading.orders]
# Default order type: market | limit
default_type = "limit"
# Time in force: gtc | ioc | fok
default_tif = "gtc"
# Minimum order size in USD
min_size_usd = 10.0
# Maximum order size in USD
max_size_usd = 100000.0
# Maximum slippage tolerance in basis points
max_slippage_bps = 50

# ============================================================================
# LOGGING & OBSERVABILITY
# ============================================================================

[logging]
# Log level: trace | debug | info | warn | error
level = "info"
# Log format: json | pretty
format = "json"
# Enable console output
console = true
# Enable file logging
file_enabled = false
# Log file path
file_path = "/var/log/janus/janus.log"
# Enable SQL query logging
sql_logging = false

[tracing]
# Enable distributed tracing
enabled = false
# Jaeger endpoint
jaeger_endpoint = "http://jaeger:14268/api/traces"
# Sampling rate (0.0 - 1.0)
sampling_rate = 0.1

[metrics]
# Metrics endpoint path
endpoint = "/metrics"
# Include detailed histogram buckets
detailed_histograms = true
# Custom metric labels
[metrics.labels]
service = "janus"
environment = "development"

# ============================================================================
# ALERTING (Optional)
# ============================================================================

[alerting]
# Enable alerting
enabled = false

[alerting.discord]
# Discord webhook URL
webhook_url = ""
# Enable notifications
enabled = false
# Notify on signals
notify_on_signal = true
# Notify on order fills
notify_on_fill = true
# Notify on errors
notify_on_error = true

[alerting.slack]
# Slack webhook URL
webhook_url = ""
# Enable notifications
enabled = false

[alerting.email]
# Enable email alerts
enabled = false
# SMTP host
smtp_host = "localhost"
# SMTP port
smtp_port = 587
# Recipients
recipients = []

# ============================================================================
# PARAMETER HOT-RELOAD
# ============================================================================

[param_reload]
# Enable parameter hot-reload from Redis
enabled = true
# Redis instance ID for namespacing
instance_id = "default"
# Reconnection delay in milliseconds
reconnect_delay_ms = 5000
# Maximum reconnection attempts (0 = unlimited)
max_retries = 0

# ============================================================================
# ENGINEERED HETEROGENEITY (Crowding Resistance)
# ============================================================================
# Each JANUS instance receives a unique parameter profile derived from its
# instance_id, producing idiosyncratic order flow that reduces cross-instance
# correlation and mitigates co-impact costs (Bucci et al. 2020).
#
# The same instance_id always generates the same profile (deterministic).
# Different instance_ids generate different profiles (diverse).

[heterogeneity]
# Enable engineered heterogeneity across brain regions
enabled = true
# Instance identifier — must be unique per deployment.
# Reuses the param_reload instance_id by convention; override per-instance
# via the JANUS_HETEROGENEITY_INSTANCE_ID environment variable.
instance_id = "default"

# --- Thalamus (Modality Attention Weights) ---
# Range of perturbation as fraction of default (e.g., 0.25 = ±25%)
thalamus_weight_range = 0.25
thalamus_temperature_range = 0.20

# --- Hypothalamus (Risk Setpoints) ---
hypothalamus_risk_setpoint_range = 0.20
hypothalamus_position_sizing_range = 0.25
hypothalamus_drawdown_range = 0.15

# --- Basal Ganglia (Action Selection) ---
basal_ganglia_dopamine_range = 0.30
basal_ganglia_threshold_range = 0.20
basal_ganglia_discount_range = 0.15
basal_ganglia_temperature_range = 0.25

# --- Prefrontal (LTN Constraint Priorities) ---
prefrontal_axiom_weight_range = 0.20
prefrontal_violation_threshold_range = 0.15

# --- Hippocampus (Replay & Consolidation) ---
hippocampus_alpha_range = 0.25
hippocampus_beta_range = 0.15
hippocampus_consolidation_range = 0.20

# --- Cerebellum (Execution Timing) ---
cerebellum_lambda_range = 0.25
cerebellum_eta_range = 0.20
cerebellum_pid_range = 0.15

# --- Cross-Instance Monitoring ---
[heterogeneity.monitoring]
# Minimum profile distance before crowding alert
min_distance_threshold = 0.05
# Maximum acceptable order flow correlation between instances
max_flow_correlation = 0.60
# Window size for flow correlation estimation
correlation_window = 100

# ============================================================================
# FEATURE ENGINEERING
# ============================================================================

[features]
# Enable Gramian Angular Field image generation
enable_gaf = false
# GAF image size
gaf_image_size = 32
# GAF method: summation | difference
gaf_method = "summation"

# Lookback windows for feature calculation
lookback_windows = [5, 10, 20, 50, 100]

# Normalize features
normalize = true
# Normalization method: minmax | zscore | robust
normalization_method = "zscore"

# ============================================================================
# SECURITY
# ============================================================================

[security]
# CORS allowed origins (comma-separated)
cors_origins = "*"
# Enable rate limiting
enable_rate_limit = true
# Requests per second per IP
rate_limit_rps = 100
# API key header name
api_key_header = "X-API-Key"

# ============================================================================
# ADVANCED SETTINGS
# ============================================================================

[advanced]
# Tokio worker thread count (0 = auto)
tokio_worker_threads = 0
# HTTP request timeout in seconds
http_timeout_secs = 30
# Database query timeout in seconds
db_query_timeout_secs = 30
# Signal buffer size
signal_buffer_size = 1000
# Order buffer size
order_buffer_size = 500
# Enable experimental features
experimental_features = false
