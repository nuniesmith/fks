groups:
  - name: data_factory_critical
    interval: 30s
    rules:
      - alert: DataCompletenessLow
        # HISTORY of the `> 0` guard. It was added when
        # data_completeness_percent was UNWIRED in the unified janus binary —
        # the gauge sat at its hard-zero default with no production caller, so
        # the guard suppressed a permanent false zero.
        #
        # ⚠ THAT PREMISE IS NO LONGER TRUE (measured 2026-08-23). Over 7 days
        # the gauge took SIX distinct values — 100 (99.31% of samples), 99.14,
        # 98.86, 98.29, 94.29, and 0 — and ratios like 94.286 and 99.143 are a
        # real computation, not a default. The SLI is wired and reporting.
        #
        # Consequence: the guard no longer suppresses a false zero, it creates a
        # BLIND SPOT. A genuine 0% completeness — total data loss, the worst
        # case this SLO exists for — matches neither this rule nor
        # DataCompletenessWarning. Covered by DataCompletenessZero below rather
        # than by dropping the guard, because short zeros ARE still startup
        # artifacts: both zero samples in the last 7 days were a single 5-minute
        # run at 2026-08-22 00:33Z, coinciding with a container start.
        #
        # NOT retuned here, but worth an owner's eye: `for: 1h` against observed
        # behaviour means this critical is close to unfirable. The condition held
        # exactly twice in 7 days, for 25 minutes each time, so it never fired.
        # A 94% completeness dip lasting 25 minutes currently pages nobody.
        # Changing that is an SLO decision, not a calibration fix.
        expr: data_completeness_percent > 0 and data_completeness_percent < 99.9
        for: 1h
        labels:
          severity: critical
          component: data-factory
          slo: completeness
        annotations:
          summary: "Data completeness below SLO threshold"
          description: "Data completeness is {{ $value | printf \"%.1f\" }}% (threshold: 99.9%). This indicates potential data loss or gaps in market data coverage."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/data-completeness-low.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-slo-error-budget"

      # Covers the case DataCompletenessLow's `> 0` guard deliberately excludes:
      # a completeness of EXACTLY zero, i.e. total loss of the ingestion SLI.
      # Without this, the worst possible value of the metric is the one nobody
      # is watching — the same structural hole as a purely relative throughput
      # test going silent once an outage outlives its own baseline window.
      #
      # `for: 20m` is measured, and the measurement was CORRECTED once.
      #
      # First sizing (2026-08-23): the only zero in 7 days of history was a
      # single 5-minute run coincident with a container start, so `for: 15m`
      # was called "3x the transient". That was wrong — it was 3x the SMALLEST
      # observed restart, not a representative one.
      #
      # Observed directly during a full stack rebuild the same day: recreating
      # janus produced a zero lasting 9.3 MINUTES (06:37:38Z -> 06:46:58Z). The
      # rule held — it went pending and resolved without firing — but the real
      # margin was 5.7 minutes, not the 10 the comment implied.
      #
      # Widened to 20m: ~2.1x the largest transient actually observed. A
      # restart-triggered false CRITICAL is precisely the alert-blindness this
      # platform keeps being hurt by, and five extra minutes of detection delay
      # on a genuine total outage costs almost nothing by comparison.
      - alert: DataCompletenessZero
        expr: data_completeness_percent == 0
        for: 20m
        labels:
          severity: critical
          component: data-factory
          slo: completeness
        annotations:
          summary: "Data completeness is ZERO — the ingestion SLI reports total loss"
          description: >
            data_completeness_percent has been exactly 0 for 20 minutes. This is
            total loss of the ingestion completeness SLI, not a degradation:
            DataCompletenessLow deliberately excludes zero (its `> 0` guard
            dates from when this gauge was unwired), so this rule is the only
            thing covering the metric's worst value. Either market data has
            stopped reaching the completeness calculation entirely, or the SLI
            producer has died while the rest of janus stays up.
          runbook: >
            1. Check ingestion is actually flowing — sum(rate(trades_ingested_total[5m]))
            should be ~100+/s. If it is healthy, the SLI producer is broken rather
            than the data, which is the less urgent of the two.
            2. Startup transients are expected and were measured at ~5 minutes; a
            reading that survives 15m is not a restart.
            3. If janus was just recreated, confirm the value recovers to 100 on
            its own before investigating further.
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/data-completeness-low.md"

      - alert: IngestionLatencyHigh
        expr: histogram_quantile(0.99, rate(ingestion_latency_ms_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: critical
          component: data-factory
          slo: latency
        annotations:
          summary: "Ingestion latency P99 exceeds SLO"
          description: "P99 ingestion latency is {{ $value | humanizeDuration }} (threshold: 1000ms). Market data may be stale."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/ingestion-latency-high.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-slo-error-budget"

      # Removed CircuitBreakerOpen (2026-07-01): circuit_breaker_state is
      # never exported — the rate-limiter/circuit-breaker subsystem is not
      # wired in the unified janus binary (the only sibling metric,
      # janus_supervisor_circuit_breaker_trips_total, is unrelated).

      # MISNAMED, and it matters. `questdb_disk_usage_percent` measures the HOST
      # filesystem QuestDB writes to, not QuestDB's own data — verified
      # 2026-09-02: the metric read 83.42% while the host / was 83% and the
      # questdb volume held 297MB, about 0.07% of the disk. An operator sent to
      # investigate QuestDB finds nothing wrong and loses the incident.
      #
      # The actual cause is almost always Docker build cache; `HostDiskSpaceCritical`
      # below already documents that from the 2026-03-26 outage, but it does not
      # fire until 95% used. This is the one that fires first, so it carries the
      # remedy.
      - alert: DiskUsageHigh
        # SOURCE CHANGED 2026-09-03: was `questdb_disk_usage_percent`, a gauge
        # janus recomputes roughly TWICE A DAY. Measured: 2 changes in 24h. With
        # `for: 5m` on a twice-daily metric, this alert reports a disk state up
        # to twelve hours old — and after an operator actually frees space it
        # keeps firing on the cached number until janus happens to resample.
        #
        # Observed exactly that: 27GB of Docker build cache reclaimed took the
        # host from 83% to 78%, and this stayed CRITICAL at a frozen 83.42%.
        # An alert that cannot see a fix is one you learn to ignore.
        #
        # node-exporter publishes the same filesystem every 15s and agrees with
        # `df` to two decimal places (78.10% vs 78%). It is also the source
        # HostDiskSpaceCritical below already uses, so the two now agree by
        # construction instead of by coincidence.
        expr: |
          100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
                     / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 80
        for: 5m
        labels:
          severity: critical
          component: questdb
        annotations:
          summary: "Host disk {{ $value | printf \"%.1f\" }}% full (the filesystem QuestDB writes to)"
          description: "The HOST filesystem is {{ $value | printf \"%.1f\" }}% full (threshold: 80%). This is not QuestDB's own data — its volume is typically a few hundred MB. Writes across every service fail when this reaches 100%. Usual cause: Docker build cache. Check `docker system df`, then `docker builder prune -f` (reclaimed 27GB on 2026-09-02) and `docker image prune -a`."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/disk-usage-high.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-operations-overview"

      # Host disk space alert — fired 2026-03-26 when Docker build cache
      # filled the 3.6TB NVMe to 100%, crashing Postgres and Prometheus WAL.
      # Run `docker builder prune -f` and `docker image prune -a` to recover.
      - alert: HostDiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
        for: 2m
        labels:
          severity: critical
          component: host
        annotations:
          summary: "Host root filesystem below 5% free"
          description: "Root filesystem has {{ $value | humanize }}% space remaining. Run `docker builder prune -f && docker image prune -a` to recover Docker build cache space."

      - alert: HostDiskSpaceWarning
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "Host root filesystem below 15% free"
          description: "Root filesystem has {{ $value | humanize }}% space remaining. Consider pruning Docker build cache."

      - alert: AllExchangesDown
        expr: sum(websocket_connected) == 0
        for: 1m
        labels:
          severity: critical
          component: data-factory
        annotations:
          summary: "All exchange WebSocket connections down"
          description: "No active WebSocket connections to any exchange. Market data ingestion has stopped completely."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/all-exchanges-down.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-operations-overview"

  - name: data_factory_warning
    interval: 30s
    rules:
      - alert: DataCompletenessWarning
        expr: data_completeness_percent < 99.95 and data_completeness_percent >= 99.9
        for: 10m
        labels:
          severity: warning
          component: data-factory
          slo: completeness
        annotations:
          summary: "Data completeness approaching SLO threshold"
          description: "Data completeness is {{ $value | printf \"%.1f\" }}% (warning: <99.95%). Investigate potential gaps."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/data-completeness-low.md"

      # Removed HighRateLimitRejectionRate (2026-07-01): no rate_limiter_*
      # metrics are exported (subsystem not wired in the unified binary).

      - alert: GapDetectionAccuracyLow
        # `> 0 and` guard: gap_detection_accuracy_percent is UNWIRED — no producer
        # computes an accuracy figure in the live path (the gap-detection crate
        # has no false-positive/ground-truth concept; the gauge's setter has only
        # example callers), so it stays at its hard-zero default. Guard suppresses
        # the false zero; a real accuracy value would still trip this once wired.
        expr: gap_detection_accuracy_percent > 0 and gap_detection_accuracy_percent < 99.0
        for: 10m
        labels:
          severity: warning
          component: gap-detection
        annotations:
          summary: "Gap detection accuracy below expected threshold"
          description: "Gap detection accuracy is {{ $value | printf \"%.1f\" }}% (expected: >99%). High false positive rate detected."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/gap-detection-accuracy-low.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-gap-detection"

      - alert: ActiveGapsHigh
        expr: gap_detection_active_gaps > 10
        for: 5m
        labels:
          severity: warning
          component: gap-detection
        annotations:
          summary: "High number of active data gaps"
          description: "{{ $value }} active gaps detected (threshold: 10). Data may be incomplete or backfill is struggling to keep up."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/active-gaps-high.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-gap-detection"

      - alert: ExchangeDisconnected
        expr: websocket_connected == 0
        for: 3m
        labels:
          severity: warning
          component: data-factory
        annotations:
          summary: "Exchange WebSocket disconnected"
          description: "WebSocket connection to {{ $labels.exchange }} has been down for >3 minutes."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/exchange-disconnected.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-operations-overview"

      - alert: DiskUsageWarning
        expr: |
          100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
                     / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 70
          and
          100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
                     / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) <= 80
        for: 10m
        labels:
          severity: warning
          component: questdb
        annotations:
          summary: "QuestDB disk usage elevated"
          description: "The HOST filesystem is {{ $value | printf \"%.1f\" }}% full (warning: >70%). Not QuestDB's own data. Usual cause is Docker build cache — `docker system df` then `docker builder prune -f`."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/disk-usage-high.md"

      - alert: HighBackfillQueueSize
        expr: backfill_queue_size > 100
        for: 10m
        labels:
          severity: warning
          component: backfill
        annotations:
          summary: "Backfill queue size is high"
          description: "Backfill queue has {{ $value }} pending requests (threshold: 100). Backfill processing may be lagging."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/high-backfill-queue.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-operations-overview"

      - alert: QuestDBWriteErrors
        # Repointed: questdb_write_errors_total is not an exported name;
        # questdb_unhandled_errors_total is the live error counter.
        expr: rate(questdb_unhandled_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: questdb
        annotations:
          summary: "QuestDB experiencing write errors"
          description: "QuestDB write error rate is {{ $value }} errors/sec. Check database health and disk space."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/questdb-write-errors.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-operations-overview"

  - name: data_factory_info
    interval: 1m
    rules:
      # Removed CircuitBreakerHalfOpen (2026-07-01): same unwired
      # circuit_breaker_state metric as CircuitBreakerOpen above.

      - alert: DataFactoryRestarted
        # Repointed: job="data-factory" matched no scrape target (the Python
        # data service was removed; janus is the data factory now).
        expr: changes(up{job="fks-janus"}[5m]) > 0
        for: 30s
        labels:
          severity: info
          component: data-factory
        annotations:
          summary: "Data Factory service restarted"
          description: "The Data Factory service has restarted. Monitor for any issues during recovery."
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-operations-overview"

      - alert: HighWebSocketReconnectionRate
        expr: rate(websocket_reconnections_total[5m]) > 0.1
        for: 5m
        labels:
          severity: info
          component: data-factory
        annotations:
          summary: "Elevated WebSocket reconnection rate"
          description: "WebSocket connections to {{ $labels.exchange }} are reconnecting frequently ({{ $value }} reconnections/sec). Network instability possible."
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-operations-overview"

  - name: backfill_orchestration
    interval: 30s
    rules:
      - alert: BackfillQueueSizeHigh
        expr: backfill_queue_size > 100
        for: 10m
        labels:
          severity: warning
          component: backfill
        annotations:
          summary: "Backfill queue size is elevated"
          description: "Backfill queue has {{ $value }} pending requests (threshold: 100). Processing may be lagging behind gap detection."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/high-backfill-queue.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-backfill-orchestration"

      - alert: BackfillQueueSizeCritical
        expr: backfill_queue_size > 500
        for: 5m
        labels:
          severity: critical
          component: backfill
        annotations:
          summary: "Backfill queue size critically high"
          description: "Backfill queue has {{ $value }} pending requests (threshold: 500). System may be unable to keep up with gap detection."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/high-backfill-queue.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-backfill-orchestration"

      - alert: BackfillFailureRateHigh
        expr: 100 * (rate(backfills_completed_total{status="failed"}[10m]) / rate(backfills_completed_total[10m])) > 20
        for: 10m
        labels:
          severity: warning
          component: backfill
        annotations:
          summary: "High backfill failure rate"
          description: "{{ $value | printf \"%.1f\" }}% of backfills are failing (threshold: 20%). Check logs for errors."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/backfill-failures.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-backfill-orchestration"

      - alert: BackfillMaxRetriesExceeded
        expr: rate(backfill_max_retries_exceeded_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: backfill
        annotations:
          summary: "Backfills exceeding max retries"
          description: "{{ $value }} backfills/sec are exceeding max retry attempts for {{ $labels.exchange }}/{{ $labels.symbol }}. Persistent failures detected."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/backfill-max-retries.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-backfill-orchestration"

      # Removed BackfillDurationHigh (2026-07-01): the
      # backfill_duration_seconds histogram is never instrumented (histograms
      # need explicit registration, unlike lazy counters) — no data to
      # evaluate. Restore once the histogram is wired.

      - alert: BackfillThrottleRejectionHigh
        expr: rate(backfill_throttle_rejections_total[5m]) > 1
        for: 5m
        labels:
          severity: info
          component: backfill
        annotations:
          summary: "High backfill throttle rejection rate"
          description: "{{ $value }} backfills/sec are being throttled due to {{ $labels.reason }}. Resources may be constrained."
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-backfill-orchestration"

      # Removed BackfillLockContentionHigh (2026-07-01): neither
      # backfill_lock_failed_total nor backfill_lock_acquired_total is
      # exported — the distributed-lock counters are not instrumented.

  - name: performance_slo
    interval: 30s
    rules:
      - alert: IngestionLatencyP95High
        expr: histogram_quantile(0.95, rate(ingestion_latency_ms_bucket[5m])) > 800
        for: 10m
        labels:
          severity: warning
          component: data-factory
          slo: latency
        annotations:
          summary: "Ingestion latency p95 elevated"
          description: "p95 ingestion latency is {{ $value }}ms (warning: >800ms). Performance degradation detected."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/ingestion-latency-high.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-performance-ingestion"

      # ── Relative collapse, not an absolute floor (recalibrated 2026-08-17) ──
      # The old rule was `< 50` trades/sec. Measured against 24h of HEALTHY
      # traffic: median 46.9/s, p5 19.4/s, p95 122.4/s — a ~6x natural range,
      # with the median BELOW the threshold. It was therefore true for 59.4%
      # of the day. An alert that fires more often than not is not a detector;
      # it is the alert-blindness that let a real 43-hour treasury blackout sit
      # unactioned (2026-08-14..16).
      #
      # No absolute number can work against that much variance, and any number
      # picked today drifts out of calibration as volume changes — which is how
      # the 50 got here. So this asks a relative question: has throughput
      # COLLAPSED against its own recent baseline?
      #
      #   clamp_min(0.20 * <6h mean>, 5)
      #
      # The 20% arm catches a real collapse at any volume level (a drop from
      # 200/s to 60/s is a 70% failure the old rule ignored entirely, since 60
      # > 50). The clamp_min(…, 5) floor is load-bearing and NOT redundant: a
      # pure relative test goes SILENT once an outage outlives its own baseline
      # window — after 6h dead the 6h mean is also ~0, so 20% of it is ~0 and
      # nothing fires. The floor guarantees a dead feed keeps paging forever.
      #
      # Validated on the same 24h of healthy data: true 0.35% of the day (from
      # 59.4%), and those are brief dips that `for: 15m` damps. Headroom check:
      # the lowest 5m rate seen in 24h was 10.2/s, so the 5/s floor sits ~2x
      # below anything healthy traffic has actually done.
      #
      # Re-derive (don't guess) if the venue set or symbol count changes:
      #   quantile_over_time(0.05, sum(rate(trades_ingested_total[5m]))[24h:5m])
      # ── The backup is the last line of defence; alert on it (2026-08-18) ──
      # There was NO backup alert anywhere in ~120 rules. The scheduled
      # snapshot committed daily, encrypted fine, and FAILED TO PUSH from
      # 2026-08-07 (artifact crossed GitHub's hard 100 MiB per-blob limit),
      # reporting success the whole time because it ran
      # `git push -q ... 2>/dev/null`. Twelve days of snapshots existed only
      # on the same LV they were backing up, and it was found by a review, not
      # by monitoring. Fed by fks-state.sh via the node_exporter textfile
      # collector.
      #
      # ABSENT is deliberately treated as FAILING: if the metric stops being
      # written the backup is not running, which is the same operational state
      # as a failing one. A rule that goes quiet when its subject disappears is
      # the failure mode this platform keeps re-learning.
      - alert: StateBackupNotReachingRemote
        expr: |
          fks_state_backup_push_ok == 0
          or (time() - fks_state_backup_last_push_success_timestamp_seconds) > 129600
          or absent(fks_state_backup_push_ok)
        for: 30m
        labels:
          severity: critical
          component: backup
          channel: money
        annotations:
          summary: "Off-host state backup is NOT reaching the remote"
          description: >
            The encrypted state snapshot has not successfully pushed in over
            36h, or the last push explicitly failed, or the metric has stopped
            being written entirely. Snapshots may still be committing LOCALLY —
            which is worthless, because local snapshots live on the same
            filesystem they exist to protect.
          runbook: >
            1) journalctl -u fks-state-snapshot --since '2 days ago'   (the push
               error is now logged verbatim; it was previously discarded)
            2) git -C ~/.local/share/fks-state rev-list --count @{u}..HEAD
            3) If blobs exceed 100 MiB, the artifact has outgrown git transport.
               fks_qdrant_data (419 MB raw, derived vectors) is the driver; the
               irreplaceable ledger is only ~6 MB. See docs/STATE_BACKUP.md.

      - alert: IngestionThroughputLow
        expr: sum(rate(trades_ingested_total[5m])) < clamp_min(0.20 * avg_over_time(sum(rate(trades_ingested_total[5m]))[6h:5m]), 5)
        for: 15m
        labels:
          severity: warning
          component: data-factory
        annotations:
          summary: "Trade ingestion throughput has collapsed vs its own baseline"
          description: "Ingestion is {{ $value }} trades/sec — under 20% of the trailing 6h average (or below the 5/s floor). Sustained 15m. Market data ingestion may be impaired. NOTE: this is a RELATIVE test; a low absolute number alone is normal (24h median is ~47/s with a 6x range)."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/low-throughput.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-performance-ingestion"

      # Removed QuestDBWriteLatencyHigh (2026-07-01): the
      # questdb_write_latency_seconds histogram is never instrumented
      # (questdb_writes_total exists, but no latency buckets).

      - alert: QuestDBWriteErrorRateHigh
        # Repointed numerator: questdb_write_errors_total is not an exported
        # name; questdb_unhandled_errors_total is the live error counter.
        expr: 100 * (rate(questdb_unhandled_errors_total[5m]) / rate(questdb_writes_total[5m])) > 1
        for: 5m
        labels:
          severity: critical
          component: questdb
        annotations:
          summary: "QuestDB write error rate critically high"
          description: "{{ $value | printf \"%.1f\" }}% of QuestDB writes are failing (threshold: 1%). Data loss possible."
          runbook_url: "https://github.com/nuniesmith/fks/blob/main/docs/runbooks/questdb-write-errors.md"
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-performance-ingestion"

      - alert: GapDetectionRateAnomaly
        expr: abs(rate(gaps_detected_total[10m]) - rate(gaps_detected_total[10m] offset 1h)) > 5
        for: 15m
        labels:
          severity: info
          component: gap-detection
        annotations:
          summary: "Gap detection rate anomaly"
          description: "Gap detection rate has changed significantly compared to 1h ago. Current: {{ $value }} gaps/sec."
          dashboard_url: "https://grafana.fkstrading.xyz/d/fks-gap-detection"

      - alert: DedupSetSizeHigh
        expr: backfill_dedup_set_size > 10000
        for: 10m
        labels:
          severity: warning
          component: backfill
        annotations:
