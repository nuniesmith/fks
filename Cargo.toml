# ============================================================================
# FKS Root Workspace
# ============================================================================
# Slim virtual workspace. The reusable Rust pieces now live in their own
# repos and are consumed from crates.io (see docs/architecture/REPO_TOPOLOGY.md):
#
#   - rustrade  → crates.io `rustrade-framework`   (trading framework)
#   - janus     → github.com/nuniesmith/janus      (trading brain; Docker image)
#   - indicators-ta / exchange-apiws → crates.io   (TA math / exchange REST-WS)
#
# What still builds in-tree, each as its own nested workspace:
#
#   - src/proto        — fks-proto (centralised protobuf definitions)
#   - crates/spawner   — bot-container lifecycle service
#   - crates/rustrade  — LEFTOVER: kept only to host the fks-bot-example bot
#                        until it's ported to the published crate (TODO.md P0)
#
# See `SPLIT_PLAN.md` for the remaining moves.
# ============================================================================

[workspace]
resolver = "3"

members = [
    "src/proto",
]

# ============================================================================
# Workspace Package Defaults
# ============================================================================

[workspace.package]
version      = "0.1.0"
edition      = "2024"
authors      = ["nuniesmith"]
license      = "MIT"
repository   = "https://github.com/nuniesmith/fks"
rust-version = "1.94.1"
publish      = false

# ============================================================================
# Workspace Dependencies (only those used by src/proto + src/spawner)
# ============================================================================

[workspace.dependencies]
# Async runtime
tokio        = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# HTTP server (spawner)
axum = { version = "0.8", features = ["macros", "ws"] }

# Serialisation
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

# Metrics
prometheus = "0.14"

# Error handling
anyhow    = "1.0"
thiserror = "2.0"

# Utilities
uuid   = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ============================================================================
# Profiles
# ============================================================================

[profile.dev]
opt-level = 0
debug     = true

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 16
strip         = true
debug         = false
panic         = "abort"

[profile.release-with-debug]
inherits = "release"
debug    = true
strip    = false
