# =============================================================================
# Python CI — lint + type-check for src/ruby
# =============================================================================
# Runs ruff (lint + format check) and mypy on every PR that touches the
# Python codebase.
#
# Note: pytest is not wired up here yet because pyproject.toml is currently
# empty (no declared dependencies).  Once pyproject.toml is populated with
# [project.dependencies] and [project.optional-dependencies.dev], add:
#
#   - name: 🧪 pytest
#     working-directory: src/ruby
#     run: |
#       pip install -e ".[dev]"
#       python -m pytest tests/ -x -q
#
# =============================================================================

name: 🐍 Python

on:
    pull_request:
        paths:
            - "src/ruby/**"
            - ".github/workflows/python.yml"
    push:
        branches: [main]
        paths:
            - "src/ruby/**"
            - ".github/workflows/python.yml"

concurrency:
    group: python-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: ruff + mypy
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4

            - name: 🐍 Set up Python 3.13
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: 📦 Install lint tools
              run: pip install ruff mypy

            - name: 🔍 ruff check
              working-directory: src/ruby
              run: ruff check src/

            - name: 🎨 ruff format --check
              working-directory: src/ruby
              run: ruff format --check src/

            - name: 🔬 mypy
              working-directory: src/ruby
              # Non-blocking day-one: mypy runs but doesn't fail the job.
              # Tighten to a hard failure once pyproject.toml is populated
              # and missing stubs are installed.
              continue-on-error: true
              run: mypy src/ --ignore-missing-imports --no-error-summary
