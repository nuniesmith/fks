# ================================================================
# Futures Trader — Master Configuration
# KuCoin USDTM Perpetual Futures — Multi-Asset Scalper
# ================================================================

mode: ${TRADING_MODE:-sim} # sim | live
timezone: America/New_York

# ─── Exchange ────────────────────────────────────────────────────
exchange:
    id: kucoinfutures
    margin_mode: isolated
    position_mode: one_way
    session_recycle_sec: 21600
    credentials:
        api_key: ${KUCOIN_API_KEY}
        api_secret: ${KUCOIN_API_SECRET}
        passphrase: ${KUCOIN_PASSPHRASE}

# ─── Assets ──────────────────────────────────────────────────────
# leverage / margin_pct are *targets* — the risk engine scales them
# down dynamically based on live conditions.  Set these to the
# maximum you are willing to use in ideal conditions.
#
# Tier guide used below:
#   BLUE CHIP  — BTC, ETH          → highest leverage, largest margin
#   MAJOR ALT  — SOL, XRP, BNB     → moderate leverage
#   MID ALT    — DOGE, SUI, AVAX…  → lower leverage, smaller margin
#   MEME       — PEPE, WIF, FART…  → low leverage, small margin
#   METALS     — GOLD, SILVER      → lowest leverage (different vol profile)
# ─────────────────────────────────────────────────────────────────
assets:
    # ── Blue chip ────────────────────────────────────────────────
    btc:
        symbol: XBTUSDTM
        base: BTC
        leverage: 20 # risk engine range: ~7x–24x
        margin_pct: 0.13
        enabled: true

    eth:
        symbol: ETHUSDTM
        base: ETH
        leverage: 20 # risk engine range: ~7x–24x
        margin_pct: 0.12
        enabled: true

    # ── Major alts ───────────────────────────────────────────────
    sol:
        symbol: SOLUSDTM
        base: SOL
        leverage: 10 # risk engine range: ~3x–12x
        margin_pct: 0.10 # was 0.12 — trimmed to leave room for mids

    xrp:
        symbol: XRPUSDTM
        base: XRP
        leverage: 15
        margin_pct: 0.04 # was 0.03 — small bump; still tiny draw
        enabled: true

    bnb:
        symbol: BNBUSDTM
        base: BNB
        leverage: 15
        margin_pct: 0.04 # was 0.03
        enabled: true

    # ── Mid alts ─────────────────────────────────────────────────
    doge:
        symbol: DOGEUSDTM
        base: DOGE
        leverage: 10
        margin_pct: 0.08 # was 0.09
        enabled: true

    sui:
        symbol: SUIUSDTM
        base: SUI
        leverage: 10
        margin_pct: 0.06 # was 0.07
        enabled: true

    avax:
        symbol: AVAXUSDTM
        base: AVAX
        leverage: 10
        margin_pct: 0.06 # was 0.07
        enabled: true

    ada:
        symbol: ADAUSDTM
        base: ADA
        leverage: 10
        margin_pct: 0.03 # was 0.02 — thin ticks; slightly more room
        enabled: true

    dot:
        symbol: DOTUSDTM
        base: DOT
        leverage: 10
        margin_pct: 0.02
        enabled: true

    link:
        symbol: LINKUSDTM
        base: LINK
        leverage: 10
        margin_pct: 0.02
        enabled: true

    # ── Meme coins ────────────────────────────────────────────────
    # These already have conservative target leverage (5x).
    # The risk engine can reduce further to global_min_leverage (2x)
    # during extreme vol without these ever touching dangerous territory.
    pepe:
        symbol: PEPEUSDTM
        base: PEPE
        leverage: 5
        margin_pct: 0.07 # was 0.08
        enabled: true

    wif:
        symbol: WIFUSDTM
        base: WIF
        leverage: 5
        margin_pct: 0.03 # was 0.04
        enabled: true

    fart:
        symbol: FARTCOINUSDTM
        base: FART
        leverage: 5
        margin_pct: 0.03 # was 0.04
        enabled: true

    trump:
        symbol: TRUMPUSDTM
        base: TRUMP
        leverage: 5
        margin_pct: 0.02
        enabled: true

    bonk:
        symbol: 1000BONKUSDTM
        base: 1000BONK
        leverage: 5
        margin_pct: 0.02
        enabled: true

    shib:
        symbol: SHIBUSDTM
        base: SHIB
        leverage: 5
        margin_pct: 0.02
        enabled: true

    # ── Metals ────────────────────────────────────────────────────
    # Lower intra-day vol than crypto — quality and wave gates matter more.
    # Do NOT boost leverage on metals; the exchange fees eat thin moves.
    gold:
        symbol: XAUTUSDTM
        base: GOLD
        leverage: 5
        margin_pct: 0.04
        enabled: true

    silver:
        symbol: XAGUSDTM
        base: XAG
        leverage: 5
        margin_pct: 0.03
        enabled: true

# ─── Capital ─────────────────────────────────────────────────────
capital:
    balance_usdt: ${CAPITAL:-50000.0}
    risk_per_add_pct:
        0.008 # risk 0.8% of the asset capital pool per add
        # (default was 0.01 = 1.0% — slightly tighter)
    max_stack: 3
    min_order_usdt: 0.25

# ─── Risk ────────────────────────────────────────────────────────
risk:
    max_daily_loss_pct: 0.05 # 5% of balance — halt all trading
    max_asset_daily_loss_pct: 0.02 # 2% per asset — pause that asset
    max_consecutive_losses: 3
    max_open_trades: 3 # hard cap on simultaneous positions
    cooldown_after_loss_sec: 300 # 5-min cooldown per SL hit
    consecutive_loss_cooldown_sec: 900 # 15-min cooldown when breaker trips
    daily_trade_limit: 100
    asset_trade_limit: 25
    portfolio_max_unrealized_loss_pct: 0.03
    max_portfolio_margin_pct: 0.80
    correlation_guard:
        enabled: false

# ─── Dynamic Risk Engine ─────────────────────────────────────────
# Scales leverage and margin_pct DOWN from their per-asset targets
# based on five live signals computed every 30 seconds:
#
#   vol_pct           — ATR percentile (0–1)  high = dangerous
#   regime            — trending / neutral / ranging / volatile
#   quality           — signal quality score (0–100)
#   daily_drawdown    — today's loss as % of balance
#   consecutive_losses— current loss streak for the asset
#
# Each signal produces a sub-scalar (0–1).  All sub-scalars multiply
# together then are floored at min_scalar.  The result drives:
#   effective_leverage  = round(asset.leverage × combined_scalar)
#   effective_margin    = asset.margin_pct × combined_scalar
#
# Both are independently tunable via separate curve sets.
# ─────────────────────────────────────────────────────────────────
risk_engine:
    enabled: true
    min_scalar:
        0.30 # floor: never below 30% of target
        # e.g. 20x BTC → min 6x; 5x meme → min 2x
    allow_leverage_boost: true # allow slight boost in ideal conditions
    max_leverage_scalar: 1.15 # cap boost at +15% above target leverage
    global_min_leverage: 2 # absolute exchange floor for all assets

    # ── Volatility curves ─────────────────────────────────────────
    # [vol_pct, scalar] — piecewise linear, sorted ascending.
    # Crypto vol moves fast: cut leverage early and hard.
    vol_leverage_curve:
        - [0.00, 1.10] # dead market — slight boost OK
        - [0.25, 1.00] # normal
        - [0.50, 0.85] # elevated — tighten up
        - [0.70, 0.60] # high vol — noticeable cut
        - [0.85, 0.40] # very high — significant cut
        - [1.00, 0.30] # spike / crash conditions

    # Margin cuts slightly faster than leverage in extreme vol
    # (smaller capital pool = less at stake even if leverage floor holds)
    vol_margin_curve:
        - [0.00, 1.10]
        - [0.25, 1.00]
        - [0.50, 0.80]
        - [0.70, 0.55]
        - [0.85, 0.38]
        - [1.00, 0.28]

    # ── Regime multipliers ────────────────────────────────────────
    # Trending markets are the best conditions for this strategy.
    # Volatile regime = choppy / whipsaw — pull back hard.
    regime_leverage_multipliers:
        trending: 1.10 # strong trend — allow full leverage + small boost
        neutral: 1.00 # baseline
        ranging: 0.80 # false signals in ranges — reduce
        volatile: 0.55 # whipsaw risk — cut leverage significantly

    regime_margin_multipliers:
        trending: 1.05
        neutral: 1.00
        ranging: 0.85
        volatile: 0.65

    # ── Signal quality curves ─────────────────────────────────────
    # [quality_score, scalar] — quality 0–100.
    # Low quality = wave / AO / imbalance not aligned — reduce size.
    quality_leverage_curve:
        - [0, 0.55]
        - [40, 0.70]
        - [60, 0.88]
        - [75, 1.00]
        - [100, 1.00]

    quality_margin_curve:
        - [0, 0.55]
        - [40, 0.72]
        - [60, 0.88]
        - [75, 1.00]
        - [100, 1.00]

    # ── Daily drawdown curves ─────────────────────────────────────
    # [drawdown_fraction, scalar] where fraction = |loss| / balance.
    # Ratchets down position size progressively as the day goes badly.
    # max_asset_daily_loss_pct is 0.02 (2%), so this spans that range.
    drawdown_leverage_curve:
        - [0.000, 1.00]
        - [0.004, 0.90] # -0.4% loss → start trimming
        - [0.008, 0.75] # -0.8%
        - [0.013, 0.58] # -1.3%
        - [0.020, 0.40] # -2.0% → near asset daily limit; barely trading

    drawdown_margin_curve:
        - [0.000, 1.00]
        - [0.004, 0.85]
        - [0.008, 0.70]
        - [0.013, 0.52]
        - [0.020, 0.35]

    # ── Consecutive loss step table ───────────────────────────────
    # Applied equally to leverage and margin.
    # After N losses in a row, scale back by this factor.
    # The circuit breaker (max_consecutive_losses: 3) blocks entry
    # entirely at 3+, so these are the pre-breaker de-risking steps.
    consec_loss_scalars:
        0: 1.00
        1: 0.88 # one loss — small reduction, stay in game
        2: 0.72 # two losses — meaningful cut
        3: 0.55 # breaker is about to trip anyway

# ─── ML gating ───────────────────────────────────────────────────
ml:
    enabled: false
    models_dir: /app/models

# ─── Optuna ──────────────────────────────────────────────────────
optuna:
    n_trials: 70
    timeout_sec: 14
    intervals:
        default_sec: 1200
        fast_sec: 600 # fart, wif, pepe, doge
        slow_sec: 1800 # btc, eth
    fast_assets: [fart, wif, pepe, doge]
    slow_assets: [btc, eth]

# ─── Redis ───────────────────────────────────────────────────────
redis:
    url: ${REDIS_URL:-redis://localhost:6379/0}
    password: ${REDIS_PASSWORD:-}
    key_prefix: "futures:"

# ─── Discord ─────────────────────────────────────────────────────
discord:
    webhook_url: ${DISCORD_WEBHOOK_URL:-}
    enabled: true

# ─── Logging ─────────────────────────────────────────────────────
logging:
    level: ${LOG_LEVEL:-INFO}

# ─── Deployment ──────────────────────────────────────────────────
deploy:
    platform: linux/amd64
    restart_policy: unless-stopped
