# =============================================================================
# kucoin — Bot runtime
#
# All math  → indicators-ta   (lib name: indicators)
# All I/O   → exchange-apiws  (lib name: exchange_apiws)
# This crate → strategy orchestration, order execution, notifications
# =============================================================================

[package]
name         = "kucoin"
version      = "0.1.0"
edition      = "2024"
authors      = ["nuniesmith"]
license      = "MIT"
repository   = "https://github.com/nuniesmith/kucoin"
rust-version = "1.94.1"
publish      = false

[[bin]]
name = "kucoin"
path = "src/main.rs"

# =============================================================================
# Dependencies
# =============================================================================

[dependencies]

# ── Strategy + exchange I/O ───────────────────────────────────────────────────
# Path deps while developing locally. Once published to crates.io swap to:
indicators-ta  = "0.1.3"
exchange-apiws = "0.1.10"

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
futures-util = "0.3.32"

# ── Serialisation ─────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Logging ───────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender   = "0.2"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow    = "1"
thiserror = "2"

# ── Infrastructure ────────────────────────────────────────────────────────────
redis   = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
dotenvy = "0.15"
chrono  = { version = "=0.4.41", features = ["serde"] }
uuid    = { version = "1",   features = ["v4"] }
clap    = { version = "4",   features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"

# =============================================================================
# Profiles
# =============================================================================

[profile.dev]
opt-level = 0
debug     = true

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 16
strip         = true
debug         = false
panic         = "abort"

[profile.release-with-debug]
inherits = "release"
debug    = true
strip    = false

# =============================================================================
# Lints
# =============================================================================

[lints.rust]
unsafe_code  = "warn"
missing_docs = "allow"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }

missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
module_name_repetitions  = "allow"
must_use_candidate       = "allow"
cast_precision_loss      = "allow"
cast_possible_truncation = "allow"
cast_sign_loss           = "allow"
too_many_arguments       = "allow"
option_if_let_else       = "allow"
doc_markdown             = "allow"
