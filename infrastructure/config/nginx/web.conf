# Nginx configuration for KMP Web Service
server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types (CRITICAL - this enables text/html, text/css, etc.)
    include /etc/nginx/mime.types;
    
    # Default type for unknown extensions
    default_type application/octet-stream;

    # Additional MIME type overrides for source maps
    types {
        application/json map;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml application/wasm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: wss: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss: http://localhost:* ws://localhost:*; img-src 'self' https: data: blob:; frame-ancestors 'self';" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"fks_web"}';
        add_header Content-Type application/json;
    }

    # Source maps - serve with correct content type
    location ~* \.map$ {
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        expires 1d;
    }

    # JavaScript files
    location ~* \.js$ {
        add_header Content-Type application/javascript;
        add_header Access-Control-Allow-Origin *;
        expires 1h;
        add_header Cache-Control "public";
    }

    # WebAssembly files
    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
        add_header Access-Control-Allow-Origin *;
        expires 1d;
    }

    # Static assets (images, fonts)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Access-Control-Allow-Origin *;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # API proxy - forward API calls to janus-gateway
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_backend "http://janus-gateway:8001";
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # WebSocket proxy
    location /ws/ {
        resolver 127.0.0.11 valid=30s;
        set $ws_backend "http://janus-gateway:8001";
        proxy_pass $ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
