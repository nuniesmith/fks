# JANUS Vision Helm Chart - Default Values
# This file contains default configuration values for the Vision deployment

# ==============================================================================
# Global Settings
# ==============================================================================
global:
  # Image registry
  imageRegistry: ""
  # Image pull secrets
  imagePullSecrets: []
  # Storage class for persistent volumes
  storageClass: ""
  # Namespace (if not set, uses release namespace)
  namespace: ""

# ==============================================================================
# Vision Metrics Server Configuration
# ==============================================================================
metricsServer:
  enabled: true

  # Container image
  image:
    registry: docker.io
    repository: janus/vision-metrics
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  # Replicas
  replicaCount: 2

  # Resource limits and requests
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # Pod affinity and anti-affinity
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - vision-metrics
            topologyKey: kubernetes.io/hostname

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Service configuration
  service:
    type: ClusterIP
    metricsPort: 9090
    healthPort: 8080
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"
      prometheus.io/path: "/metrics"

  # Ingress configuration
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: vision-metrics.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: vision-metrics-tls
        hosts:
          - vision-metrics.example.com

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Liveness and readiness probes
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Environment variables
  env:
    RUST_LOG: "info"
    METRICS_PORT: "9090"
    HEALTH_PORT: "8080"

  # Secret environment variables (from Kubernetes secrets)
  envFrom: []

# ==============================================================================
# Vision Live Pipeline Configuration
# ==============================================================================
livePipeline:
  enabled: true

  # Container image
  image:
    registry: docker.io
    repository: janus/vision-pipeline
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  # Replicas
  replicaCount: 1

  # Resource limits and requests
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 2Gi

  # Pod affinity
  affinity: {}

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Service configuration
  service:
    type: ClusterIP
    metricsPort: 9090
    healthPort: 8080
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"

  # Ingress
  ingress:
    enabled: false
    className: nginx
    hosts:
      - host: vision-pipeline.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Autoscaling (typically disabled for stateful pipeline)
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  # Probes
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Environment variables
  env:
    RUST_LOG: "info"
    PIPELINE_MODE: "live"
    EXECUTION_ENABLED: "true"
    PORTFOLIO_REBALANCE_INTERVAL: "300"
    METRICS_PORT: "9090"
    HEALTH_PORT: "8080"

  # Persistent storage for pipeline data
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}

# ==============================================================================
# Prometheus Configuration
# ==============================================================================
prometheus:
  enabled: true

  # Override Prometheus chart values
  server:
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s

    retention: 30d

    persistentVolume:
      enabled: true
      size: 50Gi

    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi

    service:
      type: ClusterIP
      servicePort: 9090

  # AlertManager
  alertmanager:
    enabled: true

    persistentVolume:
      enabled: true
      size: 5Gi

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  # Node exporter
  nodeExporter:
    enabled: true

  # Pushgateway
  pushgateway:
    enabled: false

  # Additional scrape configs
  extraScrapeConfigs: |
    - job_name: 'vision-metrics-server'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - {{ .Release.Namespace }}
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          regex: vision-metrics
          action: keep
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          regex: true
          action: keep
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          regex: (.+)
          target_label: __metrics_path__
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__

# ==============================================================================
# Grafana Configuration
# ==============================================================================
grafana:
  enabled: true

  # Admin credentials
  adminUser: admin
  adminPassword: changeme

  # Persistence
  persistence:
    enabled: true
    size: 5Gi

  # Resources
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # Service
  service:
    type: ClusterIP
    port: 3000

  # Ingress
  ingress:
    enabled: false
    ingressClassName: nginx
    hosts:
      - grafana.example.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.example.com

  # Data sources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://{{ .Release.Name }}-prometheus-server:9090
          access: proxy
          isDefault: true
          editable: true

  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'vision'
          orgId: 1
          folder: 'Vision'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/vision

  # Dashboards (loaded from ConfigMaps)
  dashboards:
    vision:
      execution-overview:
        file: dashboards/execution_overview.json

  # Grafana configuration
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false

# ==============================================================================
# PostgreSQL Configuration (Optional)
# ==============================================================================
postgresql:
  enabled: false

  auth:
    username: vision
    password: vision_password
    database: vision

  primary:
    persistence:
      enabled: true
      size: 20Gi

    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 1Gi

# ==============================================================================
# Redis Configuration (Optional)
# ==============================================================================
redis:
  enabled: false

  auth:
    enabled: true
    password: redis_password

  master:
    persistence:
      enabled: true
      size: 5Gi

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

# ==============================================================================
# ServiceMonitor (Prometheus Operator)
# ==============================================================================
serviceMonitor:
  enabled: true

  # Scrape interval
  interval: 15s

  # Scrape timeout
  scrapeTimeout: 10s

  # Additional labels
  additionalLabels:
    prometheus: kube-prometheus

  # Metric relabelings
  metricRelabelings: []

  # Relabelings
  relabelings: []

# ==============================================================================
# PrometheusRule (Alert Rules)
# ==============================================================================
prometheusRule:
  enabled: true

  # Additional labels
  additionalLabels:
    prometheus: kube-prometheus

  # Alert rules (loaded from files)
  groups: []

# ==============================================================================
# Pod Disruption Budget
# ==============================================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ==============================================================================
# Network Policy
# ==============================================================================
networkPolicy:
  enabled: false

  # Ingress rules
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8080

# ==============================================================================
# Pod Security Policy
# ==============================================================================
podSecurityPolicy:
  enabled: false

# ==============================================================================
# RBAC
# ==============================================================================
rbac:
  create: true

  # Service account
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# ==============================================================================
# Security Context
# ==============================================================================
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ==============================================================================
# ConfigMaps and Secrets
# ==============================================================================
configMaps:
  # Additional config maps to create
  create: true

secrets:
  # Additional secrets to create
  create: true

# ==============================================================================
# Additional Configuration
# ==============================================================================
# Extra labels to add to all resources
commonLabels: {}

# Extra annotations to add to all resources
commonAnnotations: {}

# Priority class name
priorityClassName: ""

# DNS configuration
dnsPolicy: ClusterFirst
dnsConfig: {}

# Host aliases
hostAliases: []
