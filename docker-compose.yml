# =============================================================================
# FKS — Development Environment
# Janus (Rust) trading platform
#
# Architecture:
#   janus     — Rust trading brain; native data ingestion + burn ML
#               (base/rust/Dockerfile target: workspace)
#   webui     — SvelteKit frontend (src/web/Dockerfile)
#   spawner   — Rust bot-container lifecycle service
#
# NOTE: the Python "Ruby" data/engine/trainer services were removed — janus is
# the platform now. See docs/architecture/RUST_MIGRATION.md. The only Ruby
# remnant is the ruby_db Postgres database, retained (name + schema) for the
# Bot Spawner's bot_configs/bot_runs tables (src/sql/spawner/).
#
# Postgres: two logical databases on one instance
#   - janus_db       — Janus schema (signals, regime, backtest tables)
#   - ruby_db        — Spawner schema (bot_configs, bot_runs) — legacy name
#   - Single FKS redis (custom image with kernel tuning), three DBs:
#       db 0 — janus_db + ruby (shared trading state)
#   - Single RUSTCODE redis  (Alpine, for caching)
#   - Single prometheus + grafana
#   - Trainer          GPU service
#
# Usage:
#   docker compose up -d                          # all core services
#   docker compose --profile training up -d       # + GPU trainer
#   docker compose logs -f [service]
#
# Port map (host):
# ⚠️  All ports bound to 127.0.0.1 — only reachable via localhost / tailscale serve
#
#   ── Trading Platform ──────────────────────────────────────────────────────
#   80         nginx reverse proxy
#   5432       postgres (janus_db + ruby_db)
#   6379       redis (shared — janus / ruby pub-sub + state)
#   7000       janus HTTP API
#   8200       trainer
#   8812       questdb postgres wire
#   9000       questdb HTTP console
#   9009       questdb ILP ingestion
#   9051       janus gRPC
#   9090       prometheus
#   9092       janus unified /metrics (container :9090 — brain/signals/optimizer)
#   9093       alertmanager
#   9100       node-exporter (host disk/CPU/mem — backs HostDiskSpace* alerts)
#   3001       webui (SvelteKit frontend)
#   3000       grafana (served at /grafana/ subpath via nginx)
#   3100       loki
#   6333       qdrant REST
#   6334       qdrant gRPC
#   9187       postgres-exporter
#   9121       redis-exporter
#   9191       questdb-exporter
#   16686      jaeger UI
#
#   ── Evaluation Tools ─────────────────────────────────────────────────────
# =============================================================================
services:
    # ===========================================================================
    # INFRASTRUCTURE — shared data stores
    # ===========================================================================

    postgres:
        build:
            context: .
            dockerfile: infrastructure/docker/services/postgres/Dockerfile
        image: nuniesmith/fks:postgres
        container_name: fks_postgres
        user: "postgres"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
        environment:
            # The image's initdb creates POSTGRES_DB as the first database and
            # runs the init scripts connected to it. src/sql/janus/001_init.sql
            # does `\connect :janus_db` (= POSTGRES_DB), so this MUST name
            # janus_db — without it a FRESH volume created only `postgres` and
            # 001 died with "database janus_db does not exist", aborting the
            # whole bootstrap. (Ignored on a non-empty volume, so safe live.)
            - POSTGRES_DB=${JANUS_DB:-janus_db}
            - JANUS_DB=${JANUS_DB:-janus_db}
            - POSTGRES_USER=${POSTGRES_USER:-fks_user}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
            - RUBY_DB=${RUBY_DB:-ruby_db}
            # Password for the scoped fks_backtest role (32-backtest-role.sql,
            # consumed via psql \getenv). Empty = role is created without a
            # usable password (fails closed); re-apply the script to set it.
            - BACKTEST_DB_PASSWORD=${BACKTEST_DB_PASSWORD:-}
            # Password for the scoped fks_webui role (33-webui-auth.sql, consumed
            # via psql \getenv). Same fail-closed contract as fks_backtest: empty
            # = role created but not loggable-into; re-apply the script to set/
            # rotate it. Must equal the webui's WEBUI_DATABASE_URL password.
            - WEBUI_DB_PASSWORD=${WEBUI_DB_PASSWORD:-}
            - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        tmpfs:
            - /tmp
            - /run/postgresql
        networks:
            - fks-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-fks_user} -d ${JANUS_DB:-janus_db}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "2.0"
                    memory: 2g
                reservations:
                    cpus: "0.5"
                    memory: 512m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=postgres,environment=dev"

    redis:
        build:
            context: .
            dockerfile: infrastructure/docker/services/redis/Dockerfile
            target: production
        image: nuniesmith/fks:redis
        container_name: fks_redis
        user: "999:1000"
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        environment:
            - REDIS_REPLICATION_MODE=master
            - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis_data:/data
        tmpfs:
            - /tmp
            - /var/run
        networks:
            - fks-network
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - "900 1"
            - --save
            - "300 10"
            - --save
            - "60 10000"
            - --maxmemory
            - "512mb"
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 5s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 512m
                reservations:
                    cpus: "0.25"
                    memory: 128m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=redis,environment=dev"

    questdb:
        # ⚠️  HTTP console (9000) and ILP (9009) are unauthenticated by default.
        #    Restrict via nginx in production — do not expose to public internet.
        # Config is baked into the image via infrastructure/docker/services/questdb/Dockerfile.
        # Rebuild with: docker compose build questdb
        build:
            context: .
            dockerfile: infrastructure/docker/services/questdb/Dockerfile
        image: nuniesmith/fks:questdb
        container_name: fks_questdb
        security_opt:
            - no-new-privileges:true
        environment:
            - QDB_TELEMETRY_ENABLED=false
            - QDB_LOG_W_STDOUT_LEVEL=INFO
            - QDB_PG_ENABLED=true
            - QDB_HTTP_ENABLED=true
            - QDB_HTTP_SECURITY_ENABLED=${QDB_HTTP_SECURITY_ENABLED:-false}
            - QDB_LINE_TCP_ENABLED=true
            - QDB_SHARED_WORKER_COUNT=2
            - QDB_CAIRO_COMMIT_LAG=10000
            - QDB_METRICS_ENABLED=true
            - QDB_PG_USER=${QUESTDB_PG_USER:-admin}
            - QDB_PG_PASSWORD=${QUESTDB_PG_PASSWORD:?QUESTDB_PG_PASSWORD is required (no default — set in .env)}
        ports:
            - "127.0.0.1:9000:9000" # HTTP console
            - "127.0.0.1:9009:9009" # ILP ingestion
            - "127.0.0.1:8812:8812" # PostgreSQL wire
            - "127.0.0.1:9003:9003" # Prometheus metrics
        volumes:
            - questdb_data:/var/lib/questdb
        # NOTE: do NOT tmpfs /tmp here. Docker tmpfs mounts default to `noexec`,
        # but QuestDB extracts its native libquestdb*.so to java.io.tmpdir (/tmp)
        # and mmaps it with PROT_EXEC at boot. A noexec /tmp makes that fail with
        # "UnsatisfiedLinkError: ... failed to map segment from shared object" and
        # the container crash-loops. The container's overlay /tmp is exec-able.
        networks:
            - fks-network
        restart: unless-stopped
        # The QuestDB image ships no curl/wget (and dash has no /dev/tcp), so an
        # HTTP probe can't run inside the container — `curl` here failed with
        # "curl: not found" forever, marking questdb unhealthy even though it was
        # serving fine. Instead, check that the min HTTP server (health + metrics)
        # is listening on :9003 via /proc/net/tcp (9003 == 0x232B). It only binds
        # once QuestDB is fully started, so it's a valid readiness signal, and it
        # needs nothing but grep. Requires http.min.enabled=true (see server.conf).
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "grep -q ':232B' /proc/net/tcp /proc/net/tcp6 2>/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 8s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "2.0"
                    memory: 2g
                reservations:
                    cpus: "0.5"
                    memory: 512m
        logging:
            driver: "json-file"
            options:
                max-size: "20m"
                max-file: "3"
                labels: "service=questdb,environment=dev"

    qdrant:
        # Planned use: embedding storage for semantic regime analysis and journal search.
        # Config is baked into the image via infrastructure/docker/services/qdrant/Dockerfile.
        # Rebuild with: docker compose build qdrant
        build:
            context: .
            dockerfile: infrastructure/docker/services/qdrant/Dockerfile
        image: nuniesmith/fks:qdrant
        container_name: fks_qdrant
        #profiles: ["qdrant"]
        security_opt:
            - no-new-privileges:true
        ports:
            - "127.0.0.1:6333:6333" # REST
            - "127.0.0.1:6334:6334" # gRPC
        volumes:
            - qdrant_data:/qdrant/storage
        tmpfs:
            - /tmp
        networks:
            - fks-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1g
                reservations:
                    cpus: "0.25"
                    memory: 256m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=qdrant,environment=dev"

    # ===========================================================================
    # JANUS — Rust trading brain
    # ===========================================================================

    janus:
        build:
            context: .
            dockerfile: infrastructure/docker/base/rust/Dockerfile
            target: workspace
            args:
                SERVICE_NAME: janus
                RUST_VERSION: "1.94.1"
                # Janus has no in-tree copy — always clone (override REF for a branch/tag).
                REPO_URL: ${JANUS_REPO:-https://github.com/nuniesmith/janus}
                REPO_REF: ${JANUS_REF:-main}
                # Clone-layer cache bust — run.sh resolves the remote head sha
                # per build; unset = legacy (cache may reuse a stale clone).
                REPO_COMMIT: ${JANUS_COMMIT:-}
        image: nuniesmith/fks:janus
        container_name: fks_janus
        user: "1000:1000"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        environment:
            - EXECUTION_MODE=${EXECUTION_MODE:-paper_trading}
            - QUESTDB_ILP_PORT=9009
            # Where the backfill disk-gate stats free space (the read-only
            # questdb_data mount above). Re-enables the gate instead of fail-open.
            - JANUS_QUESTDB_DATA_DIR=${JANUS_QUESTDB_DATA_DIR:-/var/lib/questdb}
            - DATA_SOURCE=${DATA_SOURCE:-live}
            - DATA_EXCHANGE=${DATA_EXCHANGE:-binance}
            - DATA_WS_URL=${DATA_WS_URL:-wss://stream.binance.com:9443/ws}
            - DATA_KLINE_INTERVALS=${DATA_KLINE_INTERVALS:-1m,5m}
            - DATA_RECONNECT_DELAY_SECS=${DATA_RECONNECT_DELAY_SECS:-5}
            - DATA_MAX_RECONNECT_ATTEMPTS=${DATA_MAX_RECONNECT_ATTEMPTS:-50}
            - DATA_HEALTH_POLL_SECS=${DATA_HEALTH_POLL_SECS:-10}
            # Closed klines → QuestDB candles_crypto (WebUI chart history).
            # Default on; off-switch for stacks that run the standalone
            # data-factory writer instead (avoid double-writing).
            - DATA_PERSIST_CANDLES=${DATA_PERSIST_CANDLES:-true}
            - ENABLE_BRAIN_RUNTIME=${ENABLE_BRAIN_RUNTIME:-true}
            # Start processing services (ingestion/forward/backward) on boot;
            # otherwise janus idles in STANDBY until POST /api/services/start.
            # Read by bin/janus/src/main.rs. (Was documented in .env.example but
            # never forwarded here — setting it in .env previously did nothing.)
            - JANUS_AUTO_START=${JANUS_AUTO_START:-false}
            - BRAIN_WIRE_KILL_SWITCH=${BRAIN_WIRE_KILL_SWITCH:-false}
            - BRAIN_AUTO_START_WATCHDOG=${BRAIN_AUTO_START_WATCHDOG:-true}
            - BRAIN_HEARTBEAT_MS=${BRAIN_HEARTBEAT_MS:-5000}
            - BRAIN_WATCHDOG_CHECK_INTERVAL_MS=${BRAIN_WATCHDOG_CHECK_INTERVAL_MS:-5000}
            - BRAIN_WATCHDOG_DEAD_THRESHOLD=${BRAIN_WATCHDOG_DEAD_THRESHOLD:-10}
            # DEPRECATED / no-op: janus no longer reads BRAIN_API_TOKEN. The
            # brain kill-switch and affinity-reset endpoints are POSTs, so they
            # are now gated by JANUS_API_TOKEN (below) via the single janus-auth
            # layer. The old separate BRAIN_API_TOKEN layer was retired because
            # two independently-keyed layers could not both be satisfied by one
            # Authorization header and could lock out the kill-switch. Left here
            # only so a stale value in an existing .env is harmless; you may
            # remove it. Use JANUS_API_TOKEN instead.
            - BRAIN_API_TOKEN=${BRAIN_API_TOKEN:-}
            # Bearer token required on ALL mutating (non-GET) routes of both
            # janus HTTP surfaces — the forward REST server (risk-config PUT,
            # portfolio POST/DELETE, signal generation, brain kill-switch) and
            # the janus-api gateway (services start/stop, /api/config PUT,
            # signals/publish, log-level, positions ingress). GET/HEAD/OPTIONS
            # (health, metrics, all reads, WS) stay open — the tailnet read
            # posture is deliberate.
            #
            # FAIL POSTURE: empty/unset default = FAIL-CLOSED. With no token,
            # janus DENIES every mutating request (503) and logs a startup
            # warning; reads are unaffected. Set JANUS_API_TOKEN in .env to a
            # strong random value to enable writes. The in-stack caller that
            # needs it — the webui, which proxies the risk-config and optimizer
            # PUTs — receives the SAME token below. This is the ONE janus write
            # token: it also gates the brain kill-switch / affinity routes, so
            # the deprecated BRAIN_API_TOKEN above is no longer needed.
            #
            # NOTE: the paper-trading deploy script's POST /api/services/start
            # calls (and the mid-run standby auto-restart) forward this token, so
            # setting it does not leave janus stuck in STANDBY on (re)deploy.
            - JANUS_API_TOKEN=${JANUS_API_TOKEN:-}
            - RUST_LOG=info,janus=debug,sqlx=debug,janus_backward=debug
            - RUST_BACKTRACE=1
            - JANUS_CONFIG_PATH=/app/config/janus.toml
            - JANUS_ENABLE_BACKWARD=${JANUS_ENABLE_BACKWARD:-true}
            - ENABLE_EXECUTION=${ENABLE_EXECUTION:-false}
            # Portfolio risk enforcement (janus forward). Defaults ON: a
            # RiskManager rejection blocks the order submit. Set to 0 only to
            # make risk checks advisory (not recommended with live execution).
            - JANUS_RISK_ENFORCE=${JANUS_RISK_ENFORCE:-1}
            - EXECUTION_ENDPOINT=${EXECUTION_ENDPOINT:-http://janus-execution:50052}
            - EXECUTION_CONNECT_TIMEOUT=${EXECUTION_CONNECT_TIMEOUT:-10}
            - EXECUTION_REQUEST_TIMEOUT=${EXECUTION_REQUEST_TIMEOUT:-30}
            - EXECUTION_MAX_RETRIES=${EXECUTION_MAX_RETRIES:-3}
            - EXECUTION_RETRY_BACKOFF_MS=${EXECUTION_RETRY_BACKOFF_MS:-100}
            - EXECUTION_DEFAULT_QUANTITY=${EXECUTION_DEFAULT_QUANTITY:-0.001}
            - EXECUTION_EXCHANGE=${EXECUTION_EXCHANGE:-kraken}
            - ALERTMANAGER_URL=${ALERTMANAGER_URL:-http://fks_alertmanager:9093}
            - EXEC_ACCOUNT_TYPE=${EXEC_ACCOUNT_TYPE:-paper}
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_USER=${POSTGRES_USER:-fks_user}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
            - JANUS_DB=${JANUS_DB:-janus_db}
            - DATABASE_URL=postgresql://${POSTGRES_USER:-fks_user}:${POSTGRES_PASSWORD}@postgres:5432/${JANUS_DB:-janus_db}?sslmode=disable
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
            - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
            # ── Experience pipeline (janus docs/architecture/EXPERIENCE_PIPELINE.md) ──
            # forward records per-candle decisions → Arrow IPC spool on /dev/shm
            # → backward ingests into Qdrant. Default OFF (same default-off
            # discipline as JANUS_RISK_ENFORCE / ENABLE_EXECUTION).
            - JANUS_EXPERIENCE_ENABLED=${JANUS_EXPERIENCE_ENABLED:-false}
            # Spool lives on this container's /dev/shm tmpfs (sized via
            # shm_size below). Forward (writer) and backward (ingester) both
            # run inside THIS one container (unified bin/janus binary), so no
            # cross-container tmpfs mount is needed.
            - JANUS_EXPERIENCE_SPOOL_DIR=${JANUS_EXPERIENCE_SPOOL_DIR:-/dev/shm/janus/experience}
            - JANUS_EXPERIENCE_BATCH_ROWS=${JANUS_EXPERIENCE_BATCH_ROWS:-256}
            - JANUS_EXPERIENCE_FLUSH_SECS=${JANUS_EXPERIENCE_FLUSH_SECS:-60}
            - JANUS_EXPERIENCE_SPOOL_MAX_MB=${JANUS_EXPERIENCE_SPOOL_MAX_MB:-256}
            # Phase 2.5 reward scheme (writer-side): multi-bar, fee-aware,
            # volatility-normalized holding return. Defaults turn it ON in code;
            # listed here so operators can tune per venue (janus #145).
            - JANUS_EXPERIENCE_REWARD_HORIZON=${JANUS_EXPERIENCE_REWARD_HORIZON:-5}
            - JANUS_EXPERIENCE_REWARD_FEE_BPS=${JANUS_EXPERIENCE_REWARD_FEE_BPS:-0}
            - JANUS_EXPERIENCE_REWARD_VOL_NORM=${JANUS_EXPERIENCE_REWARD_VOL_NORM:-true}
            - JANUS_EXPERIENCE_REWARD_VOL_FLOOR=${JANUS_EXPERIENCE_REWARD_VOL_FLOOR:-0.0001}
            # 9-gate ExecutionGate controls. Without these passthroughs the vars
            # set in .env would silently never reach the container (janus parses
            # strictly: only "1"/"true" enables — 0 keeps today's behavior).
            # JANUS_GATE_METRICS_REDIS=1 turns on the gate-counter Redis exporter
            # (needed for the Gate-A block-mix soak log, GATE_A_PREREGISTRATION
            # §4a-J3; also persists the consecutive-loss breaker across restarts).
            # JANUS_GATE_ENFORCE stays 0 until the Gate-A verdict + the §4a
            # enforce-flip prerequisite (blocked-vs-actionable separation) pass —
            # never flip it before Gate-A day.
            - JANUS_GATE_METRICS_REDIS=${JANUS_GATE_METRICS_REDIS:-0}
            - JANUS_GATE_ENFORCE=${JANUS_GATE_ENFORCE:-0}
            # Phase 2 training: fill the replay buffer from live Qdrant
            # experiences (janus #144). Default OFF; flip in .env to train janus
            # on its own decisions using the Phase 2.5 reward.
            - JANUS_TRAIN_FROM_QDRANT=${JANUS_TRAIN_FROM_QDRANT:-false}
            # Challenger training scheduler (janus #146). Default OFF — a redeploy
            # is a no-op until enabled. When true, periodic multi-step sessions
            # train into the CHALLENGER dir only (never the live champion
            # latest_model.bin) with NO checkpoint notifier. Promotion is manual.
            - JANUS_TRAIN_SCHEDULE_ENABLED=${JANUS_TRAIN_SCHEDULE_ENABLED:-false}
            - JANUS_TRAIN_INTERVAL_SECS=${JANUS_TRAIN_INTERVAL_SECS:-900}
            - JANUS_TRAIN_STEPS_PER_SESSION=${JANUS_TRAIN_STEPS_PER_SESSION:-200}
            - JANUS_TRAIN_CHALLENGER_DIR=${JANUS_TRAIN_CHALLENGER_DIR:-checkpoints/backward/challenger}
            # Qdrant vector store for ingested experiences — the `qdrant`
            # service above (container fks_qdrant, gRPC 6334). USE_MOCK=false:
            # if Qdrant is unreachable, ingest batches stay parked in the spool
            # instead of "persisting" to an in-memory mock that dies on restart.
            - QDRANT_URL=${QDRANT_URL:-http://fks_qdrant:6334}
            - QDRANT_USE_MOCK=${QDRANT_USE_MOCK:-false}
            - OPTIMIZER_ENABLED=${OPTIMIZER_ENABLED:-true}
            - DATA_DIR=/app/data
            - OPTIMIZER_DATA_DIR=/app/data
            - OPTIMIZER_METRICS_PORT=9092
            - OPTIMIZE_INTERVAL=${OPTIMIZE_INTERVAL:-6h}
            - OPTIMIZE_ASSETS=${OPTIMIZE_ASSETS:-BTC,ETH,SOL}
            - OPTIMIZE_TRIALS=${OPTIMIZE_TRIALS:-100}
            - OPTIMIZE_HISTORICAL_DAYS=${OPTIMIZE_HISTORICAL_DAYS:-30}
            - OPTIMIZER_INSTANCE_ID=${OPTIMIZER_INSTANCE_ID:-janus-prod}
            # The Python "Ruby" data service was removed — janus ingests market
            # data natively (DATA_SOURCE/DATA_EXCHANGE/DATA_WS_URL above). The old
            # PYTHON_DATA_SERVICE_URL + DATA_CLIENT_* fallback wiring is gone;
            # see docs/architecture/RUST_MIGRATION.md (Phase 1 cut-over).
        ports:
            - "127.0.0.1:9051:50051" # gRPC inference
            - "127.0.0.1:7000:8080" # HTTP API (main janus_api)
            - "127.0.0.1:7001:8180" # Forward REST API (brain health, affinity endpoints)
            - "127.0.0.1:7002:50052" # PositionFeedback gRPC
            - "127.0.0.1:9092:9090" # Unified /metrics (brain+signals+optimizer live on container :9090; Prometheus scrapes janus:9090)
        # /dev/shm sizing: Docker's default shm is 64 MB, but the experience
        # spool lives there and its cap (JANUS_EXPERIENCE_SPOOL_MAX_MB) defaults
        # to 256 MB — size the tmpfs comfortably above the cap so the writer's
        # drop-oldest bound, not ENOSPC, is what limits the spool.
        shm_size: "512m"
        tmpfs:
            - /tmp
            - /var/tmp
        volumes:
            - optimizer_data:/app/data
            # Persist model checkpoints (champion + challenger) across container
            # recreates — otherwise a `docker compose up` wipes /app/checkpoints,
            # resetting the challenger to fresh-init on every janus redeploy
            # (defeating resume-from-checkpoint accumulation; janus #150/#152).
            - janus_checkpoints:/app/checkpoints
            # Read-only view of QuestDB's data volume so the backfill disk-gate
            # can stat free space (janus + questdb are separate containers; without
            # it the gate fails OPEN and backfills proceed ungated). Paired with
            # JANUS_QUESTDB_DATA_DIR below.
            - questdb_data:/var/lib/questdb:ro
            - ./infrastructure/config/janus:/app/config:ro
        networks:
            - fks-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            questdb:
                condition: service_healthy
            qdrant:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "4.0"
                    memory: 4g
                reservations:
                    cpus: "1.0"
                    memory: 1g
        logging:
            driver: "json-file"
            options:
                max-size: "20m"
                max-file: "5"
                labels: "service=janus,environment=dev"

    webui:
        image: nuniesmith/fks:webui
        build:
            context: .
            dockerfile: infrastructure/docker/base/nodejs/Dockerfile
            args:
                APP_SRC: src/web
                # Default to cloning the standalone fks-web repo (same pattern as
                # janus's JANUS_REPO). The in-tree src/web copy is only used when
                # WEB_REPO is overridden to empty (dev convenience).
                REPO_URL: ${WEB_REPO:-https://github.com/nuniesmith/fks-web}
                REPO_REF: ${WEB_REF:-main}
                # Clone-layer cache bust (see the janus service note).
                REPO_COMMIT: ${WEB_COMMIT:-}
        container_name: fks_webui
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # host-gateway makes host.docker.internal resolve on Linux — needed for
        # the transitional CRYPTO_*_INTERNAL_URL bridge to the systemd bots.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "127.0.0.1:3001:3000"
        environment:
            - NODE_ENV=production
            # The Ruby data API was removed; point the dashboard's API base at
            # janus. The SvelteKit app still needs a janus-native data contract —
            # tracked in docs/architecture/RUST_MIGRATION.md (WebUI repoint).
            - PUBLIC_API_URL=${PUBLIC_API_URL:-http://fks_janus:7000}
            # Crypto bot status servers for the /exchanges page. Empty default
            # = the adapter falls back to the Phase-2 container DNS names
            # (http://fks-bot-crypto-*:9091). During the transitional systemd
            # phase set these in .env to the host bridge, e.g.
            #   CRYPTO_SPOT_INTERNAL_URL=http://host.docker.internal:9091
            #   CRYPTO_FUNDING_INTERNAL_URL=http://host.docker.internal:9095
            # (funding uses 9095 on the host — 9092/9093 are taken by the
            # janus metrics remap and alertmanager).
            - CRYPTO_SPOT_INTERNAL_URL=${CRYPTO_SPOT_INTERNAL_URL:-}
            - CRYPTO_FUNDING_INTERNAL_URL=${CRYPTO_FUNDING_INTERNAL_URL:-}
            # LIVE funding twin /status for the cockpit's live unrealized feed
            # (fks-web /api/cockpit/live-status). Deliberately EMPTY default —
            # "not configured" is the honest state until Gate-A arms a live
            # twin. Never point this at the paper container: the webui flags a
            # non-live BotStatus.mode as a red mismatch, but the guard exists
            # precisely because that mistake would render paper PnL as live.
            - CRYPTO_FUNDING_LIVE_INTERNAL_URL=${CRYPTO_FUNDING_LIVE_INTERNAL_URL:-}
            - PUBLIC_JANUS_URL=http://fks_janus:7000
            # Bearer token the SvelteKit server attaches to its mutating janus
            # proxy calls (the /settings risk-config PUT → forward, and the
            # "Janus Optimizer" /api/config PUT → janus-api). MUST equal the
            # janus service's JANUS_API_TOKEN above, or those two settings
            # panels get 401 once the token is set. Empty default = the panels
            # keep working only while janus is also unset (fail-closed) — set
            # both together in .env. Never sent to the browser (server-side only).
            - JANUS_API_TOKEN=${JANUS_API_TOKEN:-}
            # D1 live-bars bridge: empty (default) keeps /sse/bars/:sym on the
            # graceful idle stub. Once the janus image includes the
            # /sse/bars/{symbol} endpoint (janus PR #106), set in .env:
            #   JANUS_BARS_SSE_URL=http://fks_janus:8080/sse/bars
            - JANUS_BARS_SSE_URL=${JANUS_BARS_SSE_URL:-}
            # ── Phase-1 auth (fks-web #47) companion wiring ──────────────────
            # Auth store: the scoped fks_webui LOGIN role (010_webui_auth.sql),
            # NOT the spawner's fks_user. WEBUI_DB_PASSWORD must match the value
            # the postgres service applied to the role (fails closed if unset:
            # the webui 503s until schema+role+password exist). In-container DNS
            # host is fks_postgres:5432, database ruby_db (RUBY_DB).
            - WEBUI_DATABASE_URL=postgres://fks_webui:${WEBUI_DB_PASSWORD:-}@fks_postgres:5432/${RUBY_DB:-ruby_db}
            # Service-identity token the adapter re-mints on its spawner-bound
            # calls (secrets/notifications/capabilities + the /bots page). MUST
            # equal the spawner's NGINX_INTERNAL_TOKEN or every spawner call 401s
            # once #47's strip-set lands (auth-chain H5). Never sent to janus /
            # the browser (server-side only).
            - INTERNAL_TOKEN=${NGINX_INTERNAL_TOKEN:-}
            # CSRF origin (M1/M7): SvelteKit's built-in form-action origin check
            # rejects the login POST as "cross-site" unless the app origin it
            # computes equals the browser's Origin header. The browser always
            # loads the tailnet host over HTTPS (tailscale terminates TLS), so
            # the app origin MUST resolve to https://<tailnet-host>.
            #   • HOST_HEADER=host → adapter-node takes the host from nginx's
            #     forwarded Host header ($host = the tailnet hostname, conf:109),
            #     not the internal container name.
            #   • PROTOCOL_HEADER is deliberately LEFT UNSET. nginx is HTTP-only
            #     behind tailscale (listen 80; health body reports "ssl":"off"),
            #     so it stamps `X-Forwarded-Proto $scheme` = "http" on EVERY
            #     webui location (conf:112 for the /login page route). Wiring
            #     PROTOCOL_HEADER=x-forwarded-proto would feed that "http" into
            #     adapter-node's get_origin() → app origin http://<host>, which
            #     mismatches the browser's https://<host> → 403 "Cross-site POST
            #     form submissions are forbidden": login is bricked on the real
            #     access path. With PROTOCOL_HEADER unset, get_origin() defaults
            #     the scheme to "https" (adapter-node handler.js), i.e. the true
            #     external scheme. Do NOT set ORIGIN either — adapter-node ignores
            #     HOST_HEADER once ORIGIN is pinned, re-creating the localhost bug.
            #   Regression guard: scripts/testing/verify_webui_csrf_origin.py.
            - HOST_HEADER=host
            # Real client IP (M8): behind nginx getClientAddress() would otherwise
            # be the nginx container IP for every device — collapsing the per-IP
            # login limiter to one global bucket and blinding the audit log. nginx
            # sets X-Real-IP (conf:322); trust it for the true client address.
            - ADDRESS_HEADER=X-Real-IP
        networks:
            - fks-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "const h=require('http');h.get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "0.5"

    # Build-utility image: generic GPU-enabled Rust base (CUDA runtime).
    # Used as a builder template for any Rust service that requires GPU at runtime.
    # Usage: docker compose --profile base build rust-gpu-base
    rust-gpu-base:
        image: nuniesmith/fks:rust-gpu-base
        build:
            context: .
            dockerfile: infrastructure/docker/base/rust-gpu/Dockerfile
            args:
                SERVICE_NAME: app
                SERVICE_PORT: "8080"
        profiles: ["base"]

    # ===========================================================================
    # PROXY
    # ===========================================================================

    # Static MkDocs site (mkdocs.yml + docs/) — nginx proxies /docs-viewer/
    # here; the WebUI /docs tab embeds it. Internal-only (no host port).
    docs:
        build:
            context: .
            dockerfile: infrastructure/docker/services/docs/Dockerfile
        image: nuniesmith/fks:docs
        container_name: fks_docs
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
            - CHOWN
            - SETGID
            - SETUID
        networks:
            - fks-network

    nginx:
        build:
            context: .
            dockerfile: infrastructure/docker/services/nginx/Dockerfile
            target: production
        image: nuniesmith/fks:nginx
        container_name: fks_nginx
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
        ports:
            - "127.0.0.1:80:80"
        environment:
            - API_KEY=${API_KEY:-}
            - NGINX_INTERNAL_TOKEN=${NGINX_INTERNAL_TOKEN:-}
        volumes:
            - /dev/null:/etc/nginx/conf.d/default.conf:ro
        networks:
            - fks-network
        depends_on:
            janus:
                condition: service_started
            grafana:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1",
                ]
            interval: 30s
            timeout: 5s
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512m
        logging:
            driver: "json-file"
            options:
                max-size: "20m"
                max-file: "5"
                labels: "service=nginx,environment=dev"

    # ===========================================================================
    # MONITORING
    # ===========================================================================

    prometheus:
        build:
            context: .
            dockerfile: infrastructure/docker/services/prometheus/Dockerfile
        image: nuniesmith/fks:prometheus
        container_name: fks_prometheus
        user: "nobody"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # host-gateway makes host.docker.internal resolve on Linux — needed by
        # the fks-bots-transitional scrape job (systemd crypto bots on the host).
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "127.0.0.1:9090:9090"
        volumes:
            - prometheus_data:/prometheus
            - prometheus_sd:/etc/prometheus/sd
        tmpfs:
            - /tmp
        networks:
            - fks-network
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
            - "--web.enable-lifecycle"
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1g
                reservations:
                    cpus: "0.25"
                    memory: 256m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=prometheus,environment=dev"

    grafana:
        build:
            context: .
            dockerfile: infrastructure/docker/services/grafana/Dockerfile
        image: nuniesmith/fks:grafana
        container_name: fks_grafana
        user: "472"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD required}
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
            - GF_SERVER_SERVE_FROM_SUB_PATH=true
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
            - GF_SECURITY_ALLOW_EMBEDDING=true
        ports:
            - "127.0.0.1:3000:3000"
        volumes:
            - grafana_data:/var/lib/grafana
            - ./infrastructure/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
        tmpfs:
            - /tmp
        networks:
            - fks-network
        depends_on:
            prometheus:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512m
                reservations:
                    cpus: "0.1"
                    memory: 128m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=grafana,environment=dev"

    loki:
        # Config baked into image via infrastructure/docker/services/loki/Dockerfile.
        # Source: infrastructure/config/loki/loki.yaml
        # Rebuild with: docker compose build loki
        build:
            context: .
            dockerfile: infrastructure/docker/services/loki/Dockerfile
        image: nuniesmith/fks:loki
        container_name: fks_loki
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        volumes:
            - loki_data:/loki
        ports:
            - "127.0.0.1:3100:3100"
        networks:
            - fks-network
        restart: unless-stopped
        # Path matches what the Dockerfile bakes the config to
        command: -config.file=/etc/loki/loki.yaml
        healthcheck:
            disable: true
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512m
                reservations:
                    cpus: "0.1"
                    memory: 256m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=loki,environment=dev"

    promtail:
        build:
            context: .
            dockerfile: infrastructure/docker/services/promtail/Dockerfile
        image: nuniesmith/fks:promtail
        container_name: fks_promtail
        user: "root"
        security_opt:
            - no-new-privileges:true
        volumes:
            - ./infrastructure/config/promtail/promtail.yml:/etc/promtail/config.yml:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/log:/var/log:ro
            - promtail_positions:/positions
        networks:
            - fks-network
        restart: unless-stopped
        command: -config.file=/etc/promtail/config.yml -positions.file=/positions/positions.yaml
        healthcheck:
            disable: true
        depends_on:
            - loki
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 256m
                reservations:
                    cpus: "0.1"
                    memory: 64m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=promtail,environment=dev"

    alertmanager:
        # Config baked into image via infrastructure/docker/services/alertmanager/Dockerfile.
        # Source: infrastructure/config/alertmanager/alertmanager.yml
        # Rebuild with: docker compose build alertmanager
        build:
            context: .
            dockerfile: infrastructure/docker/services/alertmanager/Dockerfile
        image: nuniesmith/fks:alertmanager
        container_name: fks_alertmanager
        user: "nobody"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - TZ=UTC
        ports:
            - "127.0.0.1:9093:9093"
        volumes:
            - alertmanager_data:/alertmanager
        tmpfs:
            - /tmp
        networks:
            - fks-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 256m
                reservations:
                    cpus: "0.1"
                    memory: 64m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=alertmanager,environment=dev"

    alertmanager-discord:
        build:
            context: .
            dockerfile: infrastructure/docker/services/alertmanager-discord/Dockerfile
        image: nuniesmith/fks:alertmanager-discord
        container_name: fks_alertmanager_discord
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - DISCORD_WEBHOOK_GENERAL=${DISCORD_WEBHOOK_GENERAL:-}
            - DISCORD_WEBHOOK_SIGNALS=${DISCORD_WEBHOOK_SIGNALS:-}
            - DISCORD_WEBHOOK_ANALYSIS=${DISCORD_WEBHOOK_ANALYSIS:-}
            - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
            - BRIDGE_PORT=9094
            - BRIDGE_HOST=0.0.0.0
            - LOG_LEVEL=INFO
        networks:
            - fks-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:9094/health')",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 128m
                reservations:
                    cpus: "0.05"
                    memory: 32m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=alertmanager-discord,environment=dev"

    jaeger:
        # Config (sampling.json) baked into image via infrastructure/docker/services/jaeger/Dockerfile.
        # Source: infrastructure/config/jaeger/sampling.json
        # Rebuild with: docker compose build jaeger
        build:
            context: .
            dockerfile: infrastructure/docker/services/jaeger/Dockerfile
        image: nuniesmith/fks:jaeger
        container_name: fks_jaeger
        security_opt:
            - no-new-privileges:true
        environment:
            - COLLECTOR_ZIPKIN_HOST_PORT=:9411
            - COLLECTOR_OTLP_ENABLED=true
            - SPAN_STORAGE_TYPE=memory
        ports:
            - "127.0.0.1:16686:16686" # Web UI
            - "127.0.0.1:14268:14268" # HTTP collector
            - "127.0.0.1:14250:14250" # gRPC collector
            - "127.0.0.1:6831:6831/udp" # Jaeger compact
            - "127.0.0.1:9411:9411" # Zipkin
        tmpfs:
            - /tmp
        networks:
            - fks-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://localhost:14269/ || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 512m
                reservations:
                    cpus: "0.1"
                    memory: 128m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=jaeger,environment=dev"

    # ===========================================================================
    # EXPORTERS
    # ===========================================================================

    postgres-exporter:
        # Custom queries baked into image via infrastructure/docker/services/postgres-exporter/Dockerfile.
        # Source: infrastructure/config/postgres-exporter/queries.yaml
        # Rebuild with: docker compose build postgres-exporter
        build:
            context: .
            dockerfile: infrastructure/docker/services/postgres-exporter/Dockerfile
        image: nuniesmith/fks:postgres-exporter
        container_name: fks_postgres_exporter
        user: "65534:65534"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-fks_user}:${POSTGRES_PASSWORD}@postgres:5432/${JANUS_DB:-janus_db}?sslmode=disable
            - PG_EXPORTER_DISABLE_DEFAULT_METRICS=false
            - PG_EXPORTER_DISABLE_SETTINGS_METRICS=false
            - PG_EXPORTER_AUTO_DISCOVER_DATABASES=false
        # Override the image's default CMD (--extend.query-path=queries.yaml). That
        # DEPRECATED custom-queries file redefines pg_stat_user_tables / pg_locks with
        # different help text than the always-on built-in collectors, so /metrics 500s
        # with 100+ "help text collision" errors and the Prometheus `postgres` target
        # goes DOWN. The built-in collectors cover the standard pg_stat_* metrics; this
        # flag is a harmless explicit default that just drops the --extend.query-path.
        command: ["--web.listen-address=:9187"]
        ports:
            - "127.0.0.1:9187:9187"
        networks:
            - fks-network
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            disable: true
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 128m
                reservations:
                    cpus: "0.1"
                    memory: 32m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=postgres-exporter,environment=dev"

    node-exporter:
        # Host-level metrics (disk/CPU/mem). Added 2026-07-01: the
        # HostDiskSpaceCritical/Warning alerts key on node_filesystem_* but no
        # node-exporter was deployed, so the disk-full safety net (which saved
        # the box on 2026-03-26) could never fire. The host rootfs is mounted
        # read-only at /host so mountpoint="/" reports the real host disk.
        image: prom/node-exporter:v1.8.2
        container_name: fks_node_exporter
        user: "65534:65534"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        command:
            - "--path.rootfs=/host"
            - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/.+)($|/)"
        volumes:
            - /:/host:ro,rslave
        ports:
            - "127.0.0.1:9100:9100"
        networks:
            - fks-network
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 128m
                reservations:
                    cpus: "0.05"
                    memory: 32m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=node-exporter,environment=dev"

    deadman:
        # External dead-man's-switch heartbeat. Added 2026-07-17: every alert
        # path on this box (Prometheus → Alertmanager → Discord bridge) dies
        # WITH the box — if oryx loses power, disk, or network, the platform's
        # last act is silence, not a page ("no alerts" and "total outage" are
        # the same signal). This service GETs a hosted dead-man check
        # (healthchecks.io or similar) every 60s; the *check* pages when the
        # heartbeat STOPS. Pure observer: no depends_on, no ports, no volumes
        # beyond its own script — it must never be a reason another service
        # can't start (or vice versa). Silently disabled (container idles)
        # when DEADMAN_PING_URL is unset, so fresh checkouts need no setup.
        # Setup + what a page means: docs/infrastructure/DEADMAN_SWITCH.md
        image: curlimages/curl:8.21.0
        container_name: fks_deadman
        # curl_user — the image's own unprivileged default, pinned explicitly.
        user: "100:101"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        read_only: true
        entrypoint: ["/bin/sh", "/opt/fks/deadman-ping.sh"]
        environment:
            # Full ping URL incl. the check's secret UUID — set in .env. The
            # script never logs it (and discards curl's stderr for the same
            # reason); leave unset to disable the pinger.
            - DEADMAN_PING_URL=${DEADMAN_PING_URL:-}
            - DEADMAN_INTERVAL_SECS=${DEADMAN_INTERVAL_SECS:-60}
        volumes:
            - ./scripts/monitoring/deadman-ping.sh:/opt/fks/deadman-ping.sh:ro
        networks:
            - fks-network
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.10"
                    memory: 32m
                reservations:
                    cpus: "0.01"
                    memory: 8m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=deadman,environment=dev"

    redis-exporter:
        # Binary baked into image via infrastructure/docker/services/redis-exporter/Dockerfile.
        # Rebuild with: docker compose build redis-exporter
        build:
            context: .
            dockerfile: infrastructure/docker/services/redis-exporter/Dockerfile
        image: nuniesmith/fks:redis-exporter
        container_name: fks_redis_exporter
        user: "65534:65534"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - REDIS_ADDR=redis://redis:6379
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_EXPORTER_LOG_FORMAT=json
            - REDIS_EXPORTER_INCL_SYSTEM_METRICS=true
        ports:
            - "127.0.0.1:9121:9121"
        networks:
            - fks-network
        depends_on:
            redis:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            disable: true
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 128m
                reservations:
                    cpus: "0.1"
                    memory: 32m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=redis-exporter,environment=dev"

    questdb-exporter:
        # Python Prometheus exporter — queries QuestDB's REST API (/exec) and
        # exposes questdb_* gauges (row counts, partition/WAL/storage) on :9191.
        # Source: infrastructure/config/questdb-exporter/exporter.py
        # Rebuild with: docker compose build questdb-exporter
        build:
            context: .
            dockerfile: infrastructure/docker/services/questdb-exporter/Dockerfile
        image: nuniesmith/fks:questdb-exporter
        container_name: fks_questdb_exporter
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETGID
            - SETUID
        environment:
            - EXPORTER_PORT=9191
            - QUESTDB_HOST=fks_questdb
            - QUESTDB_PORT=9000
        ports:
            - "127.0.0.1:9191:9191"
        networks:
            - fks-network
        depends_on:
            questdb:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            # python:slim has no wget/curl, so the probe must use python. Under the
            # 0.1-CPU limit below, spawning python + `import urllib.request` (which
            # drags in ssl/http.client/email) takes 6–8s and blew the old 5s timeout
            # → spurious "unhealthy" despite /health serving fine. A bare socket
            # connect (no urllib/ssl import) is ~3.5s under throttling; 10s for headroom.
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import socket; socket.create_connection(('127.0.0.1', 9191), timeout=4).close()",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "0.1"
                    memory: 64m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=questdb-exporter,environment=dev"

    # ===========================================================================
    # BOT SPAWNER
    # ===========================================================================

    fks_bot_spawner:
        build:
            context: .
            dockerfile: infrastructure/docker/services/spawner/Dockerfile
            args:
                SERVICE_PORT: "8090"
                REPO_URL: ${SPAWNER_REPO:-}
                REPO_REF: ${SPAWNER_REF:-main}
                REPO_COMMIT: ${SPAWNER_COMMIT:-}
        image: nuniesmith/fks:spawner
        container_name: fks_bot_spawner
        restart: unless-stopped
        # Grant access to the bind-mounted /var/run/docker.sock. On the host the
        # socket is 0660 root:docker, so the in-container appuser (uid 1000) must
        # join the host 'docker' group GID to reach the Docker daemon. Without this
        # the spawner 500s every request with "Docker API error ... client error
        # (Connect)". The GID is host-specific — set DOCKER_GID in .env to your
        # host's `getent group docker` GID (this host: 987, also the default). `id`
        # inside the container should then list it as a supplementary group.
        group_add:
            - "${DOCKER_GID:-987}"
        ports:
            - "127.0.0.1:8090:8090"
        environment:
            - SPAWNER_HOST=0.0.0.0
            - SPAWNER_PORT=8090
            - ALLOWED_IMAGE_PREFIX=${ALLOWED_BOT_IMAGE_PREFIX:-fks-bot-}
            - MAX_CONCURRENT_BOTS=${MAX_CONCURRENT_BOTS:-20}
            # exchange_secrets encryption-at-rest. 64 hex chars (openssl rand
            # -hex 32). Unset = legacy plaintext storage (warned at startup);
            # an invalid value disables the spawner DB entirely (fail-safe).
            - SPAWNER_SECRETS_KEY=${SPAWNER_SECRETS_KEY:-}
            # Bots must join the same Docker network as janus/etc. The network is
            # pinned to `name: ${COMPOSE_PROJECT_NAME:-fks}_network` (see the networks:
            # block below), so ALLOWED_NETWORK must match that pinned name — otherwise
            # spawned bots fail with "network fks_..._network not found".
            - ALLOWED_NETWORK=${COMPOSE_PROJECT_NAME:-fks}_network
            - DEFAULT_CPU_LIMIT=${BOT_CPU_LIMIT:-1.0}
            - DEFAULT_MEMORY_LIMIT_MB=${BOT_MEMORY_MB:-512}
            - PROMETHEUS_SD_PATH=/prometheus-sd/bots.json
            - BOT_METRICS_PORT=9091
            - PRUNE_AFTER_SECS=${BOT_PRUNE_AFTER_SECS:-300}
            - PRUNE_INTERVAL_SECS=60
            - RUST_LOG=${SPAWNER_LOG_LEVEL:-info,spawner=debug}
            # Postgres persistence — writes spawn/stop/remove to bot_runs.
            # Empty/unset = stateless mode (the spawner still runs).
            # Schema: src/sql/ruby/007_spawner.sql
            - SPAWNER_DATABASE_URL=postgres://${POSTGRES_USER:-fks_user}:${POSTGRES_PASSWORD}@postgres:5432/${RUBY_DB:-ruby_db}?sslmode=disable
            # Scoped URL handed to one-shot factory backtest containers instead
            # of the spawner's own full-privilege URL above. The fks_backtest
            # role (src/sql/spawner/009_backtest_role.sql) can ONLY read
            # backtest_runs and update its status/results/finished_at — no
            # exchange_secrets, no treasury tables. Consumed by the spawner
            # since fks-spawner #4 (unset = loud degraded-fallback warning).
            - BACKTEST_DB_URL=postgresql://fks_backtest:${BACKTEST_DB_PASSWORD:-}@fks_postgres:5432/${RUBY_DB:-ruby_db}
            # Shared secret nginx forwards on every proxied request.
            # Empty = dev mode (auth disabled).
            - NGINX_INTERNAL_TOKEN=${NGINX_INTERNAL_TOKEN:-}
            # Fail closed (refuse to boot) when the internal token is unset,
            # instead of the silent dev-passthrough. Off by default.
            - REQUIRE_INTERNAL_TOKEN=${REQUIRE_INTERNAL_TOKEN:-false}
            # Edge-decay: weekly re-run of every active edge's backtest so the
            # Sunday advisor report can show drift vs the prior run. Default
            # OFF; the schedule (UTC) defaults to Sun 16:00 (~6h before the
            # Sun 18:00 ET advisor report). Needs BACKTEST_DB_URL (above).
            - EDGE_DECAY_ENABLED=${EDGE_DECAY_ENABLED:-false}
            - EDGE_DECAY_WEEKDAY=${EDGE_DECAY_WEEKDAY:-0}
            - EDGE_DECAY_HOUR_UTC=${EDGE_DECAY_HOUR_UTC:-16}
            - EDGE_DECAY_MINUTE_UTC=${EDGE_DECAY_MINUTE_UTC:-0}
            # P0.6 read-only treasury nodes (idle until the operator supplies
            # inputs). Without this glue the spawner reads only its own env, so
            # setting BTC_WATCH_XPUB / RITHMIC_SAMPLER_URL in .env would never
            # reach it and the watchers would silently stay off.
            - BTC_WATCH_XPUB=${BTC_WATCH_XPUB:-}
            - BTC_WATCH_ADDRESSES=${BTC_WATCH_ADDRESSES:-}
            - BTC_WATCH_ACCOUNT_ID=${BTC_WATCH_ACCOUNT_ID:-btc-cold}
            - BTC_WATCH_GAP=${BTC_WATCH_GAP:-20}
            - BTC_WATCH_INTERVAL_SECS=${BTC_WATCH_INTERVAL_SECS:-3600}
            - ESPLORA_API_BASE=${ESPLORA_API_BASE:-}
            - RITHMIC_SAMPLER_URL=${RITHMIC_SAMPLER_URL:-}
            - RITHMIC_SAMPLE_INTERVAL_SECS=${RITHMIC_SAMPLE_INTERVAL_SECS:-300}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - prometheus_sd:/prometheus-sd
        networks:
            - fks-network
        healthcheck:
            test:
                ["CMD-SHELL", "curl -sf http://localhost:8090/health || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256m
                reservations:
                    cpus: "0.1"
                    memory: 64m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=fks_bot_spawner,environment=dev"

    # ===========================================================================
    # DEMO BOT (opt-in — profile: demo)
    # ===========================================================================
    # The working crypto-demo paper bot, driving the janus brain end-to-end:
    #     docker compose --profile demo up crypto-demo
    # brings up janus (+ its deps) and the bot on fks-network:
    #   synthetic candles → indicators-ta features → janus brain (signal + risk
    #   over :8080) → rustrade risk gate → MockExchange (PAPER — no real orders).
    # Flip DEMO_SOURCE=kucoin|kraken for live market data; keep DEMO_EXCHANGE=mock
    # to stay paper. Metrics + /health at 127.0.0.1:9091 (fks_bot_* series).
    crypto-demo:
        profiles: ["demo"]
        build:
            # Source + Dockerfile live in the fks-spawner repo (bot factory);
            # building needs the sibling checkout at ../fks-spawner.
            context: ../fks-spawner
            dockerfile: bots/crypto-demo/Dockerfile
            args:
                RUST_VERSION: "1.94.1"
        image: fks-bot-crypto-demo:latest
        container_name: fks_bot_crypto_demo
        user: "1000:1000"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - DEMO_BRAIN=${DEMO_BRAIN:-ema-cross} # local indicators-ta brain — works offline, no janus dep, trades actively. =janus uses the janus REST brain (needs janus STARTED + JANUS_HTTP_URL below)
            - DEMO_SOURCE=${DEMO_SOURCE:-synthetic} # offline random-walk demo (lively, no network/creds). =kucoin (live KuCoin futures) | =kraken (live Kraken spot) for real data
            - DEMO_EXCHANGE=${DEMO_EXCHANGE:-mock} # mock = paper; never places real orders
            # Forward REST (8180) — serves /api/v1/signals/generate + /api/v1/risk/*
            # for DEMO_BRAIN=janus. (8080 is janus_api, which lacks those routes.)
            - JANUS_HTTP_URL=${JANUS_HTTP_URL:-http://fks_janus:8180}
            - DEMO_SYMBOLS=${DEMO_SYMBOLS:-XBTUSDTM,ETHUSDTM,SOLUSDTM}
            # Live-venue credentials — EMPTY by default (paper/mock). To trade a
            # real (sub-)account: set these in .env AND flip DEMO_EXCHANGE to
            # kucoin | kraken | multi. Left empty, the bot stays on MockExchange.
            # The bot reads KuCoin creds as KC_*; we bridge them from the
            # platform-standard KUCOIN_API_* vars so .env keeps one convention.
            - KC_KEY=${KUCOIN_API_KEY:-}
            - KC_SECRET=${KUCOIN_API_SECRET:-}
            - KC_PASSPHRASE=${KUCOIN_API_PASSPHRASE:-}
            - KRAKEN_API_KEY=${KRAKEN_API_KEY:-}
            - KRAKEN_API_SECRET=${KRAKEN_API_SECRET:-}
            # Optional per-venue symbol/asset + durable-state overrides
            - DEMO_KUCOIN_SYMBOLS=${DEMO_KUCOIN_SYMBOLS:-}
            - DEMO_KRAKEN_SYMBOLS=${DEMO_KRAKEN_SYMBOLS:-}
            - DEMO_KRAKEN_BASE_ASSETS=${DEMO_KRAKEN_BASE_ASSETS:-}
            - DEMO_STATE_FILE=${DEMO_STATE_FILE:-}
            # Position sizing + risk caps — empty = paper-safe defaults (50k
            # margin, 100 max contracts). For a REAL venue set tiny in .env, e.g.
            # DEMO_MARGIN_PER_TRADE_USD=7 DEMO_LEVERAGE=1 DEMO_MAX_CONTRACTS=1
            # DEMO_MAX_POSITIONS=1 → ~1 SOLUSDTM contract (~$6.74 notional).
            - DEMO_LEVERAGE=${DEMO_LEVERAGE:-}
            - DEMO_MARGIN_PER_TRADE_USD=${DEMO_MARGIN_PER_TRADE_USD:-}
            - DEMO_MAX_CONTRACTS=${DEMO_MAX_CONTRACTS:-}
            - DEMO_MAX_POSITIONS=${DEMO_MAX_POSITIONS:-}
            - DEMO_MAX_DAILY_LOSS_USD=${DEMO_MAX_DAILY_LOSS_USD:-}
            - DEMO_MAX_GROSS_EXPOSURE_USD=${DEMO_MAX_GROSS_EXPOSURE_USD:-}
            - RUST_LOG=${BOT_RUST_LOG:-info,crypto_demo=debug}
            - RUST_BACKTRACE=1
        ports:
            - "127.0.0.1:9091:9091" # fks_bot_* metrics + /health
        networks:
            - fks-network
        depends_on:
            janus:
                condition: service_healthy
        restart: unless-stopped
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=fks_bot_crypto_demo,environment=dev"

    # -------------------------------------------------------------------------
    # advisor — daily/weekly "what to do next" Discord digests
    # (fks-state:crates/advisor). Synthesizes spawner treasury/edge state into
    # short advice: daily 17:30 ET + Sunday 18:00 ET weekly report. Advisory
    # only; reads the spawner HTTP API, never trades.
    #
    # Profile "state": builds from the PRIVATE sibling checkout ../fks-state,
    # which a fresh public-only host doesn't have — without the gate,
    # `./run.sh all` dies at "unable to prepare context: ../fks-state".
    # run.sh auto-enables the profile when ../fks-state exists; for bare
    # docker compose set COMPOSE_PROFILES=state in .env.
    advisor:
        profiles: ["state"]
        build:
            context: ../fks-state
            dockerfile: crates/advisor/Dockerfile
        image: fks-advisor:latest
        container_name: fks_advisor
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - SPAWNER_TOKEN=${NGINX_INTERNAL_TOKEN}
            - DISCORD_WEBHOOK=${DISCORD_WEBHOOK:-}
            - ADVISOR_DAILY_TIME=${ADVISOR_DAILY_TIME:-17:30}
            - ADVISOR_WEEKLY=${ADVISOR_WEEKLY:-Sun 18:00}
            - ADVISOR_GATE_A_DATE=${ADVISOR_GATE_A_DATE:-2026-08-01}
            - RUST_LOG=info
        networks:
            - fks-network
        restart: unless-stopped
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=advisor,environment=dev"

    # -------------------------------------------------------------------------
    # orb-briefing — ORB decision-support (fks-state:crates/orb-briefing).
    #
    # Sends the operator two Discord messages per weekday: the ~08:30 ET
    # pre-market briefing and the ~10:00 ET opening-range day-plan with SIZED
    # contracts (orb crate: inverse-to-stop sizing + prop guards). Advisory
    # only — never places orders. Data v1 = Yahoo (~15-min delayed, tagged in
    # every message); the rithmic-connector becomes the real-time source later.
    # Plan time is 10:00 (not 09:45) so the delayed 09:30–09:45 window is
    # complete; move earlier once real-time data lands.
    #
    # Profile "state": same gate as advisor — builds from the PRIVATE sibling
    # ../fks-state. run.sh auto-enables it when the checkout exists; bare
    # docker compose users set COMPOSE_PROFILES=state in .env.
    orb-briefing:
        profiles: ["state"]
        build:
            context: ../fks-state
            dockerfile: crates/orb-briefing/Dockerfile
        image: fks-orb-briefing:latest
        container_name: fks_orb_briefing
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - DISCORD_WEBHOOK=${DISCORD_WEBHOOK:-}
            - ORB_BRIEFING_TIME=${ORB_BRIEFING_TIME:-08:30}
            - ORB_PLAN_TIME=${ORB_PLAN_TIME:-10:00}
            - ORB_SYMBOLS=${ORB_SYMBOLS:-GC,NQ,ES}
            - ORB_RISK_USD=${ORB_RISK_USD:-500}
            - ORB_MAX_CONTRACTS=${ORB_MAX_CONTRACTS:-15}
            - ORB_DAILY_LOSS_HEADROOM=${ORB_DAILY_LOSS_HEADROOM:-3000}
            - ORB_TRAILING_DD_HEADROOM=${ORB_TRAILING_DD_HEADROOM:-4500}
            - ORB_OPEN_RANGE_MINS=${ORB_OPEN_RANGE_MINS:-15}
            - ORB_STOP_MODE=${ORB_STOP_MODE:-opposite}
            - ORB_TARGET_R=${ORB_TARGET_R:-2.0}
            - RUST_LOG=info
        networks:
            - fks-network
        restart: unless-stopped
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=orb_briefing,environment=dev"

    # -------------------------------------------------------------------------
    # rithmic-connector — credential-gated, READ-ONLY Rithmic futures feed.
    #
    # FOUNDATION / skeleton (roadmap P12; design in
    # docs/architecture/RITHMIC_INTEGRATION_SPIKE.md). NOT part of the default
    # `up`: it is behind the `rithmic` profile AND runtime-gated on
    # RITHMIC_ENABLED. It only makes sense once a Rithmic dev kit + test-system
    # credentials exist (spike Phase 0 — the long pole).
    #
    #     docker compose --profile rithmic up rithmic-connector
    #
    # DOCTRINE: read-only. The order plant is never opened; no execution path
    # exists in the image. Creds (RITHMIC_USER/PASSWORD/SYSTEM_NAME) are injected
    # from the spawner secret store like other brokers — leave them EMPTY here to
    # keep the connector idle. Persistence to `candles_futures` is a STUB in this
    # PR (see fks-state:crates/rithmic-connector/src/persistence.rs).
    rithmic-connector:
        profiles: ["rithmic"]
        build:
            # rithmic-connector moved to the PRIVATE fks-state repo (funded-side
            # code: PnL plant, future ORB supervision / copy-trade). Building
            # needs the sibling checkout at ../fks-state.
            context: ../fks-state
            dockerfile: crates/rithmic-connector/Dockerfile
            args:
                RUST_VERSION: "1.94.1"
                SERVICE_PORT: "9091"
        image: nuniesmith/fks:rithmic-connector
        container_name: fks_rithmic_connector
        user: "1000:1000"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            # Master gate — OFF by default. Nothing connects until true AND
            # credentials are present (the capability gate).
            - RITHMIC_ENABLED=${RITHMIC_ENABLED:-false}
            - RITHMIC_ENV=${RITHMIC_ENV:-demo} # demo | test | live
            - RITHMIC_GATEWAY_URL=${RITHMIC_GATEWAY_URL:-}
            - RITHMIC_GATEWAY_ALT_URL=${RITHMIC_GATEWAY_ALT_URL:-}
            - RITHMIC_SYSTEM_NAME=${RITHMIC_SYSTEM_NAME:-}
            # Credentials — injected by the spawner secret store (broker 3-slot:
            # user→api_key, password→api_secret, system→api_passphrase). Empty
            # here = connector idles.
            - RITHMIC_USER=${RITHMIC_USER:-}
            - RITHMIC_PASSWORD=${RITHMIC_PASSWORD:-}
            - RITHMIC_APP_NAME=${RITHMIC_APP_NAME:-fks-rithmic-connector}
            - RITHMIC_APP_VERSION=${RITHMIC_APP_VERSION:-0.1.0}
            # The single instrument this foundation subscribes to (read-only).
            - RITHMIC_INSTRUMENT=${RITHMIC_INSTRUMENT:-MES}
            - RITHMIC_EXCHANGE=${RITHMIC_EXCHANGE:-CME}
            # Persistence — completed 1m candles are written to candles_futures
            # over QuestDB ILP (TCP :9009), mirroring the janus candle sink for
            # candles_crypto. Defaults to the in-network questdb service.
            - QUESTDB_ILP_HOST=${QUESTDB_ILP_HOST:-fks_questdb}
            - QUESTDB_ILP_PORT=${QUESTDB_ILP_PORT:-9009}
            # QUESTDB_ILP_URL (host:port, optionally tcp://) overrides host+port.
            - QUESTDB_ILP_URL=${QUESTDB_ILP_URL:-}
            - RITHMIC_HEALTH_HOST=0.0.0.0
            - RITHMIC_HEALTH_PORT=9091
            - RUST_LOG=${RITHMIC_LOG_LEVEL:-info,rithmic_connector=debug}
            - RUST_BACKTRACE=1
        # Read-only market data lands in QuestDB; start it first when present.
        # (condition: started, not healthy — the connector is best-effort and
        # reconnects, so it must never block on QuestDB.)
        depends_on:
            questdb:
                condition: service_started
        ports:
            - "127.0.0.1:9092:9091" # /health + /status (9092 host to avoid the bot :9091)
        networks:
            - fks-network
        restart: unless-stopped
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=fks_rithmic_connector,environment=dev"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
    questdb_data:
        driver: local
    qdrant_data:
        driver: local
    optimizer_data:
        driver: local
    janus_checkpoints:
        driver: local
    prometheus_sd:
        driver: local
    loki_data:
        driver: local
    promtail_positions:
        driver: local
    alertmanager_data:
        external: true
    prometheus_data:
        external: true
    grafana_data:
        external: true

# =============================================================================
# NETWORKS
# =============================================================================
networks:
    fks-network:
        # Pin the Docker network name so it matches the spawner's ALLOWED_NETWORK
        # (`${COMPOSE_PROJECT_NAME:-fks}_network`). Without this, compose derives the
        # name from the key as `<project>_fks-network` (e.g. `fks_fks-network`), which
        # never matches `fks_network`, so spawned bots fail with "network not found".
        name: ${COMPOSE_PROJECT_NAME:-fks}_network
        driver: bridge
