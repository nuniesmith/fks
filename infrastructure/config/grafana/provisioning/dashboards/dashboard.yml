apiVersion: 1

providers:
    # FKS & Ruby Dashboards
    - name: "FKS & Ruby Dashboards"
      orgId: 1
      folder: ""
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
