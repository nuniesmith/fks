syntax = "proto3";

package fks.neuromorphic.distributed.v1;

option go_package = "github.com/nuniesmith/fks/proto/fks/neuromorphic/distributed/v1;distributedv1";
option java_multiple_files = true;
option java_package = "xyz.fkstrading.proto.neuromorphic.distributed.v1";

// Distributed Training Service
// Provides gradient synchronization, parameter server, and coordination primitives
service DistributedTrainingService {
  // Push gradients to parameter server
  rpc PushGradients(PushGradientsRequest) returns (PushGradientsResponse);

  // Pull parameters from parameter server
  rpc PullParameters(PullParametersRequest) returns (PullParametersResponse);

  // Barrier synchronization across nodes
  rpc Barrier(BarrierRequest) returns (BarrierResponse);

  // Heartbeat for node health monitoring
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // All-reduce operation for gradient aggregation
  rpc AllReduce(AllReduceRequest) returns (AllReduceResponse);

  // Broadcast parameters from master to workers
  rpc Broadcast(BroadcastRequest) returns (BroadcastResponse);

  // Gather tensors from all workers to master
  rpc Gather(GatherRequest) returns (GatherResponse);

  // Node registration and discovery
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // Get cluster status
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
}

// Push gradients to parameter server
message PushGradientsRequest {
  string key = 1; // Layer/parameter name
  repeated float data = 2; // Gradient data (flattened)
  uint64 version = 3; // Version number
  uint32 rank = 4; // Sender rank
  TensorShape shape = 5; // Original tensor shape
  CompressionType compression = 6; // Compression method
  bytes compressed_data = 7; // Compressed data (if compression enabled)
}

message PushGradientsResponse {
  bool success = 1;
  string message = 2;
  uint64 version = 3; // Updated version number
}

// Pull parameters from parameter server
message PullParametersRequest {
  string key = 1; // Layer/parameter name
  optional uint64 version = 2; // Expected version (for consistency)
  uint32 rank = 3; // Requester rank
}

message PullParametersResponse {
  bool success = 1;
  string message = 2;
  repeated float data = 3; // Parameter data
  uint64 version = 4; // Current version
  TensorShape shape = 5; // Tensor shape
}

// Barrier synchronization
message BarrierRequest {
  uint32 rank = 1; // Node rank
  uint64 barrier_id = 2; // Barrier identifier
  uint64 timestamp = 3; // Request timestamp
}

message BarrierResponse {
  bool success = 1;
  string message = 2;
  uint64 barrier_id = 3;
  uint32 num_waiting = 4; // Number of nodes waiting
}

// Heartbeat for health monitoring
message HeartbeatRequest {
  uint32 rank = 1; // Node rank
  uint64 timestamp = 2; // Timestamp (ms since epoch)
  NodeStatus status = 3; // Node status
  ResourceUsage resources = 4; // Resource usage info
}

message HeartbeatResponse {
  bool success = 1;
  string message = 2;
  ClusterHealth cluster_health = 3;
}

// All-reduce operation
message AllReduceRequest {
  string key = 1; // Operation key
  repeated float data = 2; // Local data
  ReduceOp op = 3; // Reduce operation
  uint32 rank = 4; // Sender rank
  TensorShape shape = 5; // Tensor shape
}

message AllReduceResponse {
  bool success = 1;
  string message = 2;
  repeated float data = 3; // Reduced result
}

// Broadcast operation
message BroadcastRequest {
  string key = 1; // Broadcast key
  repeated float data = 2; // Data to broadcast (from root)
  uint32 root = 3; // Root rank
  uint32 rank = 4; // Sender rank
  TensorShape shape = 5; // Tensor shape
}

message BroadcastResponse {
  bool success = 1;
  string message = 2;
  repeated float data = 3; // Broadcasted data
}

// Gather operation
message GatherRequest {
  string key = 1; // Gather key
  repeated float data = 2; // Local data
  uint32 root = 3; // Root rank (destination)
  uint32 rank = 4; // Sender rank
  TensorShape shape = 5; // Tensor shape
}

message GatherResponse {
  bool success = 1;
  string message = 2;
  repeated GatheredData gathered = 3; // All gathered data (only for root)
}

message GatheredData {
  uint32 rank = 1;
  repeated float data = 2;
}

// Node registration
message RegisterNodeRequest {
  uint32 rank = 1; // Requested rank
  string hostname = 2; // Node hostname
  string ip_address = 3; // IP address
  repeated uint32 gpu_ids = 4; // Available GPU IDs
  NodeCapabilities capabilities = 5; // Node capabilities
}

message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
  uint32 assigned_rank = 3; // Assigned rank
  uint32 world_size = 4; // Total number of nodes
  ClusterConfig cluster_config = 5; // Cluster configuration
}

// Cluster status
message GetClusterStatusRequest {
  uint32 rank = 1; // Requester rank
}

message GetClusterStatusResponse {
  bool success = 1;
  string message = 2;
  uint32 world_size = 3;
  repeated NodeInfo nodes = 4;
  ClusterHealth health = 5;
}

// Supporting message types

message TensorShape {
  repeated uint64 dims = 1; // Dimensions
}

message NodeStatus {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_INITIALIZING = 1;
    STATUS_READY = 2;
    STATUS_TRAINING = 3;
    STATUS_IDLE = 4;
    STATUS_FAILED = 5;
    STATUS_SHUTDOWN = 6;
  }
  Status status = 1;
  string message = 2;
  uint64 last_update = 3; // Timestamp
}

message ResourceUsage {
  float cpu_usage = 1; // CPU usage percentage
  float memory_usage = 2; // Memory usage percentage
  repeated GpuUsage gpu_usage = 3; // GPU usage per device
  float network_bandwidth = 4; // Network bandwidth (MB/s)
}

message GpuUsage {
  uint32 device_id = 1;
  float utilization = 2; // GPU utilization percentage
  float memory_used = 3; // Memory used (GB)
  float memory_total = 4; // Total memory (GB)
  float temperature = 5; // Temperature (C)
}

message ClusterHealth {
  enum Health {
    HEALTH_UNSPECIFIED = 0;
    HEALTH_HEALTHY = 1;
    HEALTH_DEGRADED = 2;
    HEALTH_UNHEALTHY = 3;
  }
  Health health = 1;
  uint32 num_healthy_nodes = 2;
  uint32 num_failed_nodes = 3;
  string message = 4;
}

message NodeCapabilities {
  bool has_cuda = 1;
  bool has_nccl = 2;
  bool has_rdma = 3;
  uint32 num_gpus = 4;
  string gpu_type = 5; // e.g., "NVIDIA A100"
  uint64 total_memory = 6; // Total memory in bytes
  uint32 num_cpus = 7;
}

message NodeInfo {
  uint32 rank = 1;
  string hostname = 2;
  string ip_address = 3;
  NodeStatus status = 4;
  NodeCapabilities capabilities = 5;
  ResourceUsage resources = 6;
}

message ClusterConfig {
  uint32 world_size = 1;
  repeated string node_addresses = 2; // List of all node addresses
  uint32 master_rank = 3; // Master node rank
  string master_address = 4; // Master node address
}

enum CompressionType {
  COMPRESSION_TYPE_UNSPECIFIED = 0;
  COMPRESSION_TYPE_GZIP = 1;
  COMPRESSION_TYPE_SNAPPY = 2;
  COMPRESSION_TYPE_LZ4 = 3;
  COMPRESSION_TYPE_ZSTD = 4;
}

enum ReduceOp {
  REDUCE_OP_UNSPECIFIED = 0;
  REDUCE_OP_SUM = 1;
  REDUCE_OP_PRODUCT = 2;
  REDUCE_OP_MIN = 3;
  REDUCE_OP_MAX = 4;
  REDUCE_OP_AVERAGE = 5;
}
