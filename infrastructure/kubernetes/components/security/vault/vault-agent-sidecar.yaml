---
# Vault Agent Sidecar Configuration for Data Service
# Provides automatic secret injection and renewal

apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config
  namespace: production
data:
  vault-agent-config.hcl: |
    # Vault agent configuration
    pid_file = "/tmp/pidfile"

    vault {
      address = "http://vault.vault:8200"
      retry {
        num_retries = 5
      }
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "data-service"
        }
      }

      sink "file" {
        config = {
          path = "/vault/.vault-token"
          mode = 0640
        }
      }
    }

    template_config {
      static_secret_render_interval = "5m"
      exit_on_retry_failure = true
      max_connections_per_host = 10
    }

    # QuestDB credentials template
    template {
      source      = "/vault/configs/questdb.tpl"
      destination = "/vault/secrets/questdb.yml"
      error_on_missing_key = true
      perms = "0640"
    }

    # Redis credentials template
    template {
      source      = "/vault/configs/redis.tpl"
      destination = "/vault/secrets/redis.yml"
      error_on_missing_key = true
      perms = "0640"
    }

    # Exchange API keys template
    template {
      source      = "/vault/configs/exchanges.tpl"
      destination = "/vault/secrets/exchanges.yml"
      error_on_missing_key = true
      perms = "0640"
    }

    # Combined configuration template
    template {
      source      = "/vault/configs/config.tpl"
      destination = "/vault/secrets/config.yml"
      error_on_missing_key = true
      perms = "0640"
      command = "/bin/sh -c 'kill -HUP $(cat /tmp/data-service.pid) || true'"
    }

  questdb.tpl: |
    {{ with secret "secret/data/questdb/production" -}}
    questdb:
      host: {{ .Data.data.host }}
      http_port: {{ .Data.data.http_port }}
      ilp_port: {{ .Data.data.ilp_port }}
      username: {{ .Data.data.username }}
      password: {{ .Data.data.password }}
      max_connections: 100
      connection_timeout_ms: 5000
      query_timeout_ms: 30000
    {{- end }}

  redis.tpl: |
    {{ with secret "secret/data/redis/production" -}}
    redis:
      host: {{ .Data.data.host }}
      port: {{ .Data.data.port }}
      password: {{ .Data.data.password }}
      db: {{ .Data.data.db }}
      max_connections: 150
      connection_timeout_ms: 3000
      pool_size: 150
      min_idle: 10
      max_idle: 50
    {{- end }}

  exchanges.tpl: |
    {{ with secret "secret/data/exchanges/binance" -}}
    exchanges:
      binance:
        api_key: {{ .Data.data.api_key }}
        api_secret: {{ .Data.data.api_secret }}
        enabled: true
        rate_limit: 1200
    {{- end }}
    {{ with secret "secret/data/exchanges/kraken" -}}
      kraken:
        api_key: {{ .Data.data.api_key }}
        api_secret: {{ .Data.data.api_secret }}
        enabled: true
        rate_limit: 15
    {{- end }}
    {{ with secret "secret/data/exchanges/coinbase" -}}
      coinbase:
        api_key: {{ .Data.data.api_key }}
        api_secret: {{ .Data.data.api_secret }}
        enabled: true
        rate_limit: 10
    {{- end }}

  config.tpl: |
    # Data Service Configuration (Auto-generated by Vault Agent)
    # DO NOT EDIT MANUALLY - Changes will be overwritten

    service:
      name: data-service
      region: {{ env "REGION" }}
      environment: production
      log_level: info

    {{ with secret "secret/data/questdb/production" -}}
    questdb:
      host: {{ .Data.data.host }}
      http_port: {{ .Data.data.http_port }}
      ilp_port: {{ .Data.data.ilp_port }}
      username: {{ .Data.data.username }}
      password: {{ .Data.data.password }}
      max_connections: 100
      connection_timeout_ms: 5000
      query_timeout_ms: 30000
      ilp:
        enabled: true
        batch_size: 15000
        flush_interval_ms: 500
        max_buffer_size: 50000
    {{- end }}

    {{ with secret "secret/data/redis/production" -}}
    redis:
      host: {{ .Data.data.host }}
      port: {{ .Data.data.port }}
      password: {{ .Data.data.password }}
      db: {{ .Data.data.db }}
      max_connections: 150
      connection_timeout_ms: 3000
      pool_size: 150
      min_idle: 10
      max_idle: 50
      ttl_seconds: 300
    {{- end }}

    exchanges:
    {{ with secret "secret/data/exchanges/binance" -}}
      binance:
        api_key: {{ .Data.data.api_key }}
        api_secret: {{ .Data.data.api_secret }}
        enabled: true
        base_url: https://api.binance.com
        websocket_url: wss://stream.binance.com:9443
        rate_limit: 1200
        symbols:
          - BTC/USDT
          - ETH/USDT
          - BNB/USDT
    {{- end }}
    {{ with secret "secret/data/exchanges/kraken" -}}
      kraken:
        api_key: {{ .Data.data.api_key }}
        api_secret: {{ .Data.data.api_secret }}
        enabled: true
        base_url: https://api.kraken.com
        websocket_url: wss://ws.kraken.com
        rate_limit: 15
        symbols:
          - BTC/USD
          - ETH/USD
    {{- end }}
    {{ with secret "secret/data/exchanges/coinbase" -}}
      coinbase:
        api_key: {{ .Data.data.api_key }}
        api_secret: {{ .Data.data.api_secret }}
        enabled: true
        base_url: https://api.coinbase.com
        websocket_url: wss://ws-feed.exchange.coinbase.com
        rate_limit: 10
        symbols:
          - BTC-USD
          - ETH-USD
    {{- end }}

    backfill:
      enabled: true
      max_concurrent_jobs: 5
      gap_check_interval_seconds: 300
      max_gap_size_hours: 168
      retry_attempts: 3
      retry_delay_seconds: 60

    circuit_breaker:
      failure_threshold: 5
      success_threshold: 2
      timeout_seconds: 120
      half_open_max_requests: 5

    metrics:
      enabled: true
      port: 9090
      path: /metrics

    logging:
      level: info
      format: json
      correlation_id_enabled: true

    self_healing:
      enabled: false  # Will be enabled in Week 11
      dry_run: true
      check_interval_seconds: 30
      max_remediations_per_hour: 10
      remediation_cooldown_seconds: 300

---
# Updated Data Service Deployment with Vault Agent Sidecar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: production
  labels:
    app: data-service
    version: v1.1.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
        version: v1.1.0
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-service"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: data-service

      # Init container to wait for Vault to be ready
      initContainers:
      - name: vault-agent-init
        image: hashicorp/vault:1.15.4
        command:
        - sh
        - -c
        - |
          # Wait for Vault to be ready
          until vault status -address=http://vault.vault:8200; do
            echo "Waiting for Vault..."
            sleep 2
          done
          echo "Vault is ready!"
        env:
        - name: VAULT_ADDR
          value: "http://vault.vault:8200"
        - name: SKIP_SETCAP
          value: "true"

      containers:
      # Vault Agent sidecar
      - name: vault-agent
        image: hashicorp/vault:1.15.4
        args:
        - agent
        - -config=/vault/configs/vault-agent-config.hcl
        - -log-level=info
        env:
        - name: VAULT_ADDR
          value: "http://vault.vault:8200"
        - name: SKIP_SETCAP
          value: "true"
        - name: REGION
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['region']
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: vault-config
          mountPath: /vault/configs
        - name: vault-secrets
          mountPath: /vault/secrets
        - name: vault-token
          mountPath: /vault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 100
        livenessProbe:
          httpGet:
            path: /agent/v1/health
            port: 8200
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /agent/v1/health
            port: 8200
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

      # Main application container
      - name: data-service
        image: data-service:v1.1.0
        command:
        - /bin/sh
        - -c
        - |
          # Write PID file for Vault agent to send SIGHUP
          echo $$ > /tmp/data-service.pid
          # Start the service
          /app/data-service --config=/vault/secrets/config.yml
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info,data_service=debug"
        - name: REGION
          value: "us-east-1"
        - name: ENVIRONMENT
          value: "production"
        - name: CONFIG_PATH
          value: "/vault/secrets/config.yml"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: 1500m
            memory: 3Gi
          limits:
            cpu: 3000m
            memory: 6Gi
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

      volumes:
      - name: vault-config
        configMap:
          name: vault-agent-config
      - name: vault-secrets
        emptyDir:
          medium: Memory
          sizeLimit: 10Mi
      - name: vault-token
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 100Mi

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - data-service
              topologyKey: kubernetes.io/hostname

      # Graceful shutdown
      terminationGracePeriodSeconds: 60

---
# ServiceAccount for Data Service (used by Vault authentication)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-service
  namespace: production

---
# Role for Data Service to read its own pod info
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-service
  namespace: production
rules:
- apiGroups: [""]
  resources:
  - pods
  verbs:
  - get
  - list

---
# RoleBinding for Data Service
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-service
  namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: data-service
subjects:
- kind: ServiceAccount
  name: data-service
  namespace: production

---
# Service for Data Service
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: production
  labels:
    app: data-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: data-service
  sessionAffinity: None

---
# HorizontalPodAutoscaler for Data Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-service
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max

---
# PodDisruptionBudget for Data Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: data-service
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: data-service

---
# NetworkPolicy for Data Service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-service
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: data-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: production
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow Vault
  - to:
    - namespaceSelector:
        matchLabels:
          name: vault
    ports:
    - protocol: TCP
      port: 8200
  # Allow QuestDB
  - to:
    - podSelector:
        matchLabels:
          app: questdb
    ports:
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9009
  # Allow Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow external (exchanges, APIs)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
