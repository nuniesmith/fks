[package]
name        = "fks-bot-example"
version     = "0.1.0"
edition     = "2024"
publish     = false
description = "Reference bot image for the FKS spawner — heartbeat + Prometheus metrics matching the fks_bot_* contract"

[[bin]]
name = "fks-bot-example"
path = "src/main.rs"

[dependencies]
# Framework
rustrade    = { workspace = true }

# Async runtime / utilities
async-trait = { workspace = true }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-util  = { workspace = true }
futures-util = { workspace = true }

# HTTP server for /metrics — axum is already a transitive dep via rustrade.
axum = "0.8"

# Prometheus metrics
prometheus = { workspace = true }
once_cell  = "1"

# Logging
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }

# Misc
anyhow      = { workspace = true }
chrono      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
rand       = { workspace = true }
