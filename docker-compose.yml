    # ===========================================================================
    # EXPORTERS
    # ===========================================================================

    postgres-exporter:
        # Custom queries baked into image via infrastructure/docker/services/postgres-exporter/Dockerfile.
        # Source: infrastructure/config/postgres-exporter/queries.yaml
        # Rebuild with: docker compose build postgres-exporter
        build:
            context: .
            dockerfile: infrastructure/docker/services/postgres-exporter/Dockerfile
        image: nuniesmith/fks:postgres-exporter
        container_name: fks_postgres_exporter
        user: "65534:65534"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-fks_user}:${POSTGRES_PASSWORD}@postgres:5432/${JANUS_DB:-janus_db}?sslmode=disable
            - PG_EXPORTER_DISABLE_DEFAULT_METRICS=false
            - PG_EXPORTER_DISABLE_SETTINGS_METRICS=false
            - PG_EXPORTER_AUTO_DISCOVER_DATABASES=false
        # Override the image's default CMD (--extend.query-path=queries.yaml). That
        # DEPRECATED custom-queries file redefines pg_stat_user_tables / pg_locks with
        # different help text than the always-on built-in collectors, so /metrics 500s
        # with 100+ "help text collision" errors and the Prometheus `postgres` target
        # goes DOWN. The built-in collectors cover the standard pg_stat_* metrics; this
        # flag is a harmless explicit default that just drops the --extend.query-path.
        command: ["--web.listen-address=:9187"]
        ports:
            - "127.0.0.1:9187:9187"
        networks:
            - fks-network
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            disable: true
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 128m
                reservations:
                    cpus: "0.1"
                    memory: 32m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=postgres-exporter,environment=dev"

    node-exporter:
        # Host-level metrics (disk/CPU/mem). Added 2026-07-01: the
        # HostDiskSpaceCritical/Warning alerts key on node_filesystem_* but no
        # node-exporter was deployed, so the disk-full safety net (which saved
        # the box on 2026-03-26) could never fire. The host rootfs is mounted
        # read-only at /host so mountpoint="/" reports the real host disk.
        image: prom/node-exporter:v1.8.2
        container_name: fks_node_exporter
        user: "65534:65534"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        command:
            - "--path.rootfs=/host"
            - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/.+)($|/)"
        volumes:
            - /:/host:ro,rslave
        ports:
            - "127.0.0.1:9100:9100"
        networks:
            - fks-network
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 128m
                reservations:
                    cpus: "0.05"
                    memory: 32m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=node-exporter,environment=dev"

    redis-exporter:
        # Binary baked into image via infrastructure/docker/services/redis-exporter/Dockerfile.
        # Rebuild with: docker compose build redis-exporter
        build:
            context: .
            dockerfile: infrastructure/docker/services/redis-exporter/Dockerfile
        image: nuniesmith/fks:redis-exporter
        container_name: fks_redis_exporter
        user: "65534:65534"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - REDIS_ADDR=redis://redis:6379
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_EXPORTER_LOG_FORMAT=json
            - REDIS_EXPORTER_INCL_SYSTEM_METRICS=true
        ports:
            - "127.0.0.1:9121:9121"
        networks:
            - fks-network
        depends_on:
            redis:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            disable: true
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 128m
                reservations:
                    cpus: "0.1"
                    memory: 32m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=redis-exporter,environment=dev"

    questdb-exporter:
        # Python Prometheus exporter — queries QuestDB's REST API (/exec) and
        # exposes questdb_* gauges (row counts, partition/WAL/storage) on :9191.
        # Source: infrastructure/config/questdb-exporter/exporter.py
        # Rebuild with: docker compose build questdb-exporter
        build:
            context: .
            dockerfile: infrastructure/docker/services/questdb-exporter/Dockerfile
        image: nuniesmith/fks:questdb-exporter
        container_name: fks_questdb_exporter
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETGID
            - SETUID
        environment:
            - EXPORTER_PORT=9191
            - QUESTDB_HOST=fks_questdb
            - QUESTDB_PORT=9000
        ports:
            - "127.0.0.1:9191:9191"
        networks:
            - fks-network
        depends_on:
            questdb:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            # python:slim has no wget/curl, so the probe must use python. Under the
            # 0.1-CPU limit below, spawning python + `import urllib.request` (which
            # drags in ssl/http.client/email) takes 6–8s and blew the old 5s timeout
            # → spurious "unhealthy" despite /health serving fine. A bare socket
            # connect (no urllib/ssl import) is ~3.5s under throttling; 10s for headroom.
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import socket; socket.create_connection(('127.0.0.1', 9191), timeout=4).close()",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "0.1"
                    memory: 64m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=questdb-exporter,environment=dev"

    # ===========================================================================
    # BOT SPAWNER
    # ===========================================================================

    fks_bot_spawner:
        build:
            context: .
            dockerfile: infrastructure/docker/services/spawner/Dockerfile
            args:
                SERVICE_PORT: "8090"
                REPO_URL: ${SPAWNER_REPO:-}
                REPO_REF: ${SPAWNER_REF:-main}
        image: nuniesmith/fks:spawner
        container_name: fks_bot_spawner
        restart: unless-stopped
        # Grant access to the bind-mounted /var/run/docker.sock. On the host the
        # socket is 0660 root:docker, so the in-container appuser (uid 1000) must
        # join the host 'docker' group GID to reach the Docker daemon. Without this
        # the spawner 500s every request with "Docker API error ... client error
        # (Connect)". The GID is host-specific — set DOCKER_GID in .env to your
        # host's `getent group docker` GID (this host: 987, also the default). `id`
        # inside the container should then list it as a supplementary group.
        group_add:
            - "${DOCKER_GID:-987}"
        ports:
            - "127.0.0.1:8090:8090"
        environment:
            - SPAWNER_HOST=0.0.0.0
            - SPAWNER_PORT=8090
            - ALLOWED_IMAGE_PREFIX=${ALLOWED_BOT_IMAGE_PREFIX:-fks-bot-}
            - MAX_CONCURRENT_BOTS=${MAX_CONCURRENT_BOTS:-20}
            # exchange_secrets encryption-at-rest. 64 hex chars (openssl rand
            # -hex 32). Unset = legacy plaintext storage (warned at startup);
            # an invalid value disables the spawner DB entirely (fail-safe).
            - SPAWNER_SECRETS_KEY=${SPAWNER_SECRETS_KEY:-}
            # Bots must join the same Docker network as janus/etc. The network is
            # pinned to `name: ${COMPOSE_PROJECT_NAME:-fks}_network` (see the networks:
            # block below), so ALLOWED_NETWORK must match that pinned name — otherwise
            # spawned bots fail with "network fks_..._network not found".
            - ALLOWED_NETWORK=${COMPOSE_PROJECT_NAME:-fks}_network
            - DEFAULT_CPU_LIMIT=${BOT_CPU_LIMIT:-1.0}
            - DEFAULT_MEMORY_LIMIT_MB=${BOT_MEMORY_MB:-512}
            - PROMETHEUS_SD_PATH=/prometheus-sd/bots.json
            - BOT_METRICS_PORT=9091
            - PRUNE_AFTER_SECS=${BOT_PRUNE_AFTER_SECS:-300}
            - PRUNE_INTERVAL_SECS=60
            - RUST_LOG=${SPAWNER_LOG_LEVEL:-info,spawner=debug}
            # Postgres persistence — writes spawn/stop/remove to bot_runs.
            # Empty/unset = stateless mode (the spawner still runs).
            # Schema: src/sql/ruby/007_spawner.sql
            - SPAWNER_DATABASE_URL=postgres://${POSTGRES_USER:-fks_user}:${POSTGRES_PASSWORD}@postgres:5432/${RUBY_DB:-ruby_db}?sslmode=disable
            # Shared secret nginx forwards on every proxied request.
            # Empty = dev mode (auth disabled).
            - NGINX_INTERNAL_TOKEN=${NGINX_INTERNAL_TOKEN:-}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - prometheus_sd:/prometheus-sd
        networks:
            - fks-network
        healthcheck:
            test:
                ["CMD-SHELL", "curl -sf http://localhost:8090/health || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256m
                reservations:
                    cpus: "0.1"
                    memory: 64m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=fks_bot_spawner,environment=dev"

    # ===========================================================================
    # DEMO BOT (opt-in — profile: demo)
    # ===========================================================================
    # The working crypto-demo paper bot, driving the janus brain end-to-end:
    #     docker compose --profile demo up crypto-demo
    # brings up janus (+ its deps) and the bot on fks-network:
    #   synthetic candles → indicators-ta features → janus brain (signal + risk
    #   over :8080) → rustrade risk gate → MockExchange (PAPER — no real orders).
    # Flip DEMO_SOURCE=kucoin|kraken for live market data; keep DEMO_EXCHANGE=mock
    # to stay paper. Metrics + /health at 127.0.0.1:9091 (fks_bot_* series).
    crypto-demo:
        profiles: ["demo"]
        build:
            context: .
            dockerfile: infrastructure/docker/services/crypto-demo/Dockerfile
            args:
                RUST_VERSION: "1.94.1"
        image: fks-bot-crypto-demo:latest
        container_name: fks_bot_crypto_demo
        user: "1000:1000"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        environment:
            - DEMO_BRAIN=${DEMO_BRAIN:-ema-cross} # local indicators-ta brain — works offline, no janus dep, trades actively. =janus uses the janus REST brain (needs janus STARTED + JANUS_HTTP_URL below)
            - DEMO_SOURCE=${DEMO_SOURCE:-synthetic} # offline random-walk demo (lively, no network/creds). =kucoin (live KuCoin futures) | =kraken (live Kraken spot) for real data
            - DEMO_EXCHANGE=${DEMO_EXCHANGE:-mock} # mock = paper; never places real orders
            # Forward REST (8180) — serves /api/v1/signals/generate + /api/v1/risk/*
            # for DEMO_BRAIN=janus. (8080 is janus_api, which lacks those routes.)
            - JANUS_HTTP_URL=${JANUS_HTTP_URL:-http://fks_janus:8180}
            - DEMO_SYMBOLS=${DEMO_SYMBOLS:-XBTUSDTM,ETHUSDTM,SOLUSDTM}
            # Live-venue credentials — EMPTY by default (paper/mock). To trade a
            # real (sub-)account: set these in .env AND flip DEMO_EXCHANGE to
            # kucoin | kraken | multi. Left empty, the bot stays on MockExchange.
            # The bot reads KuCoin creds as KC_*; we bridge them from the
            # platform-standard KUCOIN_API_* vars so .env keeps one convention.
            - KC_KEY=${KUCOIN_API_KEY:-}
            - KC_SECRET=${KUCOIN_API_SECRET:-}
            - KC_PASSPHRASE=${KUCOIN_API_PASSPHRASE:-}
            - KRAKEN_API_KEY=${KRAKEN_API_KEY:-}
            - KRAKEN_API_SECRET=${KRAKEN_API_SECRET:-}
            # Optional per-venue symbol/asset + durable-state overrides
            - DEMO_KUCOIN_SYMBOLS=${DEMO_KUCOIN_SYMBOLS:-}
            - DEMO_KRAKEN_SYMBOLS=${DEMO_KRAKEN_SYMBOLS:-}
            - DEMO_KRAKEN_BASE_ASSETS=${DEMO_KRAKEN_BASE_ASSETS:-}
            - DEMO_STATE_FILE=${DEMO_STATE_FILE:-}
            # Position sizing + risk caps — empty = paper-safe defaults (50k
            # margin, 100 max contracts). For a REAL venue set tiny in .env, e.g.
            # DEMO_MARGIN_PER_TRADE_USD=7 DEMO_LEVERAGE=1 DEMO_MAX_CONTRACTS=1
            # DEMO_MAX_POSITIONS=1 → ~1 SOLUSDTM contract (~$6.74 notional).
            - DEMO_LEVERAGE=${DEMO_LEVERAGE:-}
            - DEMO_MARGIN_PER_TRADE_USD=${DEMO_MARGIN_PER_TRADE_USD:-}
            - DEMO_MAX_CONTRACTS=${DEMO_MAX_CONTRACTS:-}
            - DEMO_MAX_POSITIONS=${DEMO_MAX_POSITIONS:-}
            - DEMO_MAX_DAILY_LOSS_USD=${DEMO_MAX_DAILY_LOSS_USD:-}
            - DEMO_MAX_GROSS_EXPOSURE_USD=${DEMO_MAX_GROSS_EXPOSURE_USD:-}
            - RUST_LOG=${BOT_RUST_LOG:-info,crypto_demo=debug}
            - RUST_BACKTRACE=1
        ports:
            - "127.0.0.1:9091:9091" # fks_bot_* metrics + /health
        networks:
            - fks-network
        depends_on:
            janus:
                condition: service_healthy
        restart: unless-stopped
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=fks_bot_crypto_demo,environment=dev"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
    questdb_data:
        driver: local
    qdrant_data:
        driver: local
    optimizer_data:
        driver: local
    prometheus_sd:
        driver: local
    loki_data:
        driver: local
    promtail_positions:
        driver: local
    alertmanager_data:
        external: true
    prometheus_data:
        external: true
    grafana_data:
        external: true

# =============================================================================
# NETWORKS
# =============================================================================
networks:
    fks-network:
        # Pin the Docker network name so it matches the spawner's ALLOWED_NETWORK
        # (`${COMPOSE_PROJECT_NAME:-fks}_network`). Without this, compose derives the
        # name from the key as `<project>_fks-network` (e.g. `fks_fks-network`), which
        # never matches `fks_network`, so spawned bots fail with "network not found".
        name: ${COMPOSE_PROJECT_NAME:-fks}_network
        driver: bridge
