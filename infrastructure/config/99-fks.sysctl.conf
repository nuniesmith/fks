# =============================================================================
# FKS — Kernel tuning (persistent across reboots)
#
# Install:
#   sudo cp infrastructure/config/99-fks.sysctl.conf /etc/sysctl.d/99-fks.conf
#   sudo sysctl --system
# =============================================================================

# ── File descriptors ─────────────────────────────────────────────────────────
# Default (65 536) is exhausted by heavily-threaded containers running many
# supervisor-managed processes (factory crash-loop being the worst offender).
# 1 M gives comfortable headroom for 17+ containers and their fd inheritance.
fs.file-max = 1048576

# ── Network tuning (Docker / nginx throughput) ────────────────────────────────
# Larger listen backlog so nginx / janus don't drop connections under load.
net.core.somaxconn = 65535

# Required by Redis (it will warn otherwise and refuse to start without this).
vm.overcommit_memory = 1

# ── Inotify (hot-reload, file watchers) ──────────────────────────────────────
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches   = 524288
