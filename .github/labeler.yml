# ─────────────────────────────────────────────────────────────────────────────
# BRANCH-BASED LABELS
# ─────────────────────────────────────────────────────────────────────────────

hotfix:
  - head-branch: ["^hotfix/", "hotfix"]

feature:
  - head-branch: ["^feature/", "^feat/"]

bugfix:
  - head-branch: ["^bugfix/", "^fix/", "^bug/"]

refactor:
  - head-branch: ["^refactor/"]

chore:
  - head-branch: ["^chore/"]

# ─────────────────────────────────────────────────────────────────────────────
# WIP (Work in Progress)
# ─────────────────────────────────────────────────────────────────────────────
# NOTE: actions/labeler v5 does not support draft PR matching.
# Use a separate workflow or branch convention for WIP detection.

wip:
  - head-branch: ["^wip/", "^WIP/", "^draft/"]
  - changed-files:
      - any-glob-to-any-file:
          - "**/*WIP*"
          - "**/*wip*"
          - "**/*.draft.*"
