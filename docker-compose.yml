# =============================================================================
# FKS — Development Environment
# Janus (Rust) trading platform
#
# Architecture:
#   janus     — Rust trading brain; native data ingestion + burn ML
#               (base/rust/Dockerfile target: workspace)
#   webui     — SvelteKit frontend (src/web/Dockerfile)
#   spawner   — Rust bot-container lifecycle service
#
# NOTE: the Python "Ruby" data/engine/trainer services were removed — janus is
# the platform now. See docs/architecture/RUST_MIGRATION.md. The only Ruby
# remnant is the ruby_db Postgres database, retained (name + schema) for the
# Bot Spawner's bot_configs/bot_runs tables (src/sql/spawner/).
#
# Postgres: two logical databases on one instance
#   - janus_db       — Janus schema (signals, regime, backtest tables)
#   - ruby_db        — Spawner schema (bot_configs, bot_runs) — legacy name
#   - Single FKS redis (custom image with kernel tuning), three DBs:
#       db 0 — janus_db + ruby (shared trading state)
#   - Single RUSTCODE redis  (Alpine, for caching)
#   - Single prometheus + grafana
#   - Trainer          GPU service
#
# Usage:
#   docker compose up -d                          # all core services
#   docker compose --profile training up -d       # + GPU trainer
#   docker compose logs -f [service]
#
# Port map (host):
# ⚠️  All ports bound to 127.0.0.1 — only reachable via localhost / tailscale serve
#
#   ── Trading Platform ──────────────────────────────────────────────────────
#   80         nginx reverse proxy
#   5432       postgres (janus_db + ruby_db)
#   6379       redis (shared — janus / ruby pub-sub + state)
#   7000       janus HTTP API
#   8200       trainer
#   8812       questdb postgres wire
#   9000       questdb HTTP console
#   9009       questdb ILP ingestion
#   9051       janus gRPC
#   9090       prometheus
#   9092       janus unified /metrics (container :9090 — brain/signals/optimizer)
#   9093       alertmanager
#   9100       node-exporter (host disk/CPU/mem — backs HostDiskSpace* alerts)
#   3001       webui (SvelteKit frontend)
#   3000       grafana (served at /grafana/ subpath via nginx)
#   3100       loki
#   6333       qdrant REST
#   6334       qdrant gRPC
#   9187       postgres-exporter
#   9121       redis-exporter
#   9191       questdb-exporter
#   16686      jaeger UI
#
#   ── Evaluation Tools ─────────────────────────────────────────────────────
# =============================================================================
services:
    # ===========================================================================
    # INFRASTRUCTURE — shared data stores
    # ===========================================================================

    postgres:
        build:
            context: .
            dockerfile: infrastructure/docker/services/postgres/Dockerfile
        image: nuniesmith/fks:postgres
        container_name: fks_postgres
        user: "postgres"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
        environment:
            - JANUS_DB=${JANUS_DB:-janus_db}
            - POSTGRES_USER=${POSTGRES_USER:-fks_user}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
            - RUBY_DB=${RUBY_DB:-ruby_db}
            - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        tmpfs:
            - /tmp
            - /run/postgresql
        networks:
            - fks-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-fks_user} -d ${JANUS_DB:-janus_db}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "2.0"
                    memory: 2g
                reservations:
                    cpus: "0.5"
                    memory: 512m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=postgres,environment=dev"

    redis:
        build:
            context: .
            dockerfile: infrastructure/docker/services/redis/Dockerfile
            target: production
        image: nuniesmith/fks:redis
        container_name: fks_redis
        user: "999:1000"
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        environment:
            - REDIS_REPLICATION_MODE=master
            - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis_data:/data
        tmpfs:
            - /tmp
            - /var/run
        networks:
            - fks-network
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - "900 1"
            - --save
            - "300 10"
            - --save
            - "60 10000"
            - --maxmemory
            - "512mb"
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 5s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 512m
                reservations:
                    cpus: "0.25"
                    memory: 128m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=redis,environment=dev"

    questdb:
        # ⚠️  HTTP console (9000) and ILP (9009) are unauthenticated by default.
        #    Restrict via nginx in production — do not expose to public internet.
        # Config is baked into the image via infrastructure/docker/services/questdb/Dockerfile.
        # Rebuild with: docker compose build questdb
        build:
            context: .
            dockerfile: infrastructure/docker/services/questdb/Dockerfile
        image: nuniesmith/fks:questdb
        container_name: fks_questdb
        security_opt:
            - no-new-privileges:true
        environment:
            - QDB_TELEMETRY_ENABLED=false
            - QDB_LOG_W_STDOUT_LEVEL=INFO
            - QDB_PG_ENABLED=true
            - QDB_HTTP_ENABLED=true
            - QDB_HTTP_SECURITY_ENABLED=${QDB_HTTP_SECURITY_ENABLED:-false}
            - QDB_LINE_TCP_ENABLED=true
            - QDB_SHARED_WORKER_COUNT=2
            - QDB_CAIRO_COMMIT_LAG=10000
            - QDB_METRICS_ENABLED=true
            - QDB_PG_USER=${QUESTDB_PG_USER:-admin}
            - QDB_PG_PASSWORD=${QUESTDB_PG_PASSWORD:?QUESTDB_PG_PASSWORD is required (no default — set in .env)}
        ports:
            - "127.0.0.1:9000:9000" # HTTP console
            - "127.0.0.1:9009:9009" # ILP ingestion
            - "127.0.0.1:8812:8812" # PostgreSQL wire
            - "127.0.0.1:9003:9003" # Prometheus metrics
        volumes:
            - questdb_data:/var/lib/questdb
        # NOTE: do NOT tmpfs /tmp here. Docker tmpfs mounts default to `noexec`,
        # but QuestDB extracts its native libquestdb*.so to java.io.tmpdir (/tmp)
        # and mmaps it with PROT_EXEC at boot. A noexec /tmp makes that fail with
        # "UnsatisfiedLinkError: ... failed to map segment from shared object" and
        # the container crash-loops. The container's overlay /tmp is exec-able.
        networks:
            - fks-network
        restart: unless-stopped
        # The QuestDB image ships no curl/wget (and dash has no /dev/tcp), so an
        # HTTP probe can't run inside the container — `curl` here failed with
        # "curl: not found" forever, marking questdb unhealthy even though it was
        # serving fine. Instead, check that the min HTTP server (health + metrics)
        # is listening on :9003 via /proc/net/tcp (9003 == 0x232B). It only binds
        # once QuestDB is fully started, so it's a valid readiness signal, and it
        # needs nothing but grep. Requires http.min.enabled=true (see server.conf).
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "grep -q ':232B' /proc/net/tcp /proc/net/tcp6 2>/dev/null || exit 1",
                ]
            interval: 10s
            timeout: 8s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "2.0"
                    memory: 2g
                reservations:
                    cpus: "0.5"
                    memory: 512m
        logging:
            driver: "json-file"
            options:
                max-size: "20m"
                max-file: "3"
                labels: "service=questdb,environment=dev"

    qdrant:
        # Planned use: embedding storage for semantic regime analysis and journal search.
        # Config is baked into the image via infrastructure/docker/services/qdrant/Dockerfile.
        # Rebuild with: docker compose build qdrant
        build:
            context: .
            dockerfile: infrastructure/docker/services/qdrant/Dockerfile
        image: nuniesmith/fks:qdrant
        container_name: fks_qdrant
        #profiles: ["qdrant"]
        security_opt:
            - no-new-privileges:true
        ports:
            - "127.0.0.1:6333:6333" # REST
            - "127.0.0.1:6334:6334" # gRPC
        volumes:
            - qdrant_data:/qdrant/storage
        tmpfs:
            - /tmp
        networks:
            - fks-network
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1g
                reservations:
                    cpus: "0.25"
                    memory: 256m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=qdrant,environment=dev"

    # ===========================================================================
    # JANUS — Rust trading brain
    # ===========================================================================

    janus:
        build:
            context: .
            dockerfile: infrastructure/docker/base/rust/Dockerfile
            target: workspace
            args:
                SERVICE_NAME: janus
                RUST_VERSION: "1.94.1"
                # Janus has no in-tree copy — always clone (override REF for a branch/tag).
                REPO_URL: ${JANUS_REPO:-https://github.com/nuniesmith/janus}
                REPO_REF: ${JANUS_REF:-main}
        image: nuniesmith/fks:janus
        container_name: fks_janus
        user: "1000:1000"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        environment:
            - EXECUTION_MODE=${EXECUTION_MODE:-paper_trading}
            - QUESTDB_ILP_PORT=9009
            - DATA_SOURCE=${DATA_SOURCE:-live}
            - DATA_EXCHANGE=${DATA_EXCHANGE:-binance}
            - DATA_WS_URL=${DATA_WS_URL:-wss://stream.binance.com:9443/ws}
            - DATA_KLINE_INTERVALS=${DATA_KLINE_INTERVALS:-1m,5m}
            - DATA_RECONNECT_DELAY_SECS=${DATA_RECONNECT_DELAY_SECS:-5}
            - DATA_MAX_RECONNECT_ATTEMPTS=${DATA_MAX_RECONNECT_ATTEMPTS:-50}
            - DATA_HEALTH_POLL_SECS=${DATA_HEALTH_POLL_SECS:-10}
            # Closed klines → QuestDB candles_crypto (WebUI chart history).
            # Default on; off-switch for stacks that run the standalone
            # data-factory writer instead (avoid double-writing).
            - DATA_PERSIST_CANDLES=${DATA_PERSIST_CANDLES:-true}
            - ENABLE_BRAIN_RUNTIME=${ENABLE_BRAIN_RUNTIME:-true}
            # Start processing services (ingestion/forward/backward) on boot;
            # otherwise janus idles in STANDBY until POST /api/services/start.
            # Read by bin/janus/src/main.rs. (Was documented in .env.example but
            # never forwarded here — setting it in .env previously did nothing.)
            - JANUS_AUTO_START=${JANUS_AUTO_START:-false}
            - BRAIN_WIRE_KILL_SWITCH=${BRAIN_WIRE_KILL_SWITCH:-false}
            - BRAIN_AUTO_START_WATCHDOG=${BRAIN_AUTO_START_WATCHDOG:-true}
            - BRAIN_HEARTBEAT_MS=${BRAIN_HEARTBEAT_MS:-5000}
            - BRAIN_WATCHDOG_CHECK_INTERVAL_MS=${BRAIN_WATCHDOG_CHECK_INTERVAL_MS:-5000}
            - BRAIN_WATCHDOG_DEAD_THRESHOLD=${BRAIN_WATCHDOG_DEAD_THRESHOLD:-10}
            # Bearer token protecting the brain kill-switch / affinity-reset
            # endpoints. UNSET = fail-OPEN (those endpoints are unauthenticated).
            # Set BRAIN_API_TOKEN in .env to require auth. Empty default keeps
            # current behaviour so this passthrough is a no-op until you opt in.
            - BRAIN_API_TOKEN=${BRAIN_API_TOKEN:-}
            - RUST_LOG=info,janus=debug,sqlx=debug,janus_backward=debug
            - RUST_BACKTRACE=1
            - JANUS_CONFIG_PATH=/app/config/janus.toml
            - JANUS_ENABLE_BACKWARD=${JANUS_ENABLE_BACKWARD:-true}
            - ENABLE_EXECUTION=${ENABLE_EXECUTION:-false}
            # Portfolio risk enforcement (janus forward). Defaults ON: a
            # RiskManager rejection blocks the order submit. Set to 0 only to
            # make risk checks advisory (not recommended with live execution).
            - JANUS_RISK_ENFORCE=${JANUS_RISK_ENFORCE:-1}
            - EXECUTION_ENDPOINT=${EXECUTION_ENDPOINT:-http://janus-execution:50052}
            - EXECUTION_CONNECT_TIMEOUT=${EXECUTION_CONNECT_TIMEOUT:-10}
            - EXECUTION_REQUEST_TIMEOUT=${EXECUTION_REQUEST_TIMEOUT:-30}
            - EXECUTION_MAX_RETRIES=${EXECUTION_MAX_RETRIES:-3}
            - EXECUTION_RETRY_BACKOFF_MS=${EXECUTION_RETRY_BACKOFF_MS:-100}
            - EXECUTION_DEFAULT_QUANTITY=${EXECUTION_DEFAULT_QUANTITY:-0.001}
            - EXECUTION_EXCHANGE=${EXECUTION_EXCHANGE:-kraken}
            - ALERTMANAGER_URL=${ALERTMANAGER_URL:-http://fks_alertmanager:9093}
            - EXEC_ACCOUNT_TYPE=${EXEC_ACCOUNT_TYPE:-paper}
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_USER=${POSTGRES_USER:-fks_user}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
            - JANUS_DB=${JANUS_DB:-janus_db}
            - DATABASE_URL=postgresql://${POSTGRES_USER:-fks_user}:${POSTGRES_PASSWORD}@postgres:5432/${JANUS_DB:-janus_db}?sslmode=disable
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
            - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
            # ── Experience pipeline (janus docs/architecture/EXPERIENCE_PIPELINE.md) ──
            # forward records per-candle decisions → Arrow IPC spool on /dev/shm
            # → backward ingests into Qdrant. Default OFF (same default-off
            # discipline as JANUS_RISK_ENFORCE / ENABLE_EXECUTION).
            - JANUS_EXPERIENCE_ENABLED=${JANUS_EXPERIENCE_ENABLED:-false}
            # Spool lives on this container's /dev/shm tmpfs (sized via
            # shm_size below). Forward (writer) and backward (ingester) both
            # run inside THIS one container (unified bin/janus binary), so no
            # cross-container tmpfs mount is needed.
            - JANUS_EXPERIENCE_SPOOL_DIR=${JANUS_EXPERIENCE_SPOOL_DIR:-/dev/shm/janus/experience}
            - JANUS_EXPERIENCE_BATCH_ROWS=${JANUS_EXPERIENCE_BATCH_ROWS:-256}
            - JANUS_EXPERIENCE_FLUSH_SECS=${JANUS_EXPERIENCE_FLUSH_SECS:-60}
            - JANUS_EXPERIENCE_SPOOL_MAX_MB=${JANUS_EXPERIENCE_SPOOL_MAX_MB:-256}
            # Qdrant vector store for ingested experiences — the `qdrant`
            # service above (container fks_qdrant, gRPC 6334). USE_MOCK=false:
            # if Qdrant is unreachable, ingest batches stay parked in the spool
            # instead of "persisting" to an in-memory mock that dies on restart.
            - QDRANT_URL=${QDRANT_URL:-http://fks_qdrant:6334}
            - QDRANT_USE_MOCK=${QDRANT_USE_MOCK:-false}
            - OPTIMIZER_ENABLED=${OPTIMIZER_ENABLED:-true}
            - DATA_DIR=/app/data
            - OPTIMIZER_DATA_DIR=/app/data
            - OPTIMIZER_METRICS_PORT=9092
            - OPTIMIZE_INTERVAL=${OPTIMIZE_INTERVAL:-6h}
            - OPTIMIZE_ASSETS=${OPTIMIZE_ASSETS:-BTC,ETH,SOL}
            - OPTIMIZE_TRIALS=${OPTIMIZE_TRIALS:-100}
            - OPTIMIZE_HISTORICAL_DAYS=${OPTIMIZE_HISTORICAL_DAYS:-30}
            - OPTIMIZER_INSTANCE_ID=${OPTIMIZER_INSTANCE_ID:-janus-prod}
            # The Python "Ruby" data service was removed — janus ingests market
            # data natively (DATA_SOURCE/DATA_EXCHANGE/DATA_WS_URL above). The old
            # PYTHON_DATA_SERVICE_URL + DATA_CLIENT_* fallback wiring is gone;
            # see docs/architecture/RUST_MIGRATION.md (Phase 1 cut-over).
        ports:
            - "127.0.0.1:9051:50051" # gRPC inference
            - "127.0.0.1:7000:8080" # HTTP API (main janus_api)
            - "127.0.0.1:7001:8180" # Forward REST API (brain health, affinity endpoints)
            - "127.0.0.1:7002:50052" # PositionFeedback gRPC
            - "127.0.0.1:9092:9090" # Unified /metrics (brain+signals+optimizer live on container :9090; Prometheus scrapes janus:9090)
        # /dev/shm sizing: Docker's default shm is 64 MB, but the experience
        # spool lives there and its cap (JANUS_EXPERIENCE_SPOOL_MAX_MB) defaults
        # to 256 MB — size the tmpfs comfortably above the cap so the writer's
        # drop-oldest bound, not ENOSPC, is what limits the spool.
        shm_size: "512m"
        tmpfs:
            - /tmp
            - /var/tmp
        volumes:
            - optimizer_data:/app/data
            - ./infrastructure/config/janus:/app/config:ro
        networks:
            - fks-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            questdb:
                condition: service_healthy
            qdrant:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "4.0"
                    memory: 4g
                reservations:
                    cpus: "1.0"
                    memory: 1g
        logging:
            driver: "json-file"
            options:
                max-size: "20m"
                max-file: "5"
                labels: "service=janus,environment=dev"

    webui:
        image: nuniesmith/fks:webui
        build:
            context: .
            dockerfile: infrastructure/docker/base/nodejs/Dockerfile
            args:
                APP_SRC: src/web
                # Default to cloning the standalone fks-web repo (same pattern as
                # janus's JANUS_REPO). The in-tree src/web copy is only used when
                # WEB_REPO is overridden to empty (dev convenience).
                REPO_URL: ${WEB_REPO:-https://github.com/nuniesmith/fks-web}
                REPO_REF: ${WEB_REF:-main}
        container_name: fks_webui
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # host-gateway makes host.docker.internal resolve on Linux — needed for
        # the transitional CRYPTO_*_INTERNAL_URL bridge to the systemd bots.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "127.0.0.1:3001:3000"
        environment:
            - NODE_ENV=production
            # The Ruby data API was removed; point the dashboard's API base at
            # janus. The SvelteKit app still needs a janus-native data contract —
            # tracked in docs/architecture/RUST_MIGRATION.md (WebUI repoint).
            - PUBLIC_API_URL=${PUBLIC_API_URL:-http://fks_janus:7000}
            # Crypto bot status servers for the /exchanges page. Empty default
            # = the adapter falls back to the Phase-2 container DNS names
            # (http://fks-bot-crypto-*:9091). During the transitional systemd
            # phase set these in .env to the host bridge, e.g.
            #   CRYPTO_SPOT_INTERNAL_URL=http://host.docker.internal:9091
            #   CRYPTO_FUNDING_INTERNAL_URL=http://host.docker.internal:9095
            # (funding uses 9095 on the host — 9092/9093 are taken by the
            # janus metrics remap and alertmanager).
            - CRYPTO_SPOT_INTERNAL_URL=${CRYPTO_SPOT_INTERNAL_URL:-}
            - CRYPTO_FUNDING_INTERNAL_URL=${CRYPTO_FUNDING_INTERNAL_URL:-}
            - PUBLIC_JANUS_URL=http://fks_janus:7000
            # D1 live-bars bridge: empty (default) keeps /sse/bars/:sym on the
            # graceful idle stub. Once the janus image includes the
            # /sse/bars/{symbol} endpoint (janus PR #106), set in .env:
            #   JANUS_BARS_SSE_URL=http://fks_janus:8080/sse/bars
            - JANUS_BARS_SSE_URL=${JANUS_BARS_SSE_URL:-}
            - ORIGIN=http://localhost:3001
        networks:
            - fks-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "const h=require('http');h.get('http://localhost:3000/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "0.5"

    # Build-utility image: generic GPU-enabled Rust base (CUDA runtime).
    # Used as a builder template for any Rust service that requires GPU at runtime.
    # Usage: docker compose --profile base build rust-gpu-base
    rust-gpu-base:
        image: nuniesmith/fks:rust-gpu-base
        build:
            context: .
            dockerfile: infrastructure/docker/base/rust-gpu/Dockerfile
            args:
                SERVICE_NAME: app
                SERVICE_PORT: "8080"
        profiles: ["base"]

    # ===========================================================================
    # PROXY
    # ===========================================================================

    nginx:
        build:
            context: .
            dockerfile: infrastructure/docker/services/nginx/Dockerfile
            target: production
        image: nuniesmith/fks:nginx
        container_name: fks_nginx
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
        ports:
            - "127.0.0.1:80:80"
        environment:
            - API_KEY=${API_KEY:-}
            - NGINX_INTERNAL_TOKEN=${NGINX_INTERNAL_TOKEN:-}
        volumes:
            - /dev/null:/etc/nginx/conf.d/default.conf:ro
        networks:
            - fks-network
        depends_on:
            janus:
                condition: service_started
            grafana:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1",
                ]
            interval: 30s
            timeout: 5s
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512m
        logging:
            driver: "json-file"
            options:
                max-size: "20m"
                max-file: "5"
                labels: "service=nginx,environment=dev"

    # ===========================================================================
    # MONITORING
    # ===========================================================================

    prometheus:
        build:
            context: .
            dockerfile: infrastructure/docker/services/prometheus/Dockerfile
        image: nuniesmith/fks:prometheus
        container_name: fks_prometheus
        user: "nobody"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        # host-gateway makes host.docker.internal resolve on Linux — needed by
        # the fks-bots-transitional scrape job (systemd crypto bots on the host).
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "127.0.0.1:9090:9090"
        volumes:
            - prometheus_data:/prometheus
            - prometheus_sd:/etc/prometheus/sd
        tmpfs:
            - /tmp
        networks:
            - fks-network
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
            - "--web.enable-lifecycle"
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1g
                reservations:
                    cpus: "0.25"
                    memory: 256m
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
                labels: "service=prometheus,environment=dev"

