# QuestDB server configuration
# https://questdb.io/docs/reference/configuration/

http.port=9000
http.min.enabled=false

# Prometheus metrics
metrics.enabled=true
metrics.http.port=9003

# Line protocol (ILP) ingestion
line.tcp.enabled=true
line.tcp.net.bind.to=0.0.0.0:9009

# Shared worker count (tune to your CPU count)
shared.worker.count=2

# WAL
wal.enabled.default=true

# Storage root — matches the volume mount in docker-compose
cairo.root=/var/lib/questdb/db
