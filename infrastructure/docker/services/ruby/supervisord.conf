; =============================================================================
; fks_ruby — Supervisord Configuration
; Manages the data API (FastAPI, :8000) and the web API (FastAPI, :8080)
; inside a single Docker container.
;
; Process startup order: data (10) → web (30). All auto-restart on failure.
; The data service is the source of truth consumed by Janus; the container
; healthcheck targets it on :8000.
;
; Module paths assume the code is copied to /app/src (compose build arg
; APP_SRC=src/ruby/src) and PYTHONPATH=/app/src, so packages import as
; top-level: `services.data.main`, `web.app`, `from core…`.
;
; Usage:
;   supervisorctl status          # check process status
;   supervisorctl restart data    # restart a single process
;   supervisorctl tail -f data    # follow logs
; =============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/fks
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── Data Service (FastAPI REST + SSE + Execution Gate) ────────────────────────
; Primary HTTP API on port 8000. The container healthcheck targets this.
[program:data]
command=/app/venv/bin/python -m services.data.main
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=10
priority=10
stdout_logfile=/var/log/fks/data.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/fks/data.err
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PYTHONPATH="/app/src",PYTHONUNBUFFERED="1",PATH="/app/venv/bin:%(ENV_PATH)s"

; ── Web Dashboard API (FastAPI JSON backend) ──────────────────────────────────
; Uvicorn on port 8080. Proxies API calls to data (localhost:8000).
[program:web]
command=/app/venv/bin/uvicorn web.app:app --host 0.0.0.0 --port 8080 --log-level info
directory=/app/src
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=30
stdout_logfile=/var/log/fks/web.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/fks/web.err
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PYTHONPATH="/app/src",PYTHONUNBUFFERED="1",PATH="/app/venv/bin:%(ENV_PATH)s"

