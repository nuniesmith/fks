# Prometheus Alert Rules for Technical Indicators Service
# FKS Market Data Pipeline - Week 2

groups:
    - name: technical-indicators
      rules:
          # ========================================================================
          # CRITICAL - Indicator calculation failures
          # ========================================================================
          # Removed IndicatorCalculationHalted + IndicatorCalculationLatencyHigh
          # (2026-07-01): data_factory_indicators_calculated_total /
          # data_factory_trades_ingested_total / the calculation-duration
          # histogram are set only by the IndicatorActor pipeline, which is not
          # instantiated in the unified janus binary's live path — the metrics
          # are never exported, so these alerts could never evaluate.

          # ========================================================================
          # WARNING - Performance degradation
          # ========================================================================

          - alert: IndicatorWarmupStalled
            expr: |
                data_factory_indicator_warmup_candles > 0
                and data_factory_indicator_warmup_candles < 200
                and increase(data_factory_indicator_warmup_candles[30m]) == 0
            for: 30m
            labels:
                severity: warning
                component: indicator-actor
            annotations:
                summary: "Indicator warmup has stalled"
                description: "Indicator warmup has {{ $value }} candles but hasn't progressed in 30 minutes. Indicators require 200 candles for full warmup (EMA-200)."
                runbook_url: "https://docs.fks.io/runbooks/indicator-warmup-stalled"

          # Removed IndicatorCalculationLatencyElevated +
          # IndicatorCalculationRateDrop (2026-07-01): same never-exported
          # IndicatorActor metrics as the critical group above.

          - alert: NoIndicatorPairsTracked
            # `and max_over_time(...) > 0` guard: the IndicatorActor is not
            # instantiated in the unified janus binary's live path (services/data
            # run_live_mode spawns ingestion only; the Router→IndicatorActor
            # pipeline that sets this gauge is legacy standalone-binary code), so
            # data_factory_indicator_pairs_tracked is a hard zero here. Only alert
            # on a genuine drop-to-zero (was tracking pairs in the last hour, now
            # 0); this stays dormant until the actor is wired into the live path.
            expr: |
                data_factory_indicator_pairs_tracked == 0
                and max_over_time(data_factory_indicator_pairs_tracked[1h]) > 0
            for: 5m
            labels:
                severity: warning
                component: indicator-actor
            annotations:
                summary: "No symbol/timeframe pairs are being tracked for indicators"
                description: "The IndicatorActor is not tracking any symbol/timeframe pairs. This suggests no candle data is being received."
                runbook_url: "https://docs.fks.io/runbooks/no-indicator-pairs"

          # ========================================================================
          # INFO - Operational notices
          # ========================================================================

          - alert: IndicatorWarmupInProgress
            expr: |
                data_factory_indicator_warmup_candles > 0
                and data_factory_indicator_warmup_candles < 200
                and increase(data_factory_indicator_warmup_candles[5m]) > 0
            for: 1m
            labels:
                severity: info
                component: indicator-actor
            annotations:
                summary: "Indicator warmup in progress"
                description: "Indicators are warming up: {{ $value }} / 200 candles processed. EMA-200 and other long-period indicators will be available after warmup completes."

          - alert: IndicatorWarmupComplete
            expr: |
                data_factory_indicator_warmup_candles >= 200
                and increase(data_factory_indicator_warmup_candles[5m]) > 0
            for: 1m
            labels:
                severity: info
                component: indicator-actor
            annotations:
                summary: "Indicator warmup complete"
                description: "All indicators including EMA-200 are now fully warmed up and producing values."

          - alert: NewIndicatorPairAdded
            expr: |
                increase(data_factory_indicator_pairs_tracked[5m]) > 0
            for: 1m
            labels:
                severity: info
                component: indicator-actor
            annotations:
                summary: "New indicator pair added"
                description: "A new symbol/timeframe pair is now being tracked. Total pairs: {{ $value }}."

          # ========================================================================
          # SLO / Error Budget Alerts
          # ========================================================================
          # Removed IndicatorSLOBurnRateCritical + IndicatorSLOBurnRateWarning
          # (2026-07-01): the indicator calculation-duration histogram is never
          # exported in the live path (IndicatorActor not instantiated), so the
          # burn-rate expressions had no data to evaluate.

          # ========================================================================
          # Trading Signal Alerts (from QuestDB indicator values)
          # These require the QuestDB data source in Prometheus/Grafana
          # ========================================================================

          # Note: These are placeholder examples - in production, you would use
          # a recording rule or external service to evaluate indicator values
          # and expose them as Prometheus metrics.

          # - alert: RSIOverboughtCondition
          #   expr: |
          #     fks_indicator_rsi_14{symbol=~"BTC-USDT|ETH-USDT"} > 80
          #   for: 15m
          #   labels:
          #     severity: info
          #     component: trading-signals
          #   annotations:
          #     summary: "RSI overbought condition detected"
          #     description: "{{ $labels.symbol }} RSI is {{ $value | printf \"%.1f\" }}, indicating overbought conditions."

          # - alert: RSIOversoldCondition
          #   expr: |
          #     fks_indicator_rsi_14{symbol=~"BTC-USDT|ETH-USDT"} < 20
          #   for: 15m
          #   labels:
          #     severity: info
          #     component: trading-signals
          #   annotations:
          #     summary: "RSI oversold condition detected"
          #     description: "{{ $labels.symbol }} RSI is {{ $value | printf \"%.1f\" }}, indicating oversold conditions."

    # ============================================================================
    # Signal Generation Alerts
    # ============================================================================

    - name: trading-signals
      rules:
          # ========================================================================
          # CRITICAL - Signal generation failures
          # ========================================================================

          # Repointed (2026-07-01): data_factory_signals_generated_total was
          # never exported (SignalActor not instantiated in the live path);
          # janus_signals_generated_total is the live counter, with labels
          # signal_type ∈ buy|sell|hold|close, symbol, module. Gated on
          # trades_ingested_total so standby mode (no data flowing) doesn't
          # false-fire.
          - alert: SignalGenerationHalted
            expr: |
                sum(rate(janus_signals_generated_total[10m])) == 0
                and sum(rate(trades_ingested_total[10m])) > 0
            for: 10m
            labels:
                severity: critical
                component: signal-actor
            annotations:
                summary: "Signal generation has stopped"
                description: "No signals generated in the last 10 minutes despite active market-data ingestion. The forward signal loop may have crashed or stalled."
                runbook_url: "https://docs.fks.io/runbooks/signal-generation-halted"

          # ========================================================================
          # WARNING - Anomalous signal patterns
          # ========================================================================

          - alert: UnusuallyHighSignalRate
            # Repointed to the live janus counter (see note above).
            expr: |
                sum(rate(janus_signals_generated_total[5m])) > 10
            for: 5m
            labels:
                severity: warning
                component: signal-actor
            annotations:
                summary: "Signal generation rate is unusually high"
                description: 'Generating {{ $value | printf "%.1f" }} signals/sec. This may indicate volatile market conditions or a detection bug.'
                runbook_url: "https://docs.fks.io/runbooks/high-signal-rate"

          # The 8 pattern-specific notification alerts (Bullish/Bearish
          # confluence, EMA golden/death cross, RSI overbought/oversold, MACD
          # crosses) were removed 2026-07-01: they matched signal_type values
          # ("bullish_confluence", "ema_golden_cross", …) that only the
          # never-instantiated SignalActor emitted. The live counter's
          # signal_type values are buy|sell|hold|close, so they were collapsed
          # into two direction notifications, BuySignalGenerated and
          # SellSignalGenerated.
          #
          # THOSE TWO ARE NOW GONE AS WELL (2026-08-24). A signal is a FEED, not
          # an incident, and alerting on every one of them was actively harmful:
          # over the 7d to 2026-08-24 they were 112,971 + 34,926 of 187,339
          # total firing samples — 78.9% of ALL alert volume on the platform,
          # every sample severity=info with for:0m. They buried the alerts that
          # matter. On the operator's own inbox screenshot, two of the five
          # visible rows were SellSignalGenerated while a CRITICAL
          # BotHighDrawdown (-$630.70) sat fourth.
          #
          # NOTHING IS LOST BY REMOVING THEM. Prometheus rules do not create
          # metrics: janus_signals_generated_total is emitted by janus and is
          # unaffected, /signals renders the live feed from janus directly, and
          # the PATHOLOGICAL case — a signal storm, which genuinely is an
          # incident — is still covered by UnusuallyHighSignalRate above.
          #
          # Do not "restore the buy/sell notifications". If per-signal delivery
          # is wanted, it belongs on a notification channel (the spawner's
          # Discord dispatch), not in the alerting path that pages the operator.

          # ========================================================================
          # Performance / Health
          # ========================================================================

          - alert: SignalStorageErrors
            # Repointed: questdb_write_errors_total{table=...} is not an
            # exported metric/label; questdb_unhandled_errors_total is the live
            # error counter (no per-table label available).
            expr: |
                increase(questdb_unhandled_errors_total[5m]) > 0
            for: 5m
            labels:
                severity: warning
                component: signal-actor
            annotations:
                summary: "Errors storing signals to QuestDB"
                description: "{{ $value }} errors writing signals to QuestDB in the last 5 minutes. Signals may be lost."
                runbook_url: "https://docs.fks.io/runbooks/signal-storage-errors"
