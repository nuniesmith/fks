# Prometheus Configuration for FKS Trading Platform
# Scrapes metrics from FKS services and database exporters

global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
    external_labels:
        cluster: "fks-local"
        environment: "development"

# AlertManager configuration
alerting:
    alertmanagers:
        - static_configs:
              - targets:
                    - alertmanager:9093
          timeout: 10s

# Load alert rules
rule_files:
    - "/etc/prometheus/alerts/*.yml"

# Scrape configurations
scrape_configs:
    # ============================================================================
    # Prometheus self-monitoring
    # ============================================================================
    - job_name: "prometheus"
      static_configs:
          - targets: ["localhost:9090"]
            labels:
                service: "prometheus"

    # ============================================================================
    # FKS Janus Service (unified: signals, execution, optimizer)
    #
    # The janus container exposes a single /metrics endpoint on port 9090
    # that aggregates metrics from all internal modules (forward, backward,
    # data, cns, api, optimizer, execution).  Previous separate targets for
    # "fks-execution" and "fks-optimizer" have been merged here since those
    # components now run inside the unified janus binary.
    # ============================================================================
    - job_name: "fks-janus"
      scrape_interval: 10s
      scrape_timeout: 5s
      metrics_path: "/metrics"
      static_configs:
          - targets: ["janus:9090"]
            labels:
                service: "janus"
                component: "signals"

    # ============================================================================
    # PostgreSQL Exporter - Database metrics
    # ============================================================================
    - job_name: "postgres"
      scrape_interval: 30s
      scrape_timeout: 10s
      static_configs:
          - targets: ["postgres-exporter:9187"]
            labels:
                service: "postgres"
                component: "database"

    # ============================================================================
    # Redis Exporter - Cache and Pub/Sub metrics
    # ============================================================================
    - job_name: "redis"
      scrape_interval: 15s
      scrape_timeout: 5s
      static_configs:
          - targets: ["redis-exporter:9121"]
            labels:
                service: "redis"
                component: "cache"

    # ============================================================================
    # Node Exporter - Host disk/CPU/memory (backs HostDiskSpace* alerts)
    # ============================================================================
    - job_name: "node-exporter"
      scrape_interval: 30s
      scrape_timeout: 10s
      static_configs:
          - targets: ["node-exporter:9100"]
            labels:
                service: "node-exporter"
                component: "host"

    # ============================================================================
    # QuestDB Direct - Native metrics endpoint
    # NOTE: The questdb-exporter sidecar (port 9191) is not deployed.  QuestDB
    # exposes Prometheus-compatible metrics natively at :9003/metrics.
    # The QuestDBDown alert uses job=~"questdb.*" which matches this job.
    # ============================================================================
    - job_name: "questdb-direct"
      scrape_interval: 30s
      scrape_timeout: 10s
      metrics_path: "/metrics"
      static_configs:
          - targets: ["questdb:9003"]
            labels:
                service: "questdb"
                component: "timeseries"

    # ============================================================================
    # Charting Service - Nginx static asset server for TradingView charts
    # ============================================================================
    # charting — static nginx file server, no /metrics endpoint
    # Disabled: fks_charting:8003 serves TradingView HTML, not Prometheus metrics.
    # - job_name: "charting"
    #   scrape_interval: 30s
    #   scrape_timeout: 10s
    #   metrics_path: "/metrics"
    #   static_configs:
    #       - targets: ["fks_charting:8003"]
    #         labels:
    #             service: "charting"
    #             component: "charts"

    # ============================================================================
    # FKS Bot Spawner — spawner service self-metrics
    #
    # Exposes Prometheus text-format metrics at /metrics including:
    #   fks_spawner_spawns_total, fks_spawner_spawn_errors_total,
    #   fks_spawner_stops_total, fks_spawner_removes_total,
    #   fks_spawner_running_bots, fks_spawner_spawn_duration_seconds
    # ============================================================================
    - job_name: "fks-spawner"
      scrape_interval: 15s
      scrape_timeout: 5s
      metrics_path: "/metrics"
      static_configs:
          - targets: ["fks_bot_spawner:8090"]
            labels:
                service: "fks-spawner"
                component: "bot-lifecycle"

    # NOTE: the "fks-bots-transitional" job (host systemd bots on
    # host.docker.internal:9091/9095) was removed 2026-07-13 — both bots are
    # spawner-managed containers now, discovered via the file_sd in the
    # fks-spawner job above; the desktop systemd units are disabled.

    # ============================================================================
    # FKS Bot Containers — dynamic file-based service discovery
    #
    # The spawner writes /prometheus-sd/bots.json on every spawn/stop.
    # Prometheus picks up new bot targets automatically without a reload.
    # Each bot container exposes :9091/metrics with:
    #   fks_bot_pnl_dollars        current P&L
    #   fks_bot_signals_total      cumulative signals (counter)
    #   fks_bot_trades_total       cumulative trades  (counter)
    #   fks_bot_win_rate           win rate 0.0–1.0
    #   fks_bot_uptime_seconds     seconds since container start
    #
    # Volume mount required in docker-compose.yml:
    #   prometheus: prometheus_sd:/etc/prometheus/sd
    #   spawner:    prometheus_sd:/prometheus-sd
    # ============================================================================
    - job_name: "fks-bots"
      scrape_interval: 30s
      scrape_timeout: 10s
      metrics_path: "/metrics"
      file_sd_configs:
          - files:
                - "/etc/prometheus/sd/bots.json"
            refresh_interval: 30s
      relabel_configs:
          # Preserve bot metadata as human-readable labels
          - source_labels: [__meta_fks_image]
            target_label: image
          - source_labels: [bot_id]
            target_label: bot_id
          - source_labels: [mode]
            target_label: mode
          - source_labels: [container_name]
            target_label: container_name

    # ============================================================================
    # FKS Bot MONEY-PATH metrics — the armed-path telemetry (M2 arming-safety)
    #
    # The funding bot (fks-state bots/crypto-futures) exports a SECOND, money-path
    # metrics endpoint on :9092 (BOT_RISK_METRICS_PORT) — halt / breaker / fill /
    # resting-stop / order-error / funding series that the shared :9091 contract
    # (crypto-bot-core) does NOT expose. This job reuses the SAME spawner file_sd
    # but is SCOPED so it never produces down-target noise:
    #   • keep mode="live" OR mode="paper" targets, AND
    #   • keep only funding-bot images (only that bot serves :9092),
    # then rewrites the target port :9091 → :9092 (same container, reachable
    # container-to-container on fks_network — no publish/EXPOSE needed).
    #
    # WIDENED 2026-08-22 to include mode="paper". It was live-only, which meant
    # the PAPER bot's halt/breaker gauges were served but never scraped — so a
    # daily-loss halt during a paper measurement window would fire INVISIBLY.
    # That matters because a halt suppresses entries for the rest of the UTC day,
    # making an unrecorded halt an unrecorded SELECTION EFFECT on the trade
    # population a Gate-B verdict is computed over. 2026-08-21 closed at
    # −442.47 USDT against a ≈−500/day halt: 58 USDT of margin.
    #
    # Widening this is SAFE because the armed-path.yml rules are guarded by their
    # own `mode="live"` expression selectors — all 8 of them, verified — not by
    # this scrape scoping. The scoping was defence-in-depth, not the guard.
    # INVARIANT FOR FUTURE RULES: any rule in armed-path.yml MUST carry
    # mode="live" in its expr, or it will now also fire on the paper twin.
    #
    # The `mode`/`bot_id`/`container_name` labels are relabeled identically to the
    # fks-bots job so the rules read the same labels.
    # ============================================================================
    - job_name: "fks-bots-risk"
      scrape_interval: 30s
      scrape_timeout: 10s
      metrics_path: "/metrics"
      file_sd_configs:
          - files:
                - "/etc/prometheus/sd/bots.json"
            refresh_interval: 30s
      relabel_configs:
          - source_labels: [__meta_fks_image]
            target_label: image
          - source_labels: [bot_id]
            target_label: bot_id
          - source_labels: [mode]
            target_label: mode
          - source_labels: [container_name]
            target_label: container_name
          # Scope: live AND paper funding targets (widened 2026-08-22 — see the
          # note above). The armed-path rules are guarded by their own
          # mode="live" expression selectors, NOT by this scrape scoping.
          - source_labels: [mode]
            regex: "live|paper"
            action: keep
          # … and only the funding bot (the only bot serving :9092).
          - source_labels: [__meta_fks_image]
            regex: ".*funding.*"
            action: keep
          # Point the scrape at the money-path port on the same container.
          - source_labels: [__address__]
            regex: "([^:]+):[0-9]+"
            target_label: __address__
            replacement: "${1}:9092"
