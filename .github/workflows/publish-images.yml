name: Build and push images

# Prebuilds every FKS service image and pushes it to GHCR, so the oryx host
# only ever *pulls* — no more compiling 20 images over SSH (the crypto-bot
# pattern). The fks-deploy workflow pulls these tags on every deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: postgres
            dockerfile: infrastructure/docker/services/postgres/Dockerfile
          - service: redis
            dockerfile: infrastructure/docker/services/redis/Dockerfile
            target: production
          - service: questdb
            dockerfile: infrastructure/docker/services/questdb/Dockerfile
          - service: qdrant
            dockerfile: infrastructure/docker/services/qdrant/Dockerfile
          - service: janus
            dockerfile: infrastructure/docker/base/rust/Dockerfile
            target: workspace
            args: |
              SERVICE_NAME=janus
              RUST_VERSION=1.94.1
              REPO_URL=https://github.com/nuniesmith/janus
              REPO_REF=main
          - service: webui
            dockerfile: infrastructure/docker/base/nodejs/Dockerfile
            args: |
              APP_SRC=src/web
              REPO_URL=https://github.com/nuniesmith/fks-web
              REPO_REF=main
          - service: docs
            dockerfile: infrastructure/docker/services/docs/Dockerfile
          - service: nginx
            dockerfile: infrastructure/docker/services/nginx/Dockerfile
            target: production
          - service: prometheus
            dockerfile: infrastructure/docker/services/prometheus/Dockerfile
          - service: grafana
            dockerfile: infrastructure/docker/services/grafana/Dockerfile
          - service: loki
            dockerfile: infrastructure/docker/services/loki/Dockerfile
          - service: promtail
            dockerfile: infrastructure/docker/services/promtail/Dockerfile
          - service: alertmanager
            dockerfile: infrastructure/docker/services/alertmanager/Dockerfile
          - service: alertmanager-discord
            dockerfile: infrastructure/docker/services/alertmanager-discord/Dockerfile
          - service: jaeger
            dockerfile: infrastructure/docker/services/jaeger/Dockerfile
          - service: postgres-exporter
            dockerfile: infrastructure/docker/services/postgres-exporter/Dockerfile
          - service: redis-exporter
            dockerfile: infrastructure/docker/services/redis-exporter/Dockerfile
          - service: questdb-exporter
            dockerfile: infrastructure/docker/services/questdb-exporter/Dockerfile
          - service: fks_bot_spawner
            dockerfile: infrastructure/docker/services/spawner/Dockerfile
            args: |
              SERVICE_PORT=8090
              REPO_URL=https://github.com/nuniesmith/fks-spawner
              REPO_REF=main
          - service: botsync
            dockerfile: ./botsync/Dockerfile
          - service: janus-bridge
            dockerfile: infrastructure/docker/services/janus-bridge/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nuniesmith/fks-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Render alertmanager.yml from template
        if: matrix.service == 'alertmanager'
        run: |
          # The Dockerfile COPYs infrastructure/config/alertmanager/alertmanager.yml,
          # which is generated from the .tmpl at deploy time. The template carries
          # no secrets (webhook URLs live on the alertmanager-discord sidecar's env),
          # so rendering it here is safe.
          cp infrastructure/config/alertmanager/alertmanager.yml.tmpl \
             infrastructure/config/alertmanager/alertmanager.yml

      - name: Build and push fks-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.args || '' }}

  # Merges reach oryx on their own. The FKS deploy (nuniesmith/oryx
  # fks-deploy.yml) pulls these tags, runs botsync and restarts what changed,
  # but it only ran when someone dispatched it, so a merged change sat
  # unused until then. This starts it once EVERY image above built and
  # pushed: a failed image skips the deploy rather than shipping a mix.
  #
  # A docs-only merge doesn't restart the trading stack.
  #
  # ORYX_DEPLOY_TOKEN is a fine-grained PAT with Actions: write on
  # nuniesmith/oryx; GITHUB_TOKEN cannot start a workflow in another
  # repository. A missing token FAILS this job rather than skipping it: a
  # silent skip is a deploy that never happened, reported as green.
  deploy:
    name: Roll out on oryx
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Skip a docs-only change
        id: changes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            exit 0  # nothing to compare against: deploy
          fi
          files=$(gh api "repos/${{ github.repository }}/compare/$BEFORE...${{ github.sha }}" --jq '.files[].filename')
          code=$(printf '%s\n' "$files" | grep -vE '^docs/|\.md$' || true)
          if [ -n "$files" ] && [ -z "$code" ]; then
            echo "only_docs=true" >> "$GITHUB_OUTPUT"
            echo "Only docs changed: no deploy"
          fi
      - name: Roll the new images out on oryx
        if: steps.changes.outputs.only_docs != 'true'
        env:
          GH_TOKEN: ${{ secrets.ORYX_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ORYX_DEPLOY_TOKEN is not set, so oryx keeps running the previous FKS images"
            exit 1
          fi
          gh workflow run fks-deploy.yml --repo nuniesmith/oryx
          echo "Requested: ${{ github.server_url }}/nuniesmith/oryx/actions/workflows/fks-deploy.yml"
