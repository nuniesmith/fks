syntax = "proto3";

package fks.cns.v1;

option go_package = "github.com/nuniesmith/fks/proto/fks/cns/v1;cnsv1";
option java_multiple_files = true;
option java_package = "xyz.fkstrading.proto.cns.v1";

// CNS Service - Central Nervous System for JANUS
// Provides health monitoring, metrics collection, and auto-recovery for the trading system
service CNSService {
  // Get overall system health
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  // Get detailed health for specific components
  rpc GetDetailedHealth(GetDetailedHealthRequest) returns (GetDetailedHealthResponse);

  // Get neuromorphic brain status
  rpc GetBrainStatus(GetBrainStatusRequest) returns (GetBrainStatusResponse);

  // Get brain region statuses
  rpc GetBrainRegions(GetBrainRegionsRequest) returns (GetBrainRegionsResponse);

  // Stream health updates
  rpc StreamHealth(StreamHealthRequest) returns (stream StreamHealthResponse);

  // Get metrics snapshot
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);

  // Trigger immediate health check
  rpc TriggerHealthCheck(TriggerHealthCheckRequest) returns (TriggerHealthCheckResponse);

  // Get alert history
  rpc GetAlerts(GetAlertsRequest) returns (GetAlertsResponse);

  // Acknowledge an alert
  rpc AcknowledgeAlert(AcknowledgeAlertRequest) returns (AcknowledgeAlertResponse);

  // Get reflex (auto-recovery) status
  rpc GetReflexStatus(GetReflexStatusRequest) returns (GetReflexStatusResponse);

  // Enable/disable auto-recovery reflexes
  rpc SetReflexEnabled(SetReflexEnabledRequest) returns (SetReflexEnabledResponse);

  // Get service information
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);
}

// ============================================================================
// Health Requests/Responses
// ============================================================================

message GetHealthRequest {
  // Optional: filter for specific components
  repeated ComponentType components = 1;
  // Include detailed metadata
  bool include_metadata = 2;
}

message GetHealthResponse {
  // Health signal
  HealthSignal signal = 1;
  // Processing time in milliseconds
  uint64 processing_time_ms = 2;
}

message GetDetailedHealthRequest {
  // Optional: filter for specific components
  repeated ComponentType components = 1;
  // Force immediate check (don't use cache)
  bool force_check = 2;
}

message GetDetailedHealthResponse {
  // Health signal
  HealthSignal signal = 1;
  // Individual probe results
  repeated ProbeResult probe_results = 2;
  // Processing time in milliseconds
  uint64 processing_time_ms = 3;
}

message StreamHealthRequest {
  // Update interval in seconds
  uint32 interval_seconds = 1;
  // Optional: filter for specific components
  repeated ComponentType components = 2;
}

message StreamHealthResponse {
  // Health signal
  HealthSignal signal = 1;
  // Update sequence number
  uint64 sequence = 2;
  // Timestamp
  int64 timestamp = 3;
}

message TriggerHealthCheckRequest {
  // Optional: specific components to check
  repeated ComponentType components = 1;
}

message TriggerHealthCheckResponse {
  // Success flag
  bool success = 1;
  // Result message
  string message = 2;
  // Health signal result
  HealthSignal signal = 3;
}

// ============================================================================
// Brain Status Requests/Responses
// ============================================================================

message GetBrainStatusRequest {}

message GetBrainStatusResponse {
  // Brain summary
  BrainHealthSummary summary = 1;
  // Fully initialized flag
  bool fully_initialized = 2;
}

message GetBrainRegionsRequest {}

message GetBrainRegionsResponse {
  // Region statuses
  repeated BrainRegionStatus regions = 1;
  // Initialization order
  repeated BrainRegion initialization_order = 2;
}

// ============================================================================
// Metrics Requests/Responses
// ============================================================================

message GetMetricsRequest {
  // Output format
  MetricsFormat format = 1;
}

message GetMetricsResponse {
  // Metrics in requested format
  string metrics = 1;
  // Timestamp
  int64 timestamp = 2;
}

enum MetricsFormat {
  METRICS_FORMAT_UNSPECIFIED = 0;
  METRICS_FORMAT_PROMETHEUS = 1;
  METRICS_FORMAT_JSON = 2;
}

// ============================================================================
// Alert Requests/Responses
// ============================================================================

message GetAlertsRequest {
  // Maximum number of alerts to return
  uint32 limit = 1;
  // Filter by severity
  optional AlertSeverity min_severity = 2;
  // Filter by component
  optional ComponentType component = 3;
  // Only include unacknowledged alerts
  bool unacknowledged_only = 4;
}

message GetAlertsResponse {
  // List of alerts
  repeated Alert alerts = 1;
  // Total count (may be more than returned)
  uint32 total_count = 2;
}

message AcknowledgeAlertRequest {
  // Alert ID to acknowledge
  string alert_id = 1;
  // Acknowledged by (user/system)
  string acknowledged_by = 2;
  // Optional notes
  optional string notes = 3;
}

message AcknowledgeAlertResponse {
  // Success flag
  bool success = 1;
  // Result message
  string message = 2;
}

// ============================================================================
// Reflex (Auto-recovery) Requests/Responses
// ============================================================================

message GetReflexStatusRequest {}

message GetReflexStatusResponse {
  // Reflexes enabled globally
  bool enabled = 1;
  // Individual reflex statuses
  repeated ReflexStatus reflexes = 2;
}

message SetReflexEnabledRequest {
  // Enable or disable reflexes
  bool enabled = 1;
  // Optional: specific reflex to enable/disable
  optional string reflex_name = 2;
}

message SetReflexEnabledResponse {
  // Success flag
  bool success = 1;
  // Result message
  string message = 2;
}

// ============================================================================
// Service Info Requests/Responses
// ============================================================================

message GetServiceInfoRequest {}

message GetServiceInfoResponse {
  // Service name
  string name = 1;
  // Service version
  string version = 2;
  // Uptime in seconds
  uint64 uptime_seconds = 3;
  // Available endpoints
  repeated string endpoints = 4;
  // Configuration summary
  map<string, string> config = 5;
}

// ============================================================================
// Core Data Types
// ============================================================================

message HealthSignal {
  // Overall system status
  SystemStatus system_status = 1;
  // Individual component health
  repeated ComponentHealth components = 2;
  // Signal timestamp
  int64 timestamp = 3;
  // System uptime in seconds
  uint64 uptime_seconds = 4;
  // Version information
  string version = 5;
  // Overall health score (0.0 to 1.0)
  double health_score = 6;
}

message ComponentHealth {
  // Component type
  ComponentType component_type = 1;
  // Current status
  ProbeStatus status = 2;
  // Human-readable message
  string message = 3;
  // Last check timestamp
  int64 last_check = 4;
  // Response time in milliseconds
  optional uint64 response_time_ms = 5;
  // Additional metadata
  map<string, string> metadata = 6;
}

message ProbeResult {
  // Component type
  ComponentType component_type = 1;
  // Probe status
  ProbeStatus status = 2;
  // Result message
  string message = 3;
  // Response time in milliseconds
  uint64 response_time_ms = 4;
  // Timestamp
  int64 timestamp = 5;
  // Error details (if failed)
  optional string error = 6;
}

message BrainHealthSummary {
  // Brain is active
  bool active = 1;
  // Total number of brain regions
  uint32 total_regions = 2;
  // Number of initialized regions
  uint32 initialized_count = 3;
  // Number of healthy regions
  uint32 healthy_count = 4;
  // Number of degraded regions
  uint32 degraded_count = 5;
  // Number of down regions
  uint32 down_count = 6;
  // Initialization progress (0.0 to 1.0)
  double initialization_progress = 7;
  // Overall health score (0.0 to 1.0)
  double health_score = 8;
}

message BrainRegionStatus {
  // Brain region
  BrainRegion region = 1;
  // Region status
  ProbeStatus status = 2;
  // Status message
  string message = 3;
  // Initialization timestamp
  optional int64 initialized_at = 4;
  // Last health check
  optional int64 last_check = 5;
  // Response time in milliseconds
  optional uint64 response_time_ms = 6;
  // Metadata
  map<string, string> metadata = 7;
}

message Alert {
  // Unique alert ID
  string id = 1;
  // Alert severity
  AlertSeverity severity = 2;
  // Component that triggered the alert
  ComponentType component = 3;
  // Alert message
  string message = 4;
  // Alert timestamp
  int64 timestamp = 5;
  // Acknowledged flag
  bool acknowledged = 6;
  // Acknowledged by (if acknowledged)
  optional string acknowledged_by = 7;
  // Acknowledgment timestamp
  optional int64 acknowledged_at = 8;
  // Acknowledgment notes
  optional string notes = 9;
  // Additional context
  map<string, string> context = 10;
}

message ReflexStatus {
  // Reflex name
  string name = 1;
  // Enabled flag
  bool enabled = 2;
  // Trigger count
  uint64 trigger_count = 3;
  // Success count
  uint64 success_count = 4;
  // Last triggered timestamp
  optional int64 last_triggered = 5;
  // Last result message
  optional string last_result = 6;
  // Circuit breaker status
  CircuitBreakerStatus circuit_breaker = 7;
}

message CircuitBreakerStatus {
  // Circuit breaker state
  CircuitBreakerState state = 1;
  // Failure count
  uint32 failure_count = 2;
  // Last state change
  int64 last_state_change = 3;
  // Next retry time (if open)
  optional int64 next_retry_at = 4;
}

// ============================================================================
// Enums
// ============================================================================

enum SystemStatus {
  SYSTEM_STATUS_UNSPECIFIED = 0;
  SYSTEM_STATUS_HEALTHY = 1; // All systems operational
  SYSTEM_STATUS_DEGRADED = 2; // Some non-critical issues
  SYSTEM_STATUS_CRITICAL = 3; // Critical issues
  SYSTEM_STATUS_SHUTDOWN = 4; // System shutting down
  SYSTEM_STATUS_STARTING = 5; // System starting up
}

enum ProbeStatus {
  PROBE_STATUS_UNSPECIFIED = 0;
  PROBE_STATUS_UP = 1; // Fully operational
  PROBE_STATUS_DEGRADED = 2; // Operational but degraded
  PROBE_STATUS_DOWN = 3; // Not operational
  PROBE_STATUS_UNKNOWN = 4; // Status unknown
}

enum ComponentType {
  COMPONENT_TYPE_UNSPECIFIED = 0;

  // Core Services
  COMPONENT_TYPE_FORWARD_SERVICE = 1;
  COMPONENT_TYPE_BACKWARD_SERVICE = 2;
  COMPONENT_TYPE_GATEWAY_SERVICE = 3;
  COMPONENT_TYPE_CNS_SERVICE = 4;
  COMPONENT_TYPE_DATA_SERVICE = 5;
  COMPONENT_TYPE_EXECUTION_SERVICE = 6;

  // Dependencies
  COMPONENT_TYPE_REDIS = 10;
  COMPONENT_TYPE_QDRANT = 11;
  COMPONENT_TYPE_QUESTDB = 12;
  COMPONENT_TYPE_POSTGRES = 13;

  // Communication Channels
  COMPONENT_TYPE_SHARED_MEMORY = 20;
  COMPONENT_TYPE_GRPC_CHANNEL = 21;
  COMPONENT_TYPE_WEBSOCKET = 22;

  // Internal Subsystems
  COMPONENT_TYPE_VISION_MODULE = 30;
  COMPONENT_TYPE_LOGIC_MODULE = 31;
  COMPONENT_TYPE_MEMORY_MODULE = 32;
  COMPONENT_TYPE_EXECUTION_MODULE = 33;

  // Infrastructure
  COMPONENT_TYPE_JOB_QUEUE = 40;
  COMPONENT_TYPE_METRICS_EXPORTER = 41;

  // Neuromorphic Brain Regions
  COMPONENT_TYPE_CORTEX = 50;
  COMPONENT_TYPE_HIPPOCAMPUS = 51;
  COMPONENT_TYPE_BASAL_GANGLIA = 52;
  COMPONENT_TYPE_THALAMUS = 53;
  COMPONENT_TYPE_PREFRONTAL = 54;
  COMPONENT_TYPE_AMYGDALA = 55;
  COMPONENT_TYPE_HYPOTHALAMUS = 56;
  COMPONENT_TYPE_CEREBELLUM = 57;
  COMPONENT_TYPE_VISUAL_CORTEX = 58;
  COMPONENT_TYPE_INTEGRATION = 59;
}

enum BrainRegion {
  BRAIN_REGION_UNSPECIFIED = 0;
  BRAIN_REGION_CORTEX = 1;
  BRAIN_REGION_HIPPOCAMPUS = 2;
  BRAIN_REGION_BASAL_GANGLIA = 3;
  BRAIN_REGION_THALAMUS = 4;
  BRAIN_REGION_PREFRONTAL = 5;
  BRAIN_REGION_AMYGDALA = 6;
  BRAIN_REGION_HYPOTHALAMUS = 7;
  BRAIN_REGION_CEREBELLUM = 8;
  BRAIN_REGION_VISUAL_CORTEX = 9;
  BRAIN_REGION_INTEGRATION = 10;
}

enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  ALERT_SEVERITY_INFO = 1; // Informational
  ALERT_SEVERITY_WARNING = 2; // Warning
  ALERT_SEVERITY_ERROR = 3; // Error
  ALERT_SEVERITY_CRITICAL = 4; // Critical
}

enum CircuitBreakerState {
  CIRCUIT_BREAKER_STATE_UNSPECIFIED = 0;
  CIRCUIT_BREAKER_STATE_CLOSED = 1; // Normal operation
  CIRCUIT_BREAKER_STATE_OPEN = 2; // Circuit open, rejecting requests
  CIRCUIT_BREAKER_STATE_HALF_OPEN = 3; // Testing if service recovered
}
