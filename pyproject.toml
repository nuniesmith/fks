# =============================================================================
# fks — Monorepo Configuration
# =============================================================================
# Combines:
#   • ruby  — Backend Python API (src/ruby/)
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fks"
version = "0.1.0"
description = "FKS — Ruby Trading API"
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    # --- Scheduling ---
    "apscheduler>=3.10.0",

    # --- Exchange connectivity ---
    "ccxt>=4.5.45",

    # --- Data & Market ---
    "massive>=2.4.0",
    # async-rithmic requires websockets<15; cap here so all extras stay compatible
    "websockets>=13.0,<15.0",
    "yfinance>=1.2.0",
    "aiohttp>=3.13.4",

    # --- Data Science ---
    "pandas>=3.0.1",
    "numpy>=2.4.3",
    "scikit-learn>=1.8.0",
    "hmmlearn>=0.3.3",

    # --- Deep Learning (CPU default; override with [gpu] for CUDA builds) ---
    # Install torch/torchvision *before* this package with
    #   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.11.0",

    # --- Charting (dashboard visuals + CNN training images) ---
    "plotly>=6.6.0",
    "matplotlib>=3.10.8",
    "mplfinance>=0.12.10b0",
    "Pillow>=12.1.1",

    # --- Backtesting & Optimization ---
    "backtesting>=0.6.5",
    "optuna>=4.8.0",

    # --- Web / API ---
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.22",
    "pydantic>=2.12.5",
    "jsonschema>=4.23.0",
    "requests>=2.32.5",
    "httpx>=0.28.1",
    "openai>=2.30.0",
    "slowapi>=0.1.9",

    # --- Storage ---
    "redis>=7.4.0",
    "psycopg[binary]>=3.3.3",
    # psycopg2-binary is actively imported in postgres.py, memory_recorder.py,
    # and lightweight_charts_bridge.py. Keep until all callers migrate to psycopg v3.
    "psycopg2-binary>=2.9.7",
    "psycopg_pool>=3.0.0",
    "sqlalchemy>=2.0.48",
    "questdb>=2.0.3",

    # --- Configuration ---
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3",

    # --- Timezone data (required for ZoneInfo inside Docker/minimal OS images) ---
    "tzdata>=2025.1",

    # --- Observability ---
    "loguru>=0.7.0",
    "structlog>=25.5.0",
    "prometheus-client>=0.24.1",
    "psutil>=6.0.0",

    # --- Filesystem watching (CNN model hot-reload) ---
    "watchdog>=6.0.0",

    # --- Reddit sentiment ---
    "praw>=7.8.1",
    # NOTE: package name on PyPI is "vaderSentiment" but imports as vaderSentiment
    "vaderSentiment>=3.3.2",

    # --- News sentiment (Finnhub) ---
    "finnhub-python>=2.4.20",

    # --- RSS feed parsing (DataFactory news pipeline) ---
    "feedparser>=6.0",

    # --- gRPC (Janus gRPC transport) ---
    "grpcio>=1.68.0",

    # --- TradingView data integration (symbol search + real-time WebSocket) ---
    "TradingView-API>=1.0.1",

    # --- Lightweight Charts (server-side HTML chart generation) ---
    "bn-lightweight-charts>=1.2.1",

    # --- Pine Script AST parsing / lint (generation-time validation) ---
    "pynescript>=0.3.0",

    # --- Credential encryption (Rithmic integration) ---
    "cryptography>=46.0.5",

    # --- Session auth (web dashboard password hashing) ---
    "bcrypt>=5.0.0",

    # --- First-run setup wizard ---
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "fakeredis>=2.34.1",
    "ruff>=0.15.8",
    "mypy>=1.19.1",
    "types-requests>=2.32.4.20260107",
    "types-PyYAML>=6.0.12",
    "types-pytz>=2026.1.1.20260304",
    "types-redis>=4.6.0.20241004",
    # grpcio-tools is excluded to avoid the protobuf>=5 conflict with async-rithmic.
    # Install ad-hoc when needed: pip install grpcio-tools>=1.68.0
    # See scripts/gen-proto.sh for usage.
]
test = [
    # --- ML model optional deps (run *all* model & CNN tests) ---
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "arch>=7.0.0",
    "prophet>=1.1.6",
    "torchvision>=0.21.0",
    "tqdm>=4.67.0",
]
gpu = [
    # --- GPU training (CUDA 12.8) — trainer image only ---
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
    "tqdm>=4.67.3",
]
server = [
    # --- Trainer HTTP server extras ---
    "uvicorn[standard]>=0.42.0",
]
rithmic = [
    # --- Rithmic prop account monitoring (read-only) ---
    # async-rithmic 1.x requires websockets>=11,<15 — base deps already cap at <15.
    "async-rithmic>=1.5.0",
]

[project.urls]
Repository = "https://github.com/nuniesmith/fks"
"Bug Tracker" = "https://github.com/nuniesmith/fks/issues"

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
testpaths = [
    "src/ruby/tests",
    "src/ruby/src",
]
pythonpath = [
    "src/ruby/src",
    ".",
]
# -p no:faulthandler: suppresses the C-level abort/core-dump from
# prometheus_client's _mmap_dict C extension during interpreter shutdown.
addopts = "-v --tb=short -p no:faulthandler"
asyncio_mode = "auto"
filterwarnings = [
    # google-protobuf uses a deprecated PyType_Spec metaclass pattern that
    # will be disallowed in Python 3.14. This is an upstream issue in protobuf.
    "ignore:Type google\\._upb\\._message\\..*uses PyType_Spec:DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# Ruff — Linting & Formatting
# =============================================================================

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src/ruby/src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PERF", # perflint
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # function call in default argument (FastAPI Depends/Query, dataclasses)
    "B905",   # zip-without-explicit-strict
    "SIM103", # needless-bool
    "SIM108", # ternary operator
    "SIM114", # if-with-same-arms
    "UP007",  # use X | Y for union types
    "UP046",  # Generic class uses Generic subclass (pre-existing code)
    "UP047",  # Generic function should use type parameters (pre-existing code)
    "RUF002", # ambiguous unicode in docstring — emoji are intentional (📡💓🟢 etc.)
    "RUF003", # ambiguous unicode in comment — emoji are intentional
    "RUF006", # asyncio dangling task — tasks are held by the event loop intentionally
    "RUF012", # mutable class variables — dataclass fields use field()
    "N802",   # function name lowercase — ccxt methods use camelCase
    "N803",   # argument name lowercase — matching external APIs
    "N806",   # variable name lowercase — matching external conventions
    "PT011",  # pytest.raises too broad
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "src"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "SIM117", # nested `with patch(...)` is idiomatic in tests
    "S101",   # assert allowed in tests
    "PT004",  # fixture doesn't return anything
    "B011",   # assert False acceptable in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# =============================================================================
# Mypy — Type Checking
# =============================================================================

[tool.mypy]
python_version = "3.13"
mypy_path = "src/ruby/src"
files = [
    "src/ruby/src",
    "scripts",
]

# Error reporting
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_optional = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

# Don't require full annotations everywhere, but check what is annotated
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
follow_imports = "silent"

# --- Test overrides ---
[[tool.mypy.overrides]]
module = [
    "src.data.chain.tests.*",
    "src.data.news.tests.*",
    "src.data.tests.*",
    "tests.*",
]
ignore_errors = true
disallow_untyped_defs = false
check_untyped_defs = false

# --- Noisy third-party stubs ---
[[tool.mypy.overrides]]
module = [
    "massive.*",
    "async_rithmic.*",
    "mplfinance.*",
    "hmmlearn.*",
    "backtesting.*",
    "optuna.*",
    "praw.*",
    "vaderSentiment.*",
    "finnhub.*",
    "apscheduler.*",
    "slowapi.*",
    "ccxt.*",
    "aiohttp.*",
    "redis.*",
    "fakeredis.*",
]
ignore_missing_imports = true
ignore_errors = true

# PyYAML — no inline types; types-PyYAML is dev-only and absent in base CI
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
ignore_errors = true

# pynescript uses ANTLR4 and ships no type stubs
[[tool.mypy.overrides]]
module = ["pynescript", "pynescript.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.hatch.build.targets.wheel]
packages = ["src/ruby/src"]
