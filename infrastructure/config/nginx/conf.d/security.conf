# ============================================
# Security Headers Configuration
# ============================================
# This file contains security headers and SSL hardening
# Include this in your server blocks

# Security Headers Map (use in server blocks)
map $sent_http_content_type $x_frame_options {
    default "DENY";
    ~*text/html "SAMEORIGIN";
}

map $sent_http_content_type $x_content_type_options {
    default "nosniff";
}

map $sent_http_content_type $x_xss_protection {
    default "1; mode=block";
}

map $sent_http_content_type $referrer_policy {
    default "strict-origin-when-cross-origin";
}

map $sent_http_content_type $permissions_policy {
    default "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()";
}

# ============================================
# Rate Limiting Zones
# ============================================

# Rate limit zones (defined here, applied in server blocks)
# General API rate limit: 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Trading endpoints: 2 requests/second per IP (most restrictive)
limit_req_zone $binary_remote_addr zone=trading_limit:10m rate=2r/s;

# WebSocket connections: 5 per IP
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

# ============================================
# Blocked patterns
# ============================================

# Block common attack patterns
map $request_uri $blocked_request {
    default 0;
    ~*\.php$ 1;
    ~*\.asp$ 1;
    ~*\.aspx$ 1;
    ~*\.jsp$ 1;
    ~*wp-admin 1;
    ~*wp-login 1;
    ~*xmlrpc\.php 1;
    ~*\.git 1;
    ~*\.env 1;
    ~*\.htaccess 1;
    ~*\.htpasswd 1;
    ~*phpmyadmin 1;
    ~*eval\( 1;
    ~*base64 1;
}

# Block bad user agents
map $http_user_agent $blocked_agent {
    default 0;
    ~*sqlmap 1;
    ~*nikto 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*dirbuster 1;
    ~*gobuster 1;
    ~*python-requests 0; # Allow legitimate Python requests
    "" 1; # Block empty user agents
}
