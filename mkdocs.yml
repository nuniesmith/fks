# MkDocs Configuration for Project JANUS / FKS
# Documentation Site: Neuromorphic Trading Platform

site_name: Project JANUS / FKS
site_description: Neuromorphic Algorithmic Trading Platform - Brain-Inspired Trading System
site_author: Jordan (nuniesmith)
site_url: https://nuniesmith.github.io/fks

# Repository information
repo_name: nuniesmith/fks
repo_url: https://github.com/nuniesmith/fks
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 nuniesmith

# Theme configuration
theme:
  name: material
  language: en

  # Color palette
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  # Typography
  font:
    text: Roboto
    code: Roboto Mono

  # Features
  features:
    - navigation.tabs # Top-level tabs
    - navigation.tabs.sticky # Sticky tabs
    - navigation.sections # Collapsible sections
    - navigation.expand # Expand all sections by default
    - navigation.indexes # Section index pages
    - navigation.top # Back to top button
    - search.highlight # Highlight search terms
    - search.share # Share search results
    - search.suggest # Search suggestions
    - toc.follow # TOC follows scroll
    - content.code.copy # Copy code button
    - content.code.annotate # Code annotations

  # Icon
  icon:
    repo: fontawesome/brands/github
    logo: material/brain

# Plugins
plugins:
  - search:
      separator: '[\s\-\.]+'
      lang: en

  # (mkdocstrings removed: it extracted docstrings from the Python "Ruby"
  # services, which were deleted in the janus migration — the plugin only
  # added a hard build dependency with nothing left to document.)

# Markdown extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      toc_depth: 3

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  # Emoji extension disabled due to Python 3.13 compatibility issue
  # - pymdownx.emoji:                     # Requires mkdocs-material installed in the build env.
  #     emoji_index: !!python/name:material.extensions.emoji.twemoji   # Not in local .venv — enable only
  #     emoji_generator: !!python/name:material.extensions.emoji.to_svg # in Docker or CI mkdocs builds.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra JavaScript for LaTeX rendering
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Extra CSS
extra_css:
  - stylesheets/extra.css

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nuniesmith/fks

  # Version selector
  version:
    provider: mike

  # Analytics (optional - uncomment and add your ID)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

