[package]
name         = "rustrade-supervisor"
description  = "Service lifecycle supervisor with backoff and circuit breakers for rustrade"
readme       = "README.md"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
keywords   = ["supervisor", "tokio", "trading", "lifecycle"]
categories = ["asynchronous", "concurrency"]

[features]
# Publish supervisor metrics to a global Prometheus registry.
# Off by default — downstream binaries opt in if they want Prometheus.
default = []
prometheus = ["dep:prometheus"]

# ──────────────────────────────────────────────────────────────────────────────
# Dependencies
#
# Pinned to explicit versions (rather than `workspace = true`) so this crate
# can be consumed as a path dep from foreign workspaces (e.g.
# `crates/janus/bin/janus`) without the consumer needing to mirror every
# dep into its own `[workspace.dependencies]`. The chosen versions match
# the rustrade workspace's pins as of 2026-05; bump in lockstep when the
# rustrade workspace bumps.
#
# Same shape that crates.io will require when this is eventually published.
# ──────────────────────────────────────────────────────────────────────────────
[dependencies]
async-trait = "0.1"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util  = { version = "0.7", features = ["rt"] }
tracing     = "0.1"
prometheus  = { version = "0.14", optional = true }
thiserror   = "2"
anyhow      = "1"
serde       = { version = "1", features = ["derive"] }
rand        = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
