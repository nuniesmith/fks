; =============================================================================
; fks_ruby — Supervisord Configuration
; Manages data (FastAPI), engine (ML worker), and web (HTMX dashboard)
; inside a single Docker container.
;
; Process startup order: data (10) → engine (20) → web (30)
; All processes auto-restart on failure.
;
; Usage:
;   supervisorctl status          # check process status
;   supervisorctl restart data    # restart a single process
;   supervisorctl tail -f data    # follow logs
; =============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/fks
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── Data Service (FastAPI REST + SSE + Execution Gate) ────────────────────────
; Primary HTTP API on port 8000. Must start first — engine and web depend on it.
[program:data]
command=/app/venv/bin/python -m entrypoints.data.main
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=10
priority=10
stdout_logfile=/var/log/fks/data.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/fks/data.err
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PYTHONPATH="/app/src",PYTHONUNBUFFERED="1",PATH="/app/venv/bin:%(ENV_PATH)s"

; ── Engine Worker (ML models, regime/risk/focus scoring) ──────────────────────
; Background worker — no HTTP port. Publishes to Redis on a slow loop.
; Writes heartbeat to /tmp/engine_health.json.
[program:engine]
command=/app/venv/bin/python -m lib.services.engine.main
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=10
priority=20
stdout_logfile=/var/log/fks/engine.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/fks/engine.err
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PYTHONPATH="/app/src",PYTHONUNBUFFERED="1",PATH="/app/venv/bin:%(ENV_PATH)s"

; ── DataFactory Coordinator (gap scan → backfill → cache warm → reconcile) ────
; Long-running async coordinator that owns the full data lifecycle.
; Starts before data/engine/web (priority=5) so that Redis caches are warm
; when the data service starts serving requests.
[program:factory]
command=/app/venv/bin/python -m entrypoints.factory
directory=/app
autostart=true
autorestart=unexpected
startretries=5
startsecs=10
priority=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/fks/factory.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/fks/factory.err
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PYTHONPATH="/app/src",PYTHONUNBUFFERED="1",PATH="/app/venv/bin:%(ENV_PATH)s",REDIS_URL="%(ENV_REDIS_URL)s",DATABASE_URL="%(ENV_DATABASE_URL)s",MASSIVE_API_KEY="%(ENV_MASSIVE_API_KEY)s",FINNHUB_API_KEY="%(ENV_FINNHUB_API_KEY)s",REDDIT_CLIENT_ID="%(ENV_REDDIT_CLIENT_ID)s",REDDIT_CLIENT_SECRET="%(ENV_REDDIT_CLIENT_SECRET)s",BACKFILL_DAYS_BACK="%(ENV_BACKFILL_DAYS_BACK)s",BACKFILL_CHUNK_DAYS="%(ENV_BACKFILL_CHUNK_DAYS)s",GAP_SCAN_INTERVAL_SECS="%(ENV_GAP_SCAN_INTERVAL_SECS)s",DATA_KLINE_INTERVALS="%(ENV_DATA_KLINE_INTERVALS)s",FACTORY_ENABLED_CLASSES="%(ENV_FACTORY_ENABLED_CLASSES)s",QUESTDB_HOST="%(ENV_QUESTDB_HOST)s",QUESTDB_PG_PORT="%(ENV_QUESTDB_PG_PORT)s",QUESTDB_PG_USER="%(ENV_QUESTDB_PG_USER)s",QUESTDB_PG_PASSWORD="%(ENV_QUESTDB_PG_PASSWORD)s"

; ── Web Dashboard (HTMX + Jinja2 templates) ──────────────────────────────────
; Uvicorn on port 8080. Proxies API calls to data (localhost:8000).
[program:web]
command=/app/venv/bin/uvicorn lib.services.web.main:app --host 0.0.0.0 --port 8080 --log-level info
directory=/app/src
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=30
stdout_logfile=/var/log/fks/web.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/fks/web.err
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
environment=PYTHONPATH="/app/src",PYTHONUNBUFFERED="1",PATH="/app/venv/bin:%(ENV_PATH)s"
