# =============================================================================
# bot-alerts.yml — Prometheus alert rules for FKS Bot Spawner
#
# Scrape source: file_sd_configs from /etc/prometheus/sd/bots.json
# Each bot container must expose :9091/metrics with the following gauges:
#   fks_bot_pnl_dollars        current P&L in USD
#   fks_bot_signals_total      cumulative signal count (counter)
#   fks_bot_trades_total       cumulative trade count (counter)
#   fks_bot_win_rate           win rate 0.0–1.0
#   fks_bot_uptime_seconds     seconds since container start
# =============================================================================
groups:
  # ─────────────────────────────────────────────────────────────────────────
  # Bot liveness — detect stopped / missing bots
  # ─────────────────────────────────────────────────────────────────────────
  - name: bot-liveness
    rules:
      - alert: BotStopped
        expr: up{job="fks-bots"} == 0
        for: 2m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Bot container {{ $labels.container_name }} is down"
          description: >
            Bot {{ $labels.bot_id }} ({{ $labels.container_name }}) has not been
            reachable for 2 minutes. The container may have exited or crashed.
            Mode: {{ $labels.mode }}.
          runbook: "Check logs: curl http://spawner:8090/container/{{ $labels.container_name }}/logs"

      - alert: BotUptimeTooShort
        expr: fks_bot_uptime_seconds{job="fks-bots"} < 60
        for: 0m
        labels:
          severity: info
          team: trading
        annotations:
          summary: "Bot {{ $labels.container_name }} restarted recently"
          description: >
            Bot {{ $labels.bot_id }} has uptime of only {{ $value | humanizeDuration }}.
            This may indicate a crash-loop.

  # ─────────────────────────────────────────────────────────────────────────
  # Bot performance — detect high drawdown
  # ─────────────────────────────────────────────────────────────────────────
  - name: bot-performance
    rules:
      - alert: BotHighDrawdown
        expr: fks_bot_pnl_dollars{job="fks-bots"} < -500
        for: 5m
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Bot {{ $labels.container_name }} has high drawdown: ${{ $value | humanize }}"
          description: >
            Bot {{ $labels.bot_id }} (mode: {{ $labels.mode }}) has an unrealised
            P&L of ${{ $value | humanize }}. Drawdown threshold: -$500.
            Consider stopping this bot via the spawner API or web UI.
          runbook: "Stop bot: curl -X POST http://spawner:8090/container/{{ $labels.container_name }}/stop"

      - alert: BotLowWinRate
        # Guard: a bot with no trades reports win_rate=0.0 and would false-fire;
        # only evaluate bots that have actually traded.
        expr: |
          fks_bot_win_rate{job="fks-bots"} < 0.3
          and fks_bot_trades_total{job="fks-bots"} > 10
        for: 30m
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Bot {{ $labels.container_name }} win rate below 30%"
          description: >
            Bot {{ $labels.bot_id }} has a win rate of {{ $value | humanizePercentage }}
            over the last 30 minutes. Expected minimum: 30%.

  # ─────────────────────────────────────────────────────────────────────────
  # Bot activity — detect signal / trade stalls
  # ─────────────────────────────────────────────────────────────────────────
  - name: bot-activity
    rules:
      # CADENCE (fixed 2026-07-26 review): a 15m window is meaningless for
      # every bot actually deployed, so this fired CONTINUOUSLY — on the LIVE
      # spot bot since 2026-07-15 and on the Gate-A funding bot during its
      # measurement window. A permanently-red money channel trains the operator
      # to ignore it, which is worse than no alert.
      #   • bot="spot-portfolio" is a drift REBALANCER: it emits a signal only
      #     when portfolio drift crosses the trigger. Verified healthy while
      #     "silent" — cycling all 3 venues every 5 min, drift 8-12% under
      #     threshold, 2016 log lines/24h, signals_total=0 over 11 days. For
      #     this strategy "no signals" is normal operation, not a fault, so it
      #     is excluded rather than given a longer window.
      #   • the funding bot emits ~2 signals/DAY, so it is measured over 24h.
      # Real liveness for both is already covered by LiveBotMetricsDown
      # (up == 0) and LiveBotCrashed. TODO: a fks_bot_cycles_total heartbeat
      # would let us detect a WEDGED-but-alive decision loop, which neither
      # signals nor trades can express for a low-cadence strategy.
      - alert: BotNoSignals
        expr: >
          increase(fks_bot_signals_total{job="fks-bots",bot!="spot-portfolio"}[24h]) == 0
          and fks_bot_uptime_seconds{job="fks-bots",bot!="spot-portfolio"} > 86400
        for: 1h
        labels:
          severity: warning
          team: trading
        annotations:
          # These strings said "15 min" / "5 minutes" long after the 2026-07-26
          # cadence fix moved the expr to 24h/86400s. An alert body that states
          # a window the expr does not measure is the same failure as a frozen
          # gauge reading fresh — the operator triages against a number nothing
          # computed. Kept in sync with the expr above.
          summary: "Bot {{ $labels.container_name }} has produced no signals in 24h"
          description: >
            Bot {{ $labels.bot_id }} (mode: {{ $labels.mode }}) has been running for
            over 24 hours but emitted no signals in the last 24 hours.
            The bot may be stalled, waiting for data, or have a configuration issue.

      # Same cadence problem (2026-07-26): the only live bot IS the rebalancer,
      # so this fired for 11 days straight. A HODL/DCA rebalancer legitimately
      # places no trades for days — that is the strategy, not an incident.
      #
      # SCOPE (fixed 2026-08-02): was mode="live", which is the same disengaged
      # -selector defect the venue-freshness rules below already fixed and which
      # crash-supervision.yml's LiveBotMetricsDown carried too. A real-money bot
      # reports mode="dry-run" whenever it is outside the live_venues allowlist
      # or its drawdown breaker has halted it, and it still holds REAL balances.
      # Measured on this Prometheus: crypto-spot carried mode="dry-run" for
      # 21h27m (2026-07-06T20:38Z → 2026-07-07T18:05:45Z) during which
      # up{job="fks-bots",mode="live"} matched NOTHING at all. A deny list, not
      # an allow-list regex, so a real-money mode nobody has invented yet is
      # covered by default. backtest is excluded because those are one-shot
      # containers, not a trading strategy that has gone quiet.
      #
      # HONEST LIMIT: fixing the mode scope does NOT make this rule live for
      # today's fleet. crypto-spot — the only real-money bot — carries
      # bot="spot-portfolio" and is excluded by the matcher above for the
      # cadence reason, and crypto-funding is paper. So this rule still selects
      # nothing until a non-rebalancer real-money bot exists. The scope fix is
      # here so that bot is covered on day one instead of being silently outside
      # a mode="live" selector, which is exactly how the 21h27m hole happened.
      # Do not read a green BotNoTrades as evidence that trading is healthy.
      - alert: BotNoTrades
        expr: >
          increase(fks_bot_trades_total{job="fks-bots",mode!="paper",mode!="backtest",bot!="spot-portfolio"}[24h]) == 0
          and fks_bot_uptime_seconds{job="fks-bots",mode!="paper",mode!="backtest",bot!="spot-portfolio"} > 86400
        for: 1h
        labels:
          severity: info
          team: trading
        annotations:
          # Same annotation/expr drift as BotNoSignals above: this said
          # "30 min" / "10 minutes" against a 24h/86400s expr.
          summary: "Real-money bot {{ $labels.container_name }} has placed no trades in 24h"
          description: >
            Real-money bot {{ $labels.bot_id }} (mode: {{ $labels.mode }}) has been
            running for over 24 hours but placed no trades in the last 24 hours.
            This may be expected outside market hours or if the strategy is
            waiting for a setup. dry-run counts as real money here: it holds real
            balances and is only barred from placing orders.

  # ─────────────────────────────────────────────────────────────────────────
  # Spawner service health
  # ─────────────────────────────────────────────────────────────────────────
  - name: spawner-health
    rules:
      - alert: SpawnerDown
        expr: up{job="fks-spawner"} == 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "FKS Bot Spawner is unreachable"
          description: >
            The fks_bot_spawner service has not responded to scrapes for 1 minute.
            Bot lifecycle management (spawn/stop/restart) is unavailable.

      # Removed SpawnerAtBotCapacity: its RHS metric fks_spawner_max_bots_limit
      # is never exported by the spawner (siblings fks_spawner_running_bots etc.
      # are), so the >= comparison matched nothing and the alert could never
      # fire. Restore once the spawner exports its max-bots limit.

  # ─────────────────────────────────────────────────────────────────────────
  # Venue freshness (P-26)
  #
  # Source: fks_bot_venue_status_age_seconds{bot_id,exchange,mode}, exported by
  # the SPAWNER from each bot's own /status stamp — not by the scraper. That
  # distinction is the point: a bot whose venue connections are all dead still
  # answers /metrics and still looks `up`. On 2026-07-22 the live spot bot lost
  # DNS to every venue for 65 minutes and nothing fired; the outage was found
  # five days later, in the database, as 15 identical net-worth rows.
  #
  # SCOPE IS mode!="paper", NOT mode="live". A spot venue reports `dry-run`
  # when it is outside the live_venues allowlist or when the drawdown breaker
  # has halted it (vlive = venue.live && !halted) — and it still holds REAL
  # balances. Scoping to "live" silenced these alerts at the exact moment a
  # venue was halted. Paper bots stay excluded: going quiet is not a money event.
  #
  # Two rules, because the shape of the failure tells you where to look:
  # every venue climbing together = connectivity/DNS; one venue alone = that
  # venue (API outage, expired key, rate-limit ban).
  #
  # ── Threshold: 540s, not 900s (fixed 2026-08-13 audit) ────────────────────
  # The spawner's own net-worth sampler (fks-spawner net_worth.rs
  # reading_is_stale) REFUSES to record a reading once it is older than
  # `NET_WORTH_SAMPLE_INTERVAL_SECS * 2` — 600s at the default 300s cadence.
  # The old 900s threshold here fired 5 minutes AFTER the sampler had already
  # given up and started skipping writes (visible as
  # fks_spawner_net_worth_stale_skipped_total climbing), so the operator was
  # always chasing a treasury gap that had existed for a while. 540s (9
  # minutes) is a leading indicator instead of a trailing one: it fires ~60s
  # BEFORE the sampler's own 600s refusal point, with a small margin rather
  # than cutting it exactly at 600 (scrape jitter / eval-interval rounding).
  # If NET_WORTH_SAMPLE_INTERVAL_SECS is ever changed from its 300s default,
  # re-derive this as roughly (interval * 2) - 60.
  # ─────────────────────────────────────────────────────────────────────────
  - name: bot-venue-freshness
    rules:
      - alert: BotAllVenuesStale
        # Every real-money venue this bot reports is stale => the bot is blind,
        # and its net worth is frozen. Paper is excluded: a paper bot going quiet
        # is not a money event. dry-run is NOT excluded — it holds real balances.
        expr: |
          count by (bot_id) (fks_bot_venue_status_age_seconds{mode!="paper"} > 540)
            == on (bot_id)
          count by (bot_id) (fks_bot_venue_status_age_seconds{mode!="paper"})
        for: 5m
        labels:
          severity: critical
          team: trading
          channel: money
        annotations:
          summary: "Bot {{ $labels.bot_id }}: ALL real-money venues stale — bot is blind"
          description: >
            Every real-money venue on {{ $labels.bot_id }} (live or dry-run) has failed to refresh for
            over 9 minutes — at or before the point the net-worth sampler's own
            600s staleness guard starts refusing to record this bot's readings.
            The bot is still running and still serving its last known figures,
            so `up` is green and net worth looks unchanged — it is simply not
            being updated. This is the 2026-07-22 DNS-blackout signature. Any
            position it holds is unmanaged until this clears.
          runbook: >
            1) docker exec <bot> getent hosts api.kraken.com  (DNS resolving?)
            2) docker logs <bot> --since 20m | grep -iE 'dns|resolve|timeout'
            3) check host resolver + Docker embedded DNS (127.0.0.11)
            4) net-worth sampling is CORRECTLY paused meanwhile — see
               fks_spawner_net_worth_stale_skipped_total; the gap is deliberate.

      # ── A venue that cannot trade is invisible today (added 2026-08-17) ──
      # Caught after the fact: crypto-spot's Crypto.com venue was emptied by an
      # operator withdrawal on 2026-08-05 and then sat at $0.12 with every
      # target weight at 0%, so it was permanently `triggered=true` with
      # max_drift=100% and could NEVER execute — the bot logged
      # "venue STUCK - triggered but no executable trade" for 1152+ consecutive
      # cycles (~4 days) and nothing alerted. It was found by hand on 08-17,
      # 13 days later, while investigating an unrelated number.
      #
      # A venue holding less than its `min_trade_usd` (5.0 for both live
      # venues) is STRUCTURALLY unable to rebalance: every cycle it computes a
      # 100% drift, triggers, and no order clears the minimum. That is a dead
      # venue, not a quiet one, and it silently drags the basket out of its
      # target weights for as long as it persists.
      #
      # Validated against the real incident: this expr matches Crypto.com from
      # 2026-08-05 (the day it emptied) through 08-17, and matches neither live
      # venue today (Kraken $77.67, KuCoin $72.39). `for: 6h` so a venue that
      # is briefly drained mid-rebalance does not page.
      #
      # Resolution is a decision, not a restart: either refund the venue or
      # remove it from `live_venues` + its `[[exchange]]` block and respawn
      # (which is what was done for Crypto.com on 2026-08-18).
      - alert: BotVenueBelowMinTrade
        expr: fks_bot_exchange_total_usd{mode!="paper"} < 5
        for: 6h
        labels:
          severity: warning
          team: trading
          channel: money
        annotations:
          summary: "Bot {{ $labels.bot_id }}: venue {{ $labels.exchange }} holds ${{ $value }} — below min trade size, cannot rebalance"
          description: >
            {{ $labels.exchange }} on {{ $labels.bot_id }} has held under $5 for
            6h+. It is below `min_trade_usd`, so every rebalance cycle triggers
            at up to 100% drift and no order can clear the venue minimum — the
            venue is structurally dead, not merely idle, and the basket sits off
            its target weights while it persists. This is NOT self-healing.
          runbook: >
            1) docker logs <bot> | grep "venue STUCK"   (confirms the trigger loop)
            2) Decide: refund the venue, OR retire it — remove from live_venues
               and delete its [[exchange]] block in spot-portfolio.toml, rebuild,
               respawn. Retiring also corrects expected_venues.
            3) If funds were withdrawn, record them in the transfers ledger
               (POST /transfers) or /profit will book the withdrawal as a
               trading loss forever.

      - alert: BotVenueStale
        # A single real-money venue lagging while its siblings tick.
        expr: fks_bot_venue_status_age_seconds{mode!="paper"} > 540
        for: 10m
        labels:
          severity: warning
          team: trading
          channel: money
        annotations:
          summary: "Bot {{ $labels.bot_id }}: venue {{ $labels.exchange }} stale for >9m"
          description: >
            {{ $labels.exchange }} has not refreshed its account snapshot in over
            9 minutes while other venues on {{ $labels.bot_id }} are current —
            at or before the point the net-worth sampler's own 600s staleness
            guard starts refusing to record this bot's readings. Net worth is a
            SUM across venues, so the reported total is wrong while this
            persists, and net-worth sampling is paused.
          runbook: >
            Check that venue's API status, key validity/permissions, and whether
            the account is rate-limited or geo-blocked.

      - alert: BotVenueFreshnessMissing
        # The gauge going ABSENT is now the honest signal for "cannot see this
        # bot's venues" — the spawner retires the series when /status is
        # unreachable, non-2xx, or unparseable, rather than leaving a frozen
        # age that reads as healthy.
        #
        # Without this rule that honesty is silent: BotAllVenuesStale and
        # BotVenueStale both match ON the series, so no series means no alert.
        # A running bot exporting no venue freshness is a blind spot, not a
        # clean bill of health.
        expr: |
          up{job="fks-bots"} == 1
            unless on (bot_id)
          count by (bot_id) (fks_bot_venue_status_age_seconds)
        for: 15m
        labels:
          severity: warning
          team: trading
          channel: money
        annotations:
          summary: "Bot {{ $labels.bot_id }} is up but reports no venue freshness"
          description: >
            {{ $labels.bot_id }} answers /metrics but the spawner is exporting no
            fks_bot_venue_status_age_seconds series for it — its /status is
            unreachable, non-2xx, or no longer parseable. The freshness alerts
            match on that series, so while it is absent this bot has NO staleness
            coverage at all. This is the shape a /status schema change takes
            (an `updated` field renamed or dropped): everything looks green
            because nothing is being measured.
          runbook: >
            1) curl the bot's :9091/status and check exchanges[] still carries
               `updated` per venue
            2) docker logs <bot> for probe failures
            3) fks_spawner_net_worth_stale_skipped_total shows whether sampling
               is also paused

      - alert: NetWorthSamplingPausedTooLong
        # The guard is protecting the series — but a long pause means the
        # treasury history is going dark and needs a human.
        #
        # sum() IS LOad-BEARING. fks_spawner_net_worth_stale_skipped_total gained
        # a `reason` label (fks-spawner #42) because FOUR different refusals feed
        # it: stale, incomplete, fake_paper, unaccounted. Without sum() this
        # would evaluate PER REASON, splitting one "the treasury is going dark"
        # money alert into up to four concurrent per-reason alert instances —
        # sum() keeps this a single unified signal; the runbook below is the
        # per-reason breakdown step instead.
        #
        # ── Threshold rewrite (fixed 2026-08-13 audit: "blackout detector one
        #    cadence bump from unfirable") ─────────────────────────────────────
        # The OLD expr was `sum(increase(...[30m])) > 5`: a bare count of
        # refusals in a fixed 30m window, implicitly assuming the sampler's
        # sweep cadence (NET_WORTH_SAMPLE_INTERVAL_SECS, default 300s = 6
        # sweeps/30m). With 1 bot in TOTAL, CONTINUOUS blackout for the full
        # 30m, that is at most 6 refusals — just barely > 5. Any cadence
        # increase (a very plausible future change — raising the interval to
        # cut load/DB writes) shrinks sweeps-per-window and this becomes
        # permanently unfirable for exactly the incident it exists to catch:
        # at a 600s cadence a single bot in total 30m blackout produces only 3
        # refusals, and `> 5` can never be reached no matter how long the
        # blackout runs.
        #
        # NEW expr asks a time-window question instead of a magic count: has
        # the sampler been refusing samples continuously for a sustained
        # period? `increase(...[15m]) > 0` is "at least one refusal happened in
        # every rolling 15-minute lookback" — true for as long as refusals keep
        # recurring, and it self-clears within 15m of the LAST refusal (so a
        # single isolated blip cannot satisfy `for: 20m` and cannot page). This
        # is independent of bot count (fires on even a single bot's blackout)
        # and tolerant of a cadence bump up to ~15m before needing revisiting —
        # a 3x cushion over today's 300s default, vs. the old expr's zero
        # cushion. If NET_WORTH_SAMPLE_INTERVAL_SECS is ever raised past ~7m,
        # widen the 15m inner window to stay comfortably above the new cadence.
        expr: sum(increase(fks_spawner_net_worth_stale_skipped_total[15m])) > 0
        for: 20m
        labels:
          severity: warning
          team: trading
          channel: money
        annotations:
          summary: "Net-worth sampling paused: refusals sustained for 20m+"
          description: >
            The sampler is refusing to record net worth. This is the guard
            working as designed (a gap is honest; a fabricated flat line is not)
            — but the treasury series is accumulating a hole.
            THE CAUSE IS NOT NECESSARILY STALENESS. Four refusals share this
            counter and only one of them is about venue age:
              stale       — the bot-stamped figure is older than tolerated
              incomplete  — a venue is missing, so the total is a partial sum
              fake_paper  — a real-money bot reports a PAPER venue, i.e. a key
                            check failed and it is running on fabricated cash
              unaccounted — the bot holds an open position it will not vouch for
            An earlier version of this alert asserted staleness unconditionally
            and sent the operator to venue alerts that cannot fire for three of
            the four. Read the reason before acting.
          runbook: >
            1) Break down the cause first:
               sum by (reason) (increase(fks_spawner_net_worth_stale_skipped_total[30m]))
            2) reason="stale"       -> BotAllVenuesStale / BotVenueStale
               reason="incomplete"  -> a venue never checked in; compare the bot's
                                       /status exchanges[] against expected_venues
               reason="fake_paper"  -> CREDENTIALS. A live bot degraded a venue to
                                       paper; its balances are invented. Check the
                                       venue's API key, then respawn.
               reason="unaccounted" -> the bot reports an open position it cannot
                                       price into net worth; check positions[].
            3) The gap in the treasury series is deliberate in every case.

  # ─────────────────────────────────────────────────────────────────────────
  # Unexplained venue flow — the highest-value item in the 2026-08-18 review
  # (SYNTHESIS.md §2.1: "the precondition for every future money statement,
  # including Gate-B's verdict"). Three consecutive money errors on this
  # platform share one root cause: a number computed from an incomplete flow
  # ledger, then reasoned about as a trading result. This rule targets that
  # root cause directly instead of the symptom.
  #
  # ── The two incidents this was built and validated against ────────────────
  # A) Crypto.com withdrawal (MONEY_REVIEW.md §4.2). Two unbooked legs on
  #    fks_bot_exchange_total_usd{exchange="Crypto.com"}: 54.9→30.66 (2026-08-01
  #    05:10-07:10Z, -44%) and 30.66→0.12 (2026-08-04 08:55-10:55Z, -99.6%).
  #    Kraken and KuCoin-spot were flat throughout both. No offsetting increase
  #    anywhere, no `transfers` row until an operator manually backfilled two
  #    `source=bot_detected` rows on 2026-08-18 — 13 and 17 days late.
  #  B) The Kraken excursion (MONEY_REVIEW.md §4.3), found by review, not by
  #     monitoring: total dropped 74.5→35.8 (2026-07-27 00:05-02:00Z, -52%,
  #     pro-rata across cash AND all three assets) then recovered 35.3→77.3
  #     (2026-07-30 00:40-02:35Z, +115%). KuCoin-spot moved <1% both times.
  #     STILL not in `transfers` as of this rule (root cause undetermined —
  #     candidate is a Kraken-side earn/bonded allocation dropping out of the
  #     balance read, but that requires Kraken's own tx history to confirm).
  #     This rule fires on it regardless of cause: an unexplained step is
  #     exactly what it is built to catch, root-caused or not.
  #
  # ── Why total_usd, not cash or asset value separately ──────────────────────
  # A trade moves value BETWEEN cash and assets within a venue and barely
  # moves the sum; a flow changes the sum with nothing to offset it. Summing
  # cash+assets (which fks_bot_exchange_total_usd already does) is what makes
  # trades invisible to this rule and flows visible — using either component
  # alone would need two rules and would false-fire on ordinary rebalancing.
  #
  # ── Why compare against SIBLING venues, not a fixed % or the book total ────
  # All live venues on a bot hold the same basket (BTC/ETH/SOL), so a real
  # market move hits every venue's total proportionally — verified on
  # 2026-08-19 15:45Z, the largest non-incident move in the 30d window, where
  # Kraken (+5.17%) and KuCoin-spot (+4.91%) moved TOGETHER within 1 point of
  # each other. A flow hits exactly one venue and leaves its siblings flat.
  # So: this venue stepped by more than the threshold, AND it is the ONLY
  # venue on this bot that did — that second clause is what a bare "> 15%"
  # threshold cannot express and is what makes this a flow detector instead of
  # a volatility detector.
  #
  # ── Threshold and window, derived from real data, not guessed ─────────────
  # `offset 2h` / `> 15%`: replayed against the full 30-day retention window
  # at 5-minute resolution (25,069 venue-timestamps across Crypto.com, Kraken,
  # KuCoin-spot): the worst ordinary (non-incident) 2h move was 5.17%
  # (Kraken, the paired market move above) — 15% sits ~3x above that ceiling.
  # All four incident legs cleared it by 3x-20x (44%, 99.6%, 52%, 115%) and
  # each stayed continuously true for 115-120 minutes, so `for: 15m` is a
  # comfortable trigger with margin to spare, not a hair-trigger.
  #
  # ── Validation (the acceptance test, not a spot-check) ─────────────────────
  # Ran the full compound expr (step + sibling-exclusivity) as a range query
  # over the entire 30-day retention window at 5-minute resolution:
  #   total eval points (3 venues x 30d x 5m):  25,069
  #   points where the rule condition was true:     98  (0.39% duty cycle)
  #   ALL 98 fall inside the four known incident windows above, 0 elsewhere
  #   -> measured false-positive rate: 0.00% over 30 days of real operation
  #   -> measured true-positive rate: fires on both incidents, both directions
  #      (Kraken's drop AND its recovery both correctly flag as unexplained
  #      flows, since neither has a transfers row)
  # Re-run this validation query if the live venue set changes — the 5.17%
  # noise ceiling is specific to today's basket and venue count.
  #
  # ── Why this stays in Prometheus instead of joining `transfers` ────────────
  # The honest options were: (a) have the spawner emit a metric that already
  # nets out recorded transfers, or (b) alert on the unexplained step alone
  # and let the runbook say "check /transfers; if it was you, record it."
  # Chose (b). Prometheus cannot see the `transfers` table (it lives in
  # fks_db/Postgres) short of a new spawner-exported metric and schema
  # coupling for a single alert; (b) is simpler, ships now, and — per
  # MONEY_REVIEW.md §4.7 — a low true-positive rate that prompts a ledger
  # entry is exactly the desired behaviour, since the missing ledger entry
  # IS the bug both incidents above share. If this rule's false-positive rate
  # ever climbs (e.g. more venues, more legitimate one-off venue-specific
  # events like earn/staking allocations), that is the trigger to revisit (a).
  #
  # ── Known, accepted limitations (say them out loud) ────────────────────────
  #  - A bot with only ONE live venue gets NO market-move discrimination from
  #    this rule (there is no sibling to compare against) — it degrades to a
  #    bare volatility trip-wire for that bot. Not today's fleet (crypto-spot
  #    carries 2 live venues; the only single-venue bot, crypto-funding, is
  #    mode="paper" and already excluded). Would need a price-benchmark-based
  #    approach instead if a single-venue live bot is ever added.
  #  - `== 1` (exactly one venue moved) means TWO simultaneous, independent,
  #    unrelated flows on different venues of the same bot in the same 2h
  #    window would both go undetected (count would be 2, read as a market
  #    move). Accepted as rare; a `<` formulation closes this but silently
  #    can never fire for the single-venue case above, which is the more
  #    likely gap given today's fleet — see the trade-off note kept alongside
  #    this rule in the PR that introduced it.
  #  - A flow spread across many small increments, each under 15% within any
  #    given 2h window, will not cross the threshold. Same shape of gap as
  #    IngestionThroughputLow's sudden-collapse-only coverage.
  # ─────────────────────────────────────────────────────────────────────────
  - name: bot-flow-detection
    rules:
      - alert: BotVenueUnexplainedFlow
        expr: |
          (
            abs(fks_bot_exchange_total_usd{mode!="paper"} - (fks_bot_exchange_total_usd{mode!="paper"} offset 2h))
            /
            (fks_bot_exchange_total_usd{mode!="paper"} offset 2h)
          ) > 0.15
          and on (bot_id)
          count by (bot_id) (
            (
              abs(fks_bot_exchange_total_usd{mode!="paper"} - (fks_bot_exchange_total_usd{mode!="paper"} offset 2h))
              /
              (fks_bot_exchange_total_usd{mode!="paper"} offset 2h)
            ) > 0.15
          ) == 1
        for: 15m
        labels:
          severity: warning
          team: trading
          channel: money
        annotations:
          summary: "Bot {{ $labels.bot_id }}: {{ $labels.exchange }} total stepped {{ $value | humanizePercentage }} in 2h with no sibling move — unrecorded flow?"
          description: >
            {{ $labels.exchange }} on {{ $labels.bot_id }} moved {{ $value | humanizePercentage }}
            against its own value 2 hours ago, sustained for 15+ minutes, while
            every OTHER live venue on this bot stayed under the same threshold.
            All live venues hold the same basket, so a real market move hits
            them proportionally — this venue moving alone is the signature of
            a deposit or withdrawal that was never recorded, not a price move
            and not ordinary trading (a trade moves cash<->assets within a
            venue and barely changes the total). This does NOT check the
            `transfers` table — Prometheus cannot see Postgres — so it alerts
            on the step alone and leaves confirmation to the operator.
          # Literal block: one numbered step per line, so the Discord payload
          # is a readable checklist (same convention as NetWorthSamplerNotWriting).
          runbook: |
            1) Check GET /transfers (or the webui /treasury page) for a row on this account_id near this timestamp — it may already be recorded.
            2) If NOT recorded and this was a real operator action: POST /transfers with source=manual, e.g. curl -X POST http://spawner:8090/transfers -H 'Content-Type: application/json' -d '{"account_id":"<bot_id>","amount":<signed USD, + in/- out>,"kind":"withdrawal|deposit","source":"manual","note":"..."}'
            3) If NOT recorded and no operator action is known: it is still a real, unexplained step — record it provisionally with source=bot_detected (see the two Crypto.com rows from 2026-08-18 for the note format) so /profit stops silently booking it as a trading result, then investigate the cause (exchange-side earn/staking reallocation, a partial balance read, an API key/permission change) with that venue directly.
            4) Confirm it truly was NOT proportional: compare against sibling venues' fks_bot_exchange_total_usd over the same window.
            5) Forgetting step 2/3 is the exact bug this rule exists to catch (Crypto.com's ledger entries were 13-17 days late) — do not close this out without a transfers row either way.

  # ─────────────────────────────────────────────────────────────────────────
  # Net-worth sampler liveness — the failure class where every guard is green
  #
  # Every existing rule that could notice the treasury going dark counts
  # REFUSALS. NetWorthSamplingPausedTooLong reads
  # fks_spawner_net_worth_stale_skipped_total, which only moves when the sampler
  # DECIDED not to write. Two paths in fks-spawner's net_worth.rs produce no
  # refusal at all:
  #
  #   • `docker.list_bots()` fails → the sweep returns early. It deliberately
  #     does NOT retire fks_bot_venue_status_age_seconds, because retiring the
  #     series on a transient Docker error would flap it (and
  #     BotVenueFreshnessMissing) once a minute. That is the right call — but
  #     its consequence is that a PERSISTENT Docker-API failure leaves every
  #     venue age FROZEN at whatever fresh-looking value it last held.
  #   • `record_net_worth()` insert fails → `warn!` only, no counter, no gauge.
  #
  # In either case the entire guard set reads green while the treasury series
  # stops and the bot's blindness becomes unobservable:
  #     BotAllVenuesStale             ages frozen BELOW 540   → green
  #     BotVenueStale                 same                    → green
  #     BotVenueFreshnessMissing      series present, frozen  → green
  #     NetWorthSamplingPausedTooLong skip counter flat       → green
  #     SpawnerDown                   spawner is up (up=1)    → green
  # That is the 2026-07-27 symptom with ZERO alerts instead of 17.5 hours of
  # firing. So this rule reads the WRITE side — the sampler ceasing to append
  # rows — instead of the refusal side.
  #
  # ── Threshold ────────────────────────────────────────────────────────────
  # The sampler sweeps every NET_WORTH_SAMPLE_INTERVAL_SECS (default 300) and
  # writes one row per running bot that reports net worth. Measured steady state
  # on this Prometheus: increase(...[1h]) = 24, i.e. 2 bots × 12 sweeps/h.
  # A 45m window is 9 consecutive missed sweeps; `for: 10m` puts total required
  # silence at ~55m. Slow on purpose — the thing it replaces was 17.5h.
  #
  # ── Why increase(), and why the two `and` guards ──────────────────────────
  # `increase()` and not `delta()`/`x - x offset 45m`: the counter RESETS to 0
  # every time the spawner container is recreated (there was a rebuild on
  # 2026-07-31). A subtraction goes NEGATIVE across a reset and would fire;
  # increase() applies reset correction and stays positive. Verified against
  # the 2026-07-09T00:39Z reset (18 → 0, no scrape gap): expr stays empty.
  #
  # Reset correction is NOT enough on its own, because a spawner OUTAGE longer
  # than the window leaves the window containing only post-restart zeros, and
  # increase() over an all-zero window is a legitimate 0. Replayed against real
  # history: on 2026-07-08 the spawner was down from before 22:30Z until
  # 23:44Z, restarted at counter=0, and did not write until 23:54Z. The bare
  # `increase(...[45m]) == 0` MATCHES for 8 minutes there (23:45Z–23:53Z) — a
  # page for a spawner that had just come back and was working fine.
  #   guard 1: `fks_spawner_net_worth_snapshots_total offset 45m` — a set
  #            operator, so it tests EXISTENCE, not value. It says "the spawner
  #            was already being scraped at the far edge of the window", which
  #            is precisely what makes a flat counter meaningful. Empty during
  #            that replay → suppressed. Scrape-interval independent, unlike a
  #            count_over_time() sample-count guard, which would silently
  #            disarm the whole rule if the scrape interval were ever raised.
  #   guard 2: `fks_spawner_running_bots > 0` — no bots running means zero rows
  #            is correct, not a fault; without it every maintenance window
  #            pages, and a channel that is red during maintenance is a channel
  #            the operator learns to ignore.
  #            IMPORTANT COUPLING: this guard is safe for the Docker-API failure
  #            above only because supervisor::tick() returns WITHOUT touching
  #            RUNNING_BOTS when list_bots() fails, so the gauge FREEZES at its
  #            last value rather than dropping to 0. If fks-spawner is ever
  #            changed to zero that gauge on a Docker error, this guard becomes
  #            a silencer for the exact incident the rule exists to catch.
  #
  # Backtested over the full 30d retention at 60s resolution: the guarded expr
  # matches at 0 eval points; the unguarded form matches at 9.
  #
  # ── What this rule does NOT cover (say it out loud) ───────────────────────
  # fks_spawner_net_worth_snapshots_total is UNLABELLED, so this can only see a
  # TOTAL stop. If the sampler keeps writing for the paper funding bot while it
  # stops writing for the real-money spot bot, the counter keeps climbing and
  # this rule stays green. Closing that needs a per-bot counter in fks-spawner
  # (fks_spawner_net_worth_snapshots_total{bot_id=...}); until that exists this
  # rule is honestly scoped to global cessation and this paragraph is the
  # record of the remaining hole.
  #
  # That hole is not theoretical, and the 2026-07-27 incident is the proof:
  # increase(fks_spawner_net_worth_snapshots_total[1h]) fell from 24/h to 12/h
  # and STAYED there, because one bot was still being sampled while the other
  # was refused. This rule would NOT have fired that day. 2026-07-27 was the
  # REFUSAL path — fks_spawner_net_worth_stale_skipped_total was climbing from
  # 05:30Z to 00:30Z, ~19h — and NetWorthSamplingPausedTooLong covered it
  # correctly. What is added here is coverage for the SILENT variant of the same
  # symptom, which nothing could see before. The two rules are complements, not
  # duplicates; neither one is a substitute for the other.
  #
  # Rejected alternative for that hole: detect the frozen gauge directly with
  # `changes(fks_bot_venue_status_age_seconds[30m]) == 0`. Measured against 7
  # days of live data, that predicate is already true at 476 of 2016 5-minute
  # eval points for crypto-spot/KuCoin-spot (23.6%), 283 for Crypto.com and 215
  # for Kraken — because age = now - updated can land on the same integer across
  # consecutive probes. A rule that is true a quarter of the time is worse than
  # no rule, so it is not here.
  # ─────────────────────────────────────────────────────────────────────────
  - name: net-worth-sampler-liveness
    rules:
      - alert: NetWorthSamplerNotWriting
        expr: |
          increase(fks_spawner_net_worth_snapshots_total[45m]) == 0
            and (fks_spawner_net_worth_snapshots_total offset 45m)
            and (fks_spawner_running_bots > 0)
        for: 10m
        labels:
          severity: critical
          team: trading
          channel: money
        annotations:
          summary: "Net-worth sampler has written NOTHING for 45m while bots are running"
          description: >
            fks_spawner_net_worth_snapshots_total has not moved for 45 minutes
            while the spawner is up and reporting running bots. The sampler is
            not appending rows and is not refusing them either — the refusal
            counter is the OTHER alert. Suspect the Docker API (a failed
            list_bots aborts the sweep with no counter and no log-visible gauge
            change) or the Postgres insert path. While this persists the
            treasury series has a hole AND every venue-freshness age is frozen
            at its last value, which means BotAllVenuesStale, BotVenueStale and
            BotVenueFreshnessMissing are all reading green on stale data and are
            NOT covering the bots right now. Treat every other bot alert as
            unreliable until this clears.
          # Literal block: one numbered step per line, so the Discord payload is
          # a readable checklist and the promtool test can pin the exact string.
          runbook: |
            1) Is it refusals after all? increase(fks_spawner_net_worth_stale_skipped_total[45m]) — if that is climbing the cause is venue staleness, not the write path; work BotAllVenuesStale / BotVenueStale instead.
            2) Docker API: docker logs fks_bot_spawner --since 1h | grep -iE 'failed to list bots|list_bots'
            3) Postgres write path: same logs, grep -i 'insert failed'; then check the fks_db connection pool and disk.
            4) Confirm the hole: SELECT max(ts) FROM net_worth_snapshots;
            5) fks_bot_venue_status_age_seconds is FROZEN, not fresh — do not read it as evidence the venues are healthy.
