# Prometheus Configuration for FKS Trading Platform
# Scrapes metrics from FKS services and database exporters

global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
    external_labels:
        cluster: "fks-local"
        environment: "development"

# AlertManager configuration
alerting:
    alertmanagers:
        - static_configs:
              - targets:
                    - alertmanager:9093
          timeout: 10s

# Load alert rules
rule_files:
    - "/etc/prometheus/alerts/*.yml"

# Scrape configurations
scrape_configs:
    # ============================================================================
    # Prometheus self-monitoring
    # ============================================================================
    - job_name: "prometheus"
      static_configs:
          - targets: ["localhost:9090"]
            labels:
                service: "prometheus"

    # ============================================================================
    # FKS Janus Service (unified: signals, execution, optimizer)
    #
    # The janus container exposes a single /metrics endpoint on port 9090
    # that aggregates metrics from all internal modules (forward, backward,
    # data, cns, api, optimizer, execution).  Previous separate targets for
    # "fks-execution" and "fks-optimizer" have been merged here since those
    # components now run inside the unified janus binary.
    # ============================================================================
    - job_name: "fks-janus"
      scrape_interval: 10s
      scrape_timeout: 5s
      metrics_path: "/metrics"
      static_configs:
          - targets: ["janus:9090"]
            labels:
                service: "janus"
                component: "signals"

    # ============================================================================
    # PostgreSQL Exporter - Database metrics
    # ============================================================================
    - job_name: "postgres"
      scrape_interval: 30s
      scrape_timeout: 10s
      static_configs:
          - targets: ["postgres-exporter:9187"]
            labels:
                service: "postgres"
                component: "database"

    # ============================================================================
    # Redis Exporter - Cache and Pub/Sub metrics
    # ============================================================================
    - job_name: "redis"
      scrape_interval: 15s
      scrape_timeout: 5s
      static_configs:
          - targets: ["redis-exporter:9121"]
            labels:
                service: "redis"
                component: "cache"

    # ============================================================================
    # QuestDB Direct - Native metrics endpoint
    # NOTE: The questdb-exporter sidecar (port 9191) is not deployed.  QuestDB
    # exposes Prometheus-compatible metrics natively at :9003/metrics.
    # The QuestDBDown alert uses job=~"questdb.*" which matches this job.
    # ============================================================================
    - job_name: "questdb-direct"
      scrape_interval: 30s
      scrape_timeout: 10s
      metrics_path: "/metrics"
      static_configs:
          - targets: ["questdb:9003"]
            labels:
                service: "questdb"
                component: "timeseries"

    # ============================================================================
    # Ruby Data Service - FastAPI metrics (request count, latency, SSE, etc.)
    # ============================================================================
    # NOTE: fks_ruby was consolidated into fks_ruby (supervisord multi-service
    # container).  The data FastAPI app still exposes /metrics/prometheus on
    # port 8000.  Target updated from fks_ruby:8000 → fks_ruby:8000.
    - job_name: "data-service"
      scrape_interval: 10s
      metrics_path: "/metrics/prometheus"
      static_configs:
          - targets: ["fks_ruby:8000"]
            labels:
                service: "data-service"
                component: "api"

    # ============================================================================
    # FKS DataFactory — gap scanner, backfill, cache warmer, reconciler metrics
    #
    # The factory coordinator runs inside fks_ruby under supervisord and exposes
    # Prometheus text-format metrics at /factory/metrics on the same port 8000
    # FastAPI app as the data service (the endpoint is registered in data/main.py).
    # Metrics: fks_factory_gap_count, fks_factory_fill_lag_seconds,
    #          fks_factory_chunk_total, fks_factory_chunk_failures,
    #          fks_factory_redis_cache_age_seconds, fks_factory_reconcile_divergence,
    #          fks_factory_last_gap_scan_age_seconds
    # ============================================================================
    - job_name: "fks-factory"
      scrape_interval: 60s
      scrape_timeout: 10s
      metrics_path: "/factory/metrics"
      static_configs:
          - targets: ["fks_ruby:8000"]
            labels:
                service: "fks-factory"
                component: "data-pipeline"

    # ============================================================================
    # Ruby Trainer - GPU CNN training server metrics
    #
    # Exposes Prometheus text-format metrics at /metrics/prometheus including:
    # trainer_up, trainer_uptime_seconds, trainer_status (labelled),
    # trainer_gpu_available, trainer_gpu_memory_total_bytes,
    # trainer_champion_exists, trainer_last_run_accuracy/precision/recall,
    # trainer_last_run_promoted, trainer_last_run_images.
    # ============================================================================
    - job_name: "trainer"
      scrape_interval: 30s
      scrape_timeout: 10s
      metrics_path: "/metrics/prometheus"
      static_configs:
          - targets: ["trainer:8200"]
            labels:
                service: "trainer"
                component: "training"

    # ============================================================================
    # Ruby Engine Service - ML engine metrics (regime, CNN inference, optimizer)
    #
    # NOTE: fks_engine is a background worker with no HTTP port. It pushes
    # metrics into Redis; they are exposed via the data service at /metrics/prometheus.
    # This job is intentionally disabled — engine metrics surface under data-service.
    # Re-enable if a dedicated engine HTTP metrics port is added in future.
    # ============================================================================
    # - job_name: "ruby-engine"
    #   scrape_interval: 15s
    #   scrape_timeout: 10s
    #   metrics_path: "/metrics/prometheus"
    #   static_configs:
    #       - targets: ["fks_engine:8000"]
    #         labels:
    #             service: "ruby-engine"
    #             component: "ml"

    # ============================================================================
    # Charting Service - Nginx static asset server for TradingView charts
    # ============================================================================
    # charting — static nginx file server, no /metrics endpoint
    # Disabled: fks_charting:8003 serves TradingView HTML, not Prometheus metrics.
    # - job_name: "charting"
    #   scrape_interval: 30s
    #   scrape_timeout: 10s
    #   metrics_path: "/metrics"
    #   static_configs:
    #       - targets: ["fks_charting:8003"]
    #         labels:
    #             service: "charting"
    #             component: "charts"

    # ============================================================================
    # FKS Bot Spawner — spawner service self-metrics
    #
    # Exposes Prometheus text-format metrics at /metrics including:
    #   fks_spawner_spawns_total, fks_spawner_spawn_errors_total,
    #   fks_spawner_stops_total, fks_spawner_removes_total,
    #   fks_spawner_running_bots, fks_spawner_spawn_duration_seconds
    # ============================================================================
    - job_name: "fks-spawner"
      scrape_interval: 15s
      scrape_timeout: 5s
      metrics_path: "/metrics"
      static_configs:
          - targets: ["fks_bot_spawner:8090"]
            labels:
                service: "fks-spawner"
                component: "bot-lifecycle"

    # ============================================================================
    # FKS Bot Containers — dynamic file-based service discovery
    #
    # The spawner writes /prometheus-sd/bots.json on every spawn/stop.
    # Prometheus picks up new bot targets automatically without a reload.
    # Each bot container exposes :9091/metrics with:
    #   fks_bot_pnl_dollars        current P&L
    #   fks_bot_signals_total      cumulative signals (counter)
    #   fks_bot_trades_total       cumulative trades  (counter)
    #   fks_bot_win_rate           win rate 0.0–1.0
    #   fks_bot_uptime_seconds     seconds since container start
    #
    # Volume mount required in docker-compose.yml:
    #   prometheus: prometheus_sd:/etc/prometheus/sd
    #   spawner:    prometheus_sd:/prometheus-sd
    # ============================================================================
    - job_name: "fks-bots"
      scrape_interval: 30s
      scrape_timeout: 10s
      metrics_path: "/metrics"
      file_sd_configs:
          - files:
                - "/etc/prometheus/sd/bots.json"
            refresh_interval: 30s
      relabel_configs:
          # Preserve bot metadata as human-readable labels
          - source_labels: [__meta_fks_image]
            target_label: image
          - source_labels: [bot_id]
            target_label: bot_id
          - source_labels: [mode]
            target_label: mode
          - source_labels: [container_name]
            target_label: container_name
