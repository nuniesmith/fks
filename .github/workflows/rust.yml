# =============================================================================
# Rust CI — per-workspace check / test / clippy / fmt
# =============================================================================
# fks keeps a few Cargo workspaces (src/proto, crates/spawner, and the
# standalone bots/fks-bot-example that consumes the published crates). This
# workflow runs each one's compile + test gate independently. The framework /
# brain / TA / exchange crates live in their own repos (see SPLIT_PLAN.md).
#
# Trigger: PRs against main, plus pushes to main.
# Concurrency: in-flight runs on the same ref are cancelled when a new
# commit lands.
# =============================================================================

name: 🦀 Rust

on:
    pull_request:
        # Skip the matrix when the diff is doc/config only — saves ~10 minutes
        # of CI per doc PR (janus alone takes ~8 minutes to build).
        paths-ignore:
            - "**.md"
            - "LICENSE"
            - "**/LICENSE"
            - ".gitignore"
            - "docs/**"
            - "mkdocs.yml"
            - ".github/labeler.yml"
            - ".github/workflows/labeler.yml"
            - ".github/workflows/paper-trading-test.yml"
    push:
        branches: [main]
        # Same skip on push so a doc-only merge to main doesn't re-trigger
        # the full matrix.
        paths-ignore:
            - "**.md"
            - "LICENSE"
            - "**/LICENSE"
            - ".gitignore"
            - "docs/**"
            - "mkdocs.yml"
            - ".github/labeler.yml"
            - ".github/workflows/labeler.yml"
            - ".github/workflows/paper-trading-test.yml"

concurrency:
    group: rust-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
    # sqlx in spawner uses runtime (string) queries, not compile-time macros,
    # so DATABASE_URL is not required at build time. Set SQLX_OFFLINE just
    # in case a future query! macro is added — it'll fall back to the cached
    # metadata instead of trying to reach a live database.
    SQLX_OFFLINE: "true"

jobs:
    # -------------------------------------------------------------------------
    # Per-workspace check / test / clippy
    # -------------------------------------------------------------------------
    check:
        name: ${{ matrix.workspace }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    # `lock_flag` controls whether `cargo` runs with `--locked`.
                    #   true  — workspace has a committed Cargo.lock (binary-producing)
                    #   false — library-shaped workspace without a committed lockfile;
                    #           --locked would fail because cargo has to generate
                    #           the lockfile from scratch.
                    - workspace: "root · src/proto"
                      path: "."
                      needs_protoc: true
                      lock_flag: "--locked"
                    - workspace: "fks-bot-example"
                      path: "bots/fks-bot-example"
                      needs_protoc: false
                      # Standalone bot consuming the published rustrade-framework
                      # from crates.io — proves end-to-end consumption. Committed
                      # Cargo.lock pins the deps for reproducible image builds.
                      lock_flag: "--locked"
                    - workspace: "crypto-demo"
                      path: "bots/crypto-demo"
                      needs_protoc: false
                      # Working demo bot: rustrade + indicators-ta + exchange-apiws
                      # from crates.io, paper-traded. Committed lock for repro builds.
                      lock_flag: "--locked"
                    - workspace: "rustrade-exchange-apiws"
                      path: "bots/rustrade-exchange-apiws"
                      needs_protoc: false
                      # rustrade ExchangeClient over exchange-apiws (the live KuCoin
                      # order path). crypto-demo path-depends on it, but that job only
                      # *compiles* it as a dep — this entry runs its own tests/clippy.
                      # Committed lock keeps the run reproducible like the bots.
                      lock_flag: "--locked"
                    - workspace: "spawner"
                      path: "crates/spawner"
                      needs_protoc: false
                      lock_flag: "--locked"
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4

            - name: 🦀 Install Rust toolchain (stable)
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: 🔧 Install protoc
              if: ${{ matrix.needs_protoc }}
              uses: arduino/setup-protoc@v3
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: 🗄️ Cargo cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: ${{ matrix.path }}
                  # Distinguish caches per workspace so a clean clippy run in
                  # one doesn't poison another's incremental cache.
                  prefix-key: ${{ matrix.workspace }}

            - name: 🧪 cargo check
              working-directory: ${{ matrix.path }}
              run: cargo check --workspace --all-targets ${{ matrix.lock_flag }}

            - name: 🧪 cargo test
              working-directory: ${{ matrix.path }}
              run: cargo test --workspace ${{ matrix.lock_flag }}

            - name: 🔍 cargo clippy (-D warnings)
              working-directory: ${{ matrix.path }}
              # Blocking gate: every workspace in the matrix is clippy-clean under
              # `-D warnings` (root·proto, fks-bot-example, crypto-demo,
              # rustrade-exchange-apiws, spawner), so a newly-introduced lint now
              # fails CI. The proto crate allows `doc_lazy_continuation` crate-wide
              # for tonic-generated docs (see src/proto/src/lib.rs).
              run: cargo clippy --workspace --all-targets ${{ matrix.lock_flag }} -- -D warnings

    # -------------------------------------------------------------------------
    # cargo fmt — runs per workspace using --manifest-path so the formatter
    # doesn't follow path deps into sibling workspaces (`cargo fmt --all`
    # follows path-based dependencies, which would otherwise make this job
    # touch files outside the workspace under test).
    # -------------------------------------------------------------------------
    fmt:
        name: rustfmt
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4

            - name: 🦀 Install Rust toolchain (stable)
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - name: 🎨 cargo fmt --check (per workspace)
              shell: bash
              run: |
                  set -e
                  for ws in . bots/fks-bot-example bots/crypto-demo bots/rustrade-exchange-apiws crates/spawner; do
                      printf "\n===> %s\n" "$ws"
                      # `--manifest-path` keeps fmt scoped to THIS workspace's
                      # members — without it, `--all` follows path deps into
                      # sibling workspaces (e.g. running from rustrade would
                      # try to format exchange-apiws/auth.rs too).
                      cargo fmt --all --manifest-path "$ws/Cargo.toml" -- --check
                  done
